name: contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate samples
        run: python scripts/validate.py samples/fictional/data.json
      - name: Build sample viewer
        run: python scripts/build.py --data samples/fictional/data.json --out build-check --name index.html
      - name: Generate anomalies
        run: python scripts/anomalies.py --data samples/fictional/data.json --out build-check/anomalies.json
      - name: Map levels
        run: python scripts/map_levels.py --data samples/fictional/data.json
      - name: Build reader
        run: python scripts/build_reader.py --data samples/fictional/data.json --out build-reader --single --allow-partial
