<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Atlas · 网文设定图谱</title>
<style>/*__ATLAS_CSS__*/</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 id="title">—</h1>
    <span class="tag" id="tag">—</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab on" data-view="graph">图谱</button>
    <button class="tab" data-view="wiki">百科</button>
    <button class="tab" data-view="geo">地点志</button>
    <button class="tab" data-view="map">地图</button>
    <button class="tab" data-view="power">版图</button>
    <button class="tab" data-view="rhythm">节奏</button>
    <button class="tab" data-view="realms">境界</button>
    <button class="tab" data-view="foreshadow">伏笔<span class="dot" id="fsDot" hidden></span></button>
  </div>
  <input type="search" id="search" placeholder="搜索人物 / 别名">
</header>

<main>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="graphTools">
      <span class="gt-label">范围</span>
      <button id="scopeCore" class="on">核心</button>
      <button id="scopeAll">全部</button>
      <select id="groupFilter" title="只看某个势力"></select>
    </div>
    <div id="legend"></div>
    <div id="hint">拖拽节点 · 滚轮缩放 · 悬停连线看关系 · 点击查看</div>
  </div>

  <div id="wiki" class="view" hidden></div>
  <div id="geo" class="view" hidden></div>
  <div id="map" class="view" hidden></div>
  <div id="power" class="view" hidden></div>
  <div id="rhythm" class="view" hidden></div>
  <div id="realms" class="view" hidden></div>
  <div id="foreshadow" class="view" hidden></div>

  <aside id="panel">
    <button class="panel-close" id="panelClose">×</button>
    <div id="panelBody"></div>
  </aside>
</main>

<script src="./data.js"></script>
<script>/*__ATLAS_JS__*/</script>
</body>
</html>
