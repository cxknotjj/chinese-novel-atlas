<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Atlas · 读者世界档案</title>
<style>/*__ATLAS_CSS__*/</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 id="title">—</h1>
    <span class="tag" id="tag">—</span>
  </div>
  <div class="stats" id="stats"></div>
  <a class="gh-star-strip" href="https://github.com/cxknotjj/chinese-novel-atlas" target="_blank" rel="noopener noreferrer" aria-label="觉得好用的话，就给个 Star 吧：在 GitHub 打开 cxknotjj/chinese-novel-atlas">
    <svg class="gh-star-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/>
    </svg>
    <span class="gh-star-text">觉得好用的话，就给个 <b>Star</b> 吧</span>
    <span class="gh-star-repo">github.com/cxknotjj/chinese-novel-atlas</span>
    <span class="gh-star-arrow" aria-hidden="true">↗</span>
  </a>
  <div class="tabs">
    <button class="tab on" data-view="home">总览</button>
    <button class="tab" data-view="graph">图谱</button>
    <button class="tab" data-view="wiki">百科</button>
    <button class="tab" data-view="geo">地点志</button>
    <button class="tab" data-view="map">地图</button>
    <button class="tab" data-view="power">版图</button>
    <button class="tab" data-view="rhythm">节奏</button>
    <button class="tab" data-view="realms">境界</button>
    <button class="tab" data-view="foreshadow">伏笔<span class="dot" id="fsDot" hidden></span></button>
  </div>
  <input type="search" id="search" placeholder="搜索全书：人物 / 地点 / 设定 / 伏笔">
</header>

<div id="readerBar">
  <div class="reader-progress">
    <span class="rp-label">阅读进度</span>
    <button id="cutoffPrev" class="rp-step" title="向前 10 章">−10</button>
    <input id="cutoff" type="range" min="1" max="1" value="1" step="1">
    <button id="cutoffNext" class="rp-step" title="向后 10 章">+10</button>
    <b id="cutoffLabel">第 1 章</b>
    <button id="cutoffAll" class="rp-all">全书</button>
  </div>
  <div id="readerHint" class="reader-hint">只显示当前进度之前的人物、地点、关系和地图层</div>
</div>

<div id="searchPanel" hidden></div>

<main>
  <div id="home" class="view"></div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="graphTools">
      <span class="gt-label">范围</span>
      <button id="scopeCore" class="on">核心</button>
      <button id="scopeAll">全部</button>
      <select id="groupFilter" title="只看某个势力"></select>
    </div>
    <div id="legend"></div>
    <button id="legendToggle" class="legend-toggle" type="button" aria-controls="legend" aria-expanded="false">图例</button>
    <div id="hint">拖拽节点 · 滚轮缩放 · 悬停连线看关系 · 点击查看</div>
  </div>

  <div id="wiki" class="view" hidden></div>
  <div id="geo" class="view" hidden></div>
  <div id="map" class="view" hidden></div>
  <div id="power" class="view" hidden></div>
  <div id="rhythm" class="view" hidden></div>
  <div id="realms" class="view" hidden></div>
  <div id="foreshadow" class="view" hidden></div>
  <div id="anomalies" class="view" hidden></div>

  <aside id="panel">
    <button class="panel-close" id="panelClose">×</button>
    <div id="panelBody"></div>
  </aside>
</main>

<script src="./data.js"></script>
<script>/*__ATLAS_JS__*/</script>
</body>
</html>
