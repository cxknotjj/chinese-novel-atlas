<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凡人修仙传 · Novel Atlas</title>
<style>
  :root {
    --paper: #FAF9F5;
    --ink: #2B2A26;
    --ink-2: #6B675E;
    --ink-3: #9A9488;
    --line: #E3DFD5;
    --crimson: #A6314A;
    --indigo: #3D6B7D;
    --gold: #B8925A;
    --danger: #C0392B;
    --ok: #5A7A5E;
  }
  * { box-sizing: border-box; }
  /* hidden 属性必须真的隐藏。本文件里 .map-fallback / .map-tray 等用了 display:flex，
     类选择器优先级高于 UA 的 [hidden]{display:none}，会让一个 position:absolute;inset:0
     的透明层盖住地图画布，吃掉滚轮与右键事件。 */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--paper); color: var(--ink); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 实体类型图标：人物 / 势力 / 器物 / 妖兽 */
  .entity-icon {
    display: inline-flex; align-items: center; justify-content: center;
    flex: none; width: 16px; height: 16px;
    color: var(--ink-2); vertical-align: -3px;
  }
  .entity-icon svg {
    width: 100%; height: 100%; display: block;
    fill: none; stroke: currentColor; stroke-width: 1.65;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .entity-icon-character { color: var(--crimson); }
  .entity-icon-org { color: var(--indigo); }
  .entity-icon-item { color: var(--gold); }
  .entity-icon-creature { color: var(--ok); }
  .entity-icon-sm { width: 14px; height: 14px; }
  .entity-icon-lg { width: 20px; height: 20px; }

  header {
    height: 56px; display: flex; align-items: center; gap: 16px;
    padding: 0 20px; border-bottom: 1px solid var(--line);
    background: rgba(250,249,245,0.94); backdrop-filter: blur(8px);
    flex-wrap: nowrap; overflow: hidden; flex: none; width: 100%;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; flex: none; }
  .brand h1 { font-size: 16px; font-weight: 500; margin: 0; white-space: nowrap; }
  .brand .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: #F2EFE7; color: var(--ink-2); white-space: nowrap;
  }
  .stats { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex: none; }
  .stats b { font-weight: 500; color: var(--ink); }
  .stats .cov b { color: var(--crimson); }
  .stats span { white-space: nowrap; }

  .tabs { display: flex; gap: 1px; margin-left: auto; flex: none; }
  .tab {
    padding: 6px 12px; font-size: 12.5px; color: var(--ink-2);
    background: none; border: none; border-radius: 6px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .tab:hover { background: rgba(0,0,0,0.035); }
  .tab.on { background: var(--ink); color: #fff; }
  .tab .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--danger); margin-left: 5px; vertical-align: middle;
  }

  /* ---------- 读者进度条 ---------- */
  #readerBar {
    height: 38px; display: flex; align-items: center; gap: 14px;
    padding: 0 20px; border-bottom: 1px solid var(--line);
    background: #F6F3EB; color: var(--ink-2);
    font-size: 11.5px; overflow: hidden; flex: none;
  }
  #readerBar .reader-progress { display: flex; align-items: center; gap: 7px; flex: none; }
  #readerBar .rp-label { color: var(--ink-3); letter-spacing: .04em; }
  #readerBar input[type=range] {
    width: clamp(120px, 22vw, 320px); accent-color: var(--crimson);
    cursor: pointer;
  }
  #readerBar .rp-step, #readerBar .rp-all {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: 5px; font: inherit; padding: 2px 7px; cursor: pointer;
  }
  #readerBar .rp-step:hover, #readerBar .rp-all:hover { border-color: #C9C2B2; }
  #readerBar .rp-step:disabled, #readerBar .rp-all:disabled { opacity: .4; cursor: default; }
  #readerBar #cutoffLabel { color: var(--ink); font-weight: 500; white-space: nowrap; }
  #readerBar .reader-hint {
    color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #readerBar .is-future { color: var(--danger); }

  main { display: flex; flex: 1; min-width: 0; min-height: 0; width: 100%; position: relative; }

  /* ---------- 总览 / 疑点 ---------- */
  .home-hero {
    border: 1px solid var(--line); border-radius: 14px; background:
      linear-gradient(135deg, #FFFDF8 0%, #F7F1E5 55%, #F1E8D8 100%);
    padding: 28px 30px 24px; margin-bottom: 18px; position: relative; overflow: hidden;
  }
  .home-hero:after {
    content: "舆"; position: absolute; right: 24px; top: 16px; font-size: 54px;
    color: rgba(166,49,74,0.08); font-family: "Songti SC", "STSong", serif;
  }
  .home-kicker { font-size: 10.5px; letter-spacing: .16em; color: var(--ink-3); margin-bottom: 7px; }
  .home-title { font-size: 30px; font-weight: 500; margin: 0 0 8px; letter-spacing: .03em; }
  .home-sub { color: var(--ink-2); font-size: 13px; line-height: 1.8; max-width: 760px; }
  .home-meta { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
  .home-meta b { color: var(--ink); font-weight: 500; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .home-card {
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    padding: 14px 15px; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .home-card:hover { border-color: #C9C2B2; transform: translateY(-1px); }
  .home-card.static { cursor: default; }
  .home-card.static:hover { border-color: var(--line); transform: none; }
  .home-card .hc-k { font-size: 10.5px; letter-spacing: .1em; color: var(--ink-3); }
  .home-card .hc-v { font-size: 16px; margin: 5px 0 2px; color: var(--ink); }
  .home-card .hc-n { font-size: 11.5px; color: var(--ink-2); line-height: 1.7; }
  .home-card.alarm .hc-v { color: var(--danger); }
  .home-note {
    margin: 16px 0 0; border-left: 2px solid var(--gold); padding: 8px 0 8px 12px;
    color: var(--ink-2); font-size: 12px; line-height: 1.8; background: #FCFAF4;
  }
  .anomaly-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .anomaly-sev { font-size: 10px; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .anomaly-sev.high { background: #FBEAE7; color: var(--danger); }
  .anomaly-sev.warning { background: #FBF2E2; color: #9A6A30; }
  .anomaly-sev.info { background: #EEF3F3; color: var(--indigo); }
  .anomaly-card {
    border: 1px solid var(--line); border-radius: 9px; background: #fff;
    padding: 13px 15px; margin-bottom: 9px;
  }
  .anomaly-card .ac-title { font-size: 13.5px; font-weight: 500; margin: 0 0 4px; }
  .anomaly-card .ac-meta { font-size: 11px; color: var(--ink-3); margin-bottom: 7px; }
  .anomaly-card .ac-detail { font-size: 12px; color: var(--ink-2); line-height: 1.8; }
  .anomaly-card .ac-ev { margin-top: 8px; padding: 7px 9px; background: #FBF8F1; border-radius: 5px; font-size: 11px; color: var(--ink-2); line-height: 1.75; }
  .anomaly-card .ac-note { margin-top: 7px; font-size: 11px; color: var(--ink-3); }
  .anomaly-card .ac-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .anomaly-card .ac-actions button {
    border: 1px solid var(--line); background: #fff; border-radius: 5px; font: inherit;
    font-size: 11px; padding: 2px 8px; color: var(--ink-2); cursor: pointer;
  }
  .anomaly-card .ac-actions button:hover { border-color: #C9C2B2; }
  .anomaly-card.verified { opacity: .62; }
  .anomaly-empty { color: var(--ink-3); font-size: 12px; padding: 18px 0; }

  /* ---------- 全书搜索 ---------- */
  #searchPanel {
    position: fixed; top: 98px; right: 20px; width: min(460px, 92vw); max-height: 62vh;
    overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(43,42,38,0.14); z-index: 20; padding: 8px;
  }
  #searchPanel .sp-title { font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; padding: 4px 7px 7px; }
  #searchPanel .sp-row {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12px; line-height: 1.6;
  }
  #searchPanel .sp-row:hover { background: #F7F4EC; }
  #searchPanel .sp-kind { flex: none; font-size: 10px; color: var(--ink-3); width: 32px; padding-top: 2px; }
  #searchPanel .sp-main { min-width: 0; }
  #searchPanel .sp-name { color: var(--ink); font-weight: 500; }
  #searchPanel .sp-desc { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #searchPanel .sp-locked { color: var(--ink-3); cursor: default; }
  #searchPanel .sp-locked .sp-name { color: var(--ink-3); font-weight: 400; }
  #searchPanel .sp-empty { padding: 10px 8px 14px; color: var(--ink-3); font-size: 12px; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #legend {
    position: absolute; left: 16px; bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 4px 11px; max-width: 330px;
    font-size: 11px; color: var(--ink-2); pointer-events: none;
  }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 8px; height: 8px; border-radius: 50%; }
  #legend .legend-types {
    display: flex; flex-wrap: wrap; flex-basis: 100%; gap: 4px 12px; color: var(--ink-3);
    padding-bottom: 3px; margin-bottom: 3px; border-bottom: 1px dashed #E4DFD4;
  }
  #legend .legend-types b { font-weight: 500; color: var(--ink-2); }
  #legend .legend-types .entity-icon { width: 14px; height: 14px; }
  #legend .rel-legend i {
    width: 15px; height: 0; border-radius: 0; background: none !important;
    border-top-width: 1.6px; border-top-style: solid;
  }

  #hint {
    position: absolute; right: 16px; bottom: 16px;
    font-size: 11px; color: var(--ink-3); text-align: right; line-height: 1.7;
    pointer-events: none;
  }

  #graphTools {
    position: absolute; left: 16px; top: 16px; z-index: 6;
    display: flex; align-items: center; gap: 5px;
    padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(250,249,245,0.92); backdrop-filter: blur(6px);
    font-size: 11px; color: var(--ink-3);
  }
  #graphTools .gt-label { margin-right: 2px; }
  #graphTools button {
    border: 1px solid transparent; border-radius: 5px; padding: 3px 7px;
    background: none; color: var(--ink-2); font: inherit; cursor: pointer;
  }
  #graphTools button:hover { background: #F4F1E9; }
  #graphTools button.on { background: #2B2A26; color: #fff; }
  #graphTools select {
    max-width: 110px; border: 1px solid var(--line); border-radius: 5px;
    padding: 3px 5px; background: #fff; color: var(--ink-2);
    font: inherit; outline: none;
  }

  aside {
    display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 348px;
    background: #fff; border-left: 1px solid var(--line);
    box-shadow: -10px 0 30px rgba(43,42,38,0.06);
    overflow-y: auto; padding: 20px 20px 40px; z-index: 5;
  }
  aside.open { display: block; animation: panelIn 0.26s cubic-bezier(.2,.8,.2,1); }
  @keyframes panelIn {
    from { opacity: 0; transform: translateX(16px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes panelBodyIn {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #panelBody.switch-in { animation: panelBodyIn 0.28s cubic-bezier(.2,.8,.2,1); }
  @media (prefers-reduced-motion: reduce) {
    aside.open, #panelBody.switch-in { animation: none; }
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-thumb { background: #E0DCD2; border-radius: 4px; }

  .panel-close {
    position: absolute; top: 14px; right: 16px; width: 22px; height: 22px;
    border: none; background: none; cursor: pointer; color: var(--ink-3);
    font-size: 17px; line-height: 1; font-family: inherit;
  }
  .panel-close:hover { color: var(--ink); }

  .ent-name { font-size: 20px; font-weight: 500; margin: 0 0 4px; padding-right: 26px; display: flex; align-items: center; gap: 7px; }
  .ent-name .entity-icon { margin-top: -2px; }
  .ent-meta { font-size: 11.5px; color: var(--ink-3); margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #F4F1E9; color: var(--ink-2); }
  .chip.grp { color: #fff; }
  .ent-desc { font-size: 13px; line-height: 1.8; color: #45423B; margin: 0 0 16px; }

  .sec-title {
    font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-3);
    margin: 0 0 9px; font-weight: 500;
  }
  .rel-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px dashed #EFEBE1; font-size: 12.5px; cursor: pointer;
  }
  .rel-item:hover .rel-name { color: var(--crimson); }
  .rel-name { display: inline-flex; align-items: center; gap: 4px; }
  .rel-name .entity-icon { width: 12px; height: 12px; }
  .rel-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .rel-label { color: var(--ink-3); font-size: 11px; margin-left: auto; text-align: right; }

  .attrs { font-size: 12px; line-height: 1.95; color: var(--ink-2); }
  .attrs b { color: var(--ink); font-weight: 500; }

  .power-list { font-size: 12px; }
  .power-row {
    display: grid; grid-template-columns: 56px 1fr; gap: 8px;
    padding: 5px 0; border-bottom: 1px dashed #EFEBE1;
  }
  .power-ch { color: var(--ink-3); font-size: 11px; }
  .power-realm { color: var(--ink); }
  .power-note { color: var(--ink-3); font-size: 11px; }

  /* ---------- 通用视图容器 ---------- */
  .view {
    flex: 1; min-width: 0; width: 100%;
    padding: 20px 32px 48px; overflow-y: auto; height: 100%;
  }
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 7px; flex-wrap: wrap; margin: 18px 0 4px;
    font-size: 11.5px; color: var(--ink-3);
  }
  .pager button {
    min-width: 28px; height: 26px; padding: 0 9px;
    border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink-2); cursor: pointer;
    font: inherit; transition: border-color .15s, background .15s;
  }
  .pager button:hover:not(:disabled) { border-color: #C9C2B2; background: #FCFBF7; }
  .pager button.on { background: #2B2A26; border-color: #2B2A26; color: #fff; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .view::-webkit-scrollbar { width: 8px; }
  .view::-webkit-scrollbar-thumb { background: #E0DCD2; border-radius: 4px; }
  .view h2 {
    font-size: 12px; font-weight: 500; color: var(--ink-2);
    margin: 22px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .view h2:first-child { margin-top: 0; }
  .view h2 .n { color: var(--ink-3); font-weight: 400; }

  /* 百科 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 9px; }
  .card {
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px;
    background: #fff; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #C9C2B2; transform: translateY(-1px); }
  .card-type {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; line-height: 1;
    padding: 4px 7px; margin-bottom: 6px; border-radius: 3px;
    background: #F3F0E8; color: var(--ink-3);
  }
  .card-type .entity-icon { width: 13px; height: 13px; }
  .card .n { font-size: 13.5px; font-weight: 500; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .card .n .entity-icon { width: 15px; height: 15px; }
  .card .d {
    font-size: 11px; color: var(--ink-3); line-height: 1.5;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* 地点志 */
  .geo-note {
    font-size: 11px; color: var(--ink-3); line-height: 1.7;
    margin: -2px 0 14px; max-width: 900px;
  }
  .geo-stage-strip {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .geo-stage-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px;
    background: #fff; font-size: 10.5px; color: var(--ink-2);
  }
  .geo-stage-chip i {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
  }
  .geo-stage-chip b { font-weight: 500; color: var(--ink); }
  .geo-stage-chip span { color: var(--ink-3); }

  .geo-layout {
    display: grid; grid-template-columns: minmax(360px, 0.78fr) minmax(0, 1.22fr);
    gap: 18px; align-items: start;
  }
  .geo-tree-panel {
    background: #fff; border: 1px solid var(--line); border-radius: 11px;
    overflow: hidden;
  }
  .geo-tree-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 11px 14px; border-bottom: 1px solid #F2EFE7;
    font-size: 11.5px; color: var(--ink-3);
  }
  .geo-tree-head b { font-size: 13px; font-weight: 500; color: var(--ink); }
  .geo-row {
    display: grid; grid-template-columns: 16px 8px minmax(0, 1fr) auto auto;
    align-items: center; gap: 7px;
    min-height: 32px; padding: 5px 11px 5px 0;
    border-bottom: 1px solid #F6F2EA;
    cursor: pointer;
  }
  .geo-row:hover { background: #FCFBF7; }
  .geo-row.on { background: #FBF3EE; box-shadow: inset 3px 0 var(--crimson); }
  .geo-toggle {
    border: none; background: none; padding: 0; color: var(--ink-3);
    font: 12px/1 monospace; cursor: pointer; text-align: center;
  }
  .geo-toggle.leaf { visibility: hidden; }
  .geo-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .geo-name { font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .geo-ch { font-size: 10px; color: var(--ink-3); white-space: nowrap; }
  .geo-owner {
    max-width: 94px; overflow: hidden; text-overflow: ellipsis;
    padding: 1px 5px; border-radius: 3px; font-size: 9.5px; white-space: nowrap;
    background: #F3F0E8; color: var(--ink-3);
  }
  .geo-owner.owned { color: #6B4A5A; background: #F6EEF1; }

  .geo-detail {
    position: sticky; top: 0;
    background: #fff; border: 1px solid var(--line); border-radius: 11px;
    padding: 17px 19px 20px; min-height: 260px;
  }
  .geo-detail-title {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 4px; font-size: 20px; font-weight: 500;
  }
  .geo-meta { font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  .geo-badges { display: flex; gap: 5px; flex-wrap: wrap; margin: 0 0 11px; }
  .geo-badge {
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px;
    background: #FAF8F3; color: var(--ink-2); font-size: 10px;
  }
  .geo-badge.warn { color: #8A6D3B; background: #FDF8EC; border-color: #F0E3C8; }
  .geo-desc { font-size: 12px; line-height: 1.8; color: var(--ink-2); margin: 0 0 12px; }
  .geo-sec-title {
    font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em;
    margin: 15px 0 6px; padding-top: 10px; border-top: 1px dashed #EFEBE1;
  }
  .geo-kv { display: grid; grid-template-columns: 58px 1fr; gap: 4px 10px; font-size: 11px; line-height: 1.65; }
  .geo-kv .k { color: var(--ink-3); }
  .geo-kv .v { color: var(--ink-2); }
  .geo-jump {
    border: none; background: none; padding: 0; margin: 0 5px 3px 0;
    color: var(--ink-2); font: inherit; cursor: pointer; border-bottom: 1px dotted #C9C2B2;
  }
  .geo-jump:hover { color: var(--crimson); }
  .geo-chip-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .geo-org-card {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center;
    border: 1px solid #EFE9DC; border-radius: 7px; background: #FCFBF7;
    padding: 8px 10px; margin-bottom: 5px;
  }
  .geo-org-card b { font-size: 11.5px; font-weight: 500; color: var(--ink); }
  .geo-org-card .geo-org-desc {

    <span class="rp-label">阅读进度</span>
    <button id="cutoffPrev" class="rp-step" title="向前 10 章">−10</button>
    <input id="cutoff" type="range" min="1" max="1" value="1" step="1">
    <button id="cutoffNext" class="rp-step" title="向后 10 章">+10</button>
    <b id="cutoffLabel">第 1 章</b>
    <button id="cutoffAll" class="rp-all">全书</button>
  </div>
  <div id="readerHint" class="reader-hint">只显示当前进度之前的人物、地点、关系和地图层</div>
</div>

<div id="searchPanel" hidden></div>

<main>
  <div id="home" class="view"></div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="graphTools">
      <span class="gt-label">范围</span>
      <button id="scopeCore" class="on">核心</button>
      <button id="scopeAll">全部</button>
      <select id="groupFilter" title="只看某个势力"></select>
    </div>
    <div id="legend"></div>
    <div id="hint">拖拽节点 · 滚轮缩放 · 悬停连线看关系 · 点击查看</div>
  </div>

  <div id="wiki" class="view" hidden></div>
  <div id="geo" class="view" hidden></div>
  <div id="map" class="view" hidden></div>
  <div id="power" class="view" hidden></div>
  <div id="rhythm" class="view" hidden></div>
  <div id="realms" class="view" hidden></div>
  <div id="foreshadow" class="view" hidden></div>
  <div id="anomalies" class="view" hidden></div>

  <aside id="panel">
    <button class="panel-close" id="panelClose">×</button>
    <div id="panelBody"></div>
  </aside>
</main>

<script src="./data.js"></script>
<script>(function () {
  // 渲染源码按职责拆在 template/viewer/*.js；build.py 会按文件名顺序拼到下面这个占位处。
  /* Novel Atlas viewer · 数据、截断、颜色与公共小工具
   职责：FULL_D / D / 阅读进度 / 调色板 / 实体索引 */
  const FULL_D = window.ATLAS_DATA;
  if (!FULL_D) {
    document.body.innerHTML = '<p style="padding:40px">未找到数据文件 samples/fictional/data.js</p>';
    return;
  }

  /* ================= 读者进度 ================= */
  function maxChapter(data) {
    return Math.max(
      ...(data.chapters || []).map(c => c.ch),
      ((data.meta.coverage || {}).chapters_done) || 0,
      1
    );
  }
  function titleKey(data) {
    return 'novel-atlas.cutoff.' + (data.meta.title || 'untitled');
  }
  function readCutoff(data) {
    const max = maxChapter(data);
    let value = null;
    try { value = localStorage.getItem(titleKey(data)); } catch (e) {}
    const q = new URLSearchParams(location.search).get('cutoff');
    if (q !== null && q !== '') value = Number(q);
    value = Number(value);
    if (!Number.isFinite(value) || value <= 0) value = max;
    return Math.max(1, Math.min(Math.round(value), max));
  }
  function cutForReader(full, cutoff) {
    const copy = JSON.parse(JSON.stringify(full));
    const c = Math.max(1, Math.min(cutoff, maxChapter(full)));
    const meta = full.meta || {};
    const done = (meta.coverage && meta.coverage.chapters_done) || maxChapter(full);
    const visibleEntity = e => typeof e.first_ch === 'number' && e.first_ch > 0 && e.first_ch <= c;
    const entityIds = new Set((full.entities || []).filter(visibleEntity).map(e => e.id));

    copy.entities = (full.entities || []).filter(visibleEntity).map(e => {
      const x = JSON.parse(JSON.stringify(e));
      x.power_history = (x.power_history || []).filter(p => typeof p.ch === 'number' && p.ch <= c);
      if (typeof x.last_ch === 'number' && x.last_ch > c) x.last_ch = null;
      return x;
    });
    copy.relations = (full.relations || []).filter(r =>
      typeof r.first_ch !== 'number' || (r.first_ch <= c && entityIds.has(r.s) && entityIds.has(r.t)));
    copy.chapters = (full.chapters || []).filter(ch => ch.ch <= c).map(ch => {
      const x = JSON.parse(JSON.stringify(ch));
      x.battles = (x.battles || []).filter(b => entityIds.has(b.a) && entityIds.has(b.b));
      return x;
    });

    copy.foreshadows = (full.foreshadows || []).filter(f =>
      typeof f.plant_ch === 'number' && f.plant_ch <= c).map(f => {
      const x = JSON.parse(JSON.stringify(f));
      if (typeof x.payoff_ch === 'number' && x.payoff_ch > c) {
        x.payoff_ch = null; x.payoff_quote = null;
      }
      if (typeof x.last_mention_ch === 'number' && x.last_mention_ch > c) x.last_mention_ch = null;
      return x;
    });

    copy.knowledge = (full.knowledge || []).filter(k => {
      const truth = typeof k.truth_ch === 'number' ? k.truth_ch : 0;
      const known = typeof k.reader_known_ch === 'number' ? k.reader_known_ch : truth;
      return truth > 0 && truth <= c && known <= c;
    }).map(k => {
      const x = JSON.parse(JSON.stringify(k));
      x.known_by = (x.known_by || []).filter(v =>
        typeof v.ch === 'number' && v.ch <= c && entityIds.has(v.entity));
      return x;
    });

    const placeIds = new Set((full.places || []).filter(p =>
      typeof p.first_ch === 'number' && p.first_ch <= c).map(p => p.id));
    copy.places = (full.places || []).filter(p => placeIds.has(p.id));
    copy.spatial_relations = (full.spatial_relations || []).filter(r =>
      placeIds.has(r.s) && placeIds.has(r.t) &&
      (typeof r.first_ch !== 'number' || r.first_ch <= c) &&
      (!r.evidence || typeof r.evidence.ch !== 'number' || r.evidence.ch <= c));
    copy.concepts = (full.concepts || []).filter(x =>
      typeof x.first_ch !== 'number' || x.first_ch <= c);
    copy.volumes = full.volumes || [];

    if (copy.map_layout && typeof copy.map_layout === 'object') {
      const ml = copy.map_layout;
      ml.nodes = (ml.nodes || []).filter(n => placeIds.has(n.place));
      ml.regions = (ml.regions || []).filter(r => !r.layer || placeIds.has(r.layer));
      const regionIds = new Set(ml.regions.map(r => r.id));
      ml.routes = (ml.routes || []).filter(r => placeIds.has(r.s) && placeIds.has(r.t));
      if (ml.terrain && typeof ml.terrain === 'object') {
        const keepRegion = x => !x.region || regionIds.has(x.region);
        ml.terrain = {
          ridges: (ml.terrain.ridges || []).filter(keepRegion),
          rivers: (ml.terrain.rivers || []).filter(keepRegion),
          lakes: (ml.terrain.lakes || []).filter(keepRegion),
          islets: ml.terrain.islets || []
        };
      }
      if (ml.atlas && typeof ml.atlas === 'object') {
        ml.atlas.stamps = (ml.atlas.stamps || []).filter(s =>
          (!s.attach || placeIds.has(s.attach)) && (!s.layer || placeIds.has(s.layer)));
        if (ml.atlas.markers) {
          ml.atlas.markers = Object.fromEntries(
            Object.entries(ml.atlas.markers).filter(([id]) => placeIds.has(id)));
        }
      }
    }

    const evCh = ev => {
      const m = String((ev && ev.coordinate) || '').match(/^ch(\d+)/);
      return m ? Number(m[1]) : null;
    };
    copy.anomalies = (full.anomalies || []).filter(a => {
      const rng = a.chapter_range || [];
      const end = rng.length > 1 ? Number(rng[1]) : Number(rng[0] || 0);
      if (end && end > c) return false;
      return (a.evidence || []).every(e => {
        const ch = evCh(e);
        return ch === null || ch <= c;
      });
    });

    copy._reader = {
      cutoff_ch: c,
      cut: c,
      analyzed_ch: done,
      chapter_max: maxChapter(full),
      total_chapters: meta.chapters || 0,
      analysis_complete: !!(meta.chapters && done >= meta.chapters),
      is_spoiler_safe: c < maxChapter(full)
    };
    return copy;
  }

  const CUTOFF = readCutoff(FULL_D);
  const D = cutForReader(FULL_D, CUTOFF);
  window.ATLAS_DATA = D;

  /* ================= 数据适配 ================= */
  const CHAPTERS = D.chapters || [];
  const REALMS = (D.realms || []).slice().sort((a, b) => a.order - b.order);
  const FORESHADOWS = D.foreshadows || [];
  const CURRENT_CH = (D._reader && D._reader.cutoff_ch) || Math.max(
    ...CHAPTERS.map(c => c.ch),
    (D.meta.coverage && D.meta.coverage.chapters_done) || 0,
    1
  );
  // 阈值与 scripts/merge.py、validate.py、export.py 保持一致：
  // 以「已分析到的章数」为跨度基准，下限 50 章。
  // 不能全用全书章数——只拆前 200 章时，2443 章的 15% 是 366，
  // 会让所有坑永远无法触发告警，功能形同失效。
  const FS_SPAN = Math.max(CURRENT_CH, 1);
  const FS_THRESHOLD = Math.max(50, Math.round(FS_SPAN * 0.15));

  // 阵营配色：按出现顺序动态分配，任何书都能用
  const PALETTE = ['#A6314A', '#3D6B7D', '#6B4A7A', '#B8925A', '#5A7A5E',
                   '#7A6A5A', '#7A8A9A', '#9A9488'];
  const GROUP_COLOR = {};
  [...new Set(D.entities.map(e => e.group))].forEach((g, i) => {
    GROUP_COLOR[g] = PALETTE[i % PALETTE.length];
  });
  // 每个境界用不同色相；同境界内再由浅到深表示小阶成长，突破后换色重新变浅。
  const REALM_COLOR = ['#4F7C8A', '#5C8A63', '#B08A4E', '#8C5470',
                       '#A64B45', '#6B6D8F', '#8A6A46', '#4F7F7A'];
  const REL_STYLE = {
    kinship:    { color: '#C9C2B2', width: 1.2, dash: [] },
    marriage:   { color: '#C0A06E', width: 1.8, dash: [] },
    romance:    { color: '#C97A8C', width: 1.6, dash: [5, 4] },
    service:    { color: '#D8D2C4', width: 1.0, dash: [2, 3] },
    mentorship: { color: '#9FB3BC', width: 1.2, dash: [6, 3] },
    alliance:   { color: '#A8B79C', width: 1.3, dash: [] },
    conflict:   { color: '#C25A5A', width: 1.6, dash: [1, 3] },
    social:     { color: '#D5CFC2', width: 0.9, dash: [] }
  };
  const REL_CN = {
    kinship: '血亲', marriage: '婚姻', romance: '情感', service: '主从',
    mentorship: '师承', alliance: '同盟', conflict: '敌对', social: '交游'
  };

  /* 实体类型图标：人物 / 势力 / 器物 / 妖兽，线稿 SVG 随文字颜色走 */
  const TYPE_NAME = { character: '人物', org: '势力', item: '器物', creature: '妖兽' };
  const ENTITY_ICON = {
    character: `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <circle cx="10" cy="6.2" r="2.8"></circle>
      <path d="M4.6 16.8c.4-3.8 2.5-5.8 5.4-5.8s5 2 5.4 5.8"></path>
    </svg>`,
    org: `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M3.4 8.2 10 3.8l6.6 4.4"></path>
      <path d="M5.1 8.4v7.4M14.9 8.4v7.4M8 15.8v-4h4v4"></path>
      <path d="M3.6 17.6h12.8"></path>
    </svg>`,
    item: `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M12.5 3.2 16.8 7.5 8.7 15.6H5.2v-3.5l7.3-7.3z"></path>
      <path d="M10.6 5.1 14.9 9.4"></path>
      <path d="M4 16.8 6.5 14.3"></path>
    </svg>`,
    creature: `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M6.1 12.2c-1.2 0-2.1.9-2.1 2 0 1.4 1.2 2 2.7 2h6.6c1.5 0 2.7-.6 2.7-2 0-1.1-.9-2-2.1-2H6.1z"></path>
      <circle cx="5.6" cy="7.1" r="1.5"></circle>
      <circle cx="9.8" cy="5.2" r="1.6"></circle>
      <circle cx="14.4" cy="7.1" r="1.5"></circle>
    </svg>`
  };
  function entityIcon(type, cls) {
    if (!ENTITY_ICON[type]) return '';
    const extra = cls ? ' ' + cls : '';
    return `<span class="entity-icon entity-icon-${type}${extra}" title="${TYPE_NAME[type] || type}">${ENTITY_ICON[type]}</span>`;
  }
  const STATUS_META = {
    overdue: { cn: '已超期', color: '#C0392B', bg: '#FDF1EF' },
    planted: { cn: '待回收', color: '#B8925A', bg: '#FBF5EA' },
    paid:    { cn: '有回收章', color: '#5A7A5E', bg: '#EFF5EE' },
    dropped: { cn: '已放弃', color: '#9A9488', bg: '#F2EFE7' }
  };
  const EMOTION_COLOR = {
    '爽': '#C0533F', '压抑': '#7A7A85', '紧张': '#B8925A',
    '温情': '#C98B9E', '悲': '#6B7A8F', '平': '#B4B2A9'
  };

  /* 伏笔状态：派生，不信任存储值 */
  /** 距最后一次提及过了多久；没有提及数据时退回埋设章 */
  function fsSilent(f) {
    const last = f.last_mention_ch || f.plant_ch;
    return CURRENT_CH - last;
  }
  function fsStatus(f) {
    if (f.payoff_ch !== null && f.payoff_ch !== undefined && f.payoff_ch !== f.plant_ch) return 'paid';
    if (f.status === 'dropped') return 'dropped';
    return fsSilent(f) > FS_THRESHOLD ? 'overdue' : 'planted';
  }

  /* ================= 建索引 ================= */
  const byId = new Map();
  D.entities.forEach(e => byId.set(e.id, e));
  const allById = new Map();
  D.entities.forEach(e => allById.set(e.id, Object.assign({ _kind: 'entity' }, e)));
  D.places.forEach(p => allById.set(p.id, Object.assign({ _kind: 'place' }, p)));
  D.concepts.forEach(c => allById.set(c.id, Object.assign({ _kind: 'concept' }, c)));
  const realmById = new Map(REALMS.map(r => [r.id, r]));

  /* ---------- 地点 / 势力索引 ---------- */
  const PLACES = D.places || [];
  const placeById = new Map(PLACES.map(p => [p.id, p]));
  const chapterByCh = new Map(CHAPTERS.map(c => [c.ch, c]));
  const orgEntities = D.entities.filter(e => e.type === 'org');
  const keyName = s => String(s || '').replace(/\s+/g, '').trim();
  const escHtml = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const orgByName = new Map();
  orgEntities.forEach(o => {
    [o.name, ...(o.aliases || [])].forEach(n => {
      const k = keyName(n);
      if (k && !orgByName.has(k)) orgByName.set(k, o);
    });
  });

  const orgRootCache = new Map();
  function orgRootOf(o) {
    if (!o || o.type !== 'org') return null;
    if (orgRootCache.has(o.id)) return orgRootCache.get(o.id);
    let cur = o;
    const seen = new Set();
    while (cur && cur.parent && !seen.has(cur.id)) {
      seen.add(cur.id);
      const parent = byId.get(cur.parent);
      if (!parent || parent.type !== 'org') break;
      cur = parent;
    }
    orgRootCache.set(o.id, cur);
    return cur;
  }

  function explicitPlaceOwner(p) {
    const attrs = p.attrs || {};
    for (const key of ['所属势力', '门派', '势力', '所属']) {
      const hit = orgByName.get(keyName(attrs[key]));
      if (hit) return { org: hit, key, value: attrs[key] };
    }
    return null;
  }

  const placeOwnerCache = new Map();
  function placeOwnerInfo(p) {
    if (placeOwnerCache.has(p.id)) return placeOwnerCache.get(p.id);
    const attrs = p.attrs || {};
    const desc = p.desc || '';
    let info = { roots: [], direct: null, special: null, disputed: false, basis: '' };

    const explicit = explicitPlaceOwner(p);
    if (explicit) {
      info.direct = explicit.org;
      info.roots = [orgRootOf(explicit.org)];
      info.basis = `attrs.${explicit.key} = ${explicit.value}`;
    } else if (/交界|争议/.test(desc)) {
      // 只在描述明确写「交界」时，把提到的势力都列为争议方，不靠猜
      const found = [];
      orgEntities.forEach(o => {
        const names = [o.name, ...(o.aliases || [])].filter(Boolean);
        if (names.some(n => desc.includes(n))) {
          const root = orgRootOf(o);
          if (root && !found.includes(root)) found.push(root);
        }
      });
      if (found.length > 1) {
        info.roots = found;
        info.disputed = true;
        info.basis = '描述明确为交界之地，列出双方而非单方归属';
      }
    }

    if (!info.roots.length && !info.special && p.parent) {
      const parent = placeById.get(p.parent);
      if (parent) {
        const pinfo = placeOwnerInfo(parent);
        if (pinfo.roots.length) {
          info.roots = pinfo.roots;
          info.disputed = pinfo.disputed;
          info.basis = `继承自父地点「${parent.name}」：${pinfo.basis}`;
        } else if (pinfo.special) {
          info.special = pinfo.special;
          info.basis = `继承自父地点「${parent.name}」：${pinfo.special}`;
        }
      }
    }

    if (!info.roots.length && !info.special && /共管/.test(desc)) {
      info.special = '七派共管';
      info.basis = '描述明确为多派共管，不强行归给单一势力';
    }

    placeOwnerCache.set(p.id, info);
    return info;
  }

  const placeChildren = new Map();
  const placeRoots = [];
  PLACES.forEach(p => {
    if (p.parent && placeById.has(p.parent)) {
      if (!placeChildren.has(p.parent)) placeChildren.set(p.parent, []);
      placeChildren.get(p.parent).push(p);
    } else {
      placeRoots.push(p);
    }
  });
  const byFirstCh = (a, b) => (a.first_ch || 9999) - (b.first_ch || 9999) || a.name.localeCompare(b.name, 'zh');
  placeRoots.sort(byFirstCh);
  placeChildren.forEach(list => list.sort(byFirstCh));

  const GEO_STAGES = [
    { label: '山门一带', max: 40, color: '#2A5666', note: '第 1–40 章' },
    { label: '门内深处与下山', max: 143, color: '#4E7C8F', note: '第 41–143 章' },
    { label: '黄枫谷', max: 178, color: '#B8925A', note: '第 144–178 章' },
    { label: '秘境', max: 9999, color: '#A6314A', note: '第 179 章以后' }
  ];
  function placeStage(p) {
    const ch = p.first_ch || 0;
    return GEO_STAGES.find(s => ch <= s.max) || GEO_STAGES[GEO_STAGES.length - 1];
  }

  function placeDepth(p) {
    let n = 0, cur = p, seen = new Set();
    while (cur && cur.parent && placeById.has(cur.parent) && !seen.has(cur.id)) {
      seen.add(cur.id); cur = placeById.get(cur.parent); n++;
    }
    return n;
  }
  function placePath(p) {
    const path = [];
    let cur = p, seen = new Set();
    while (cur && !seen.has(cur.id)) {
      seen.add(cur.id); path.unshift(cur);
      cur = cur.parent ? placeById.get(cur.parent) : null;
    }
    return path;
  }

  const deg = new Map();
  D.relations.forEach(r => {
    deg.set(r.s, (deg.get(r.s) || 0) + 1);
    deg.set(r.t, (deg.get(r.t) || 0) + 1);
  });

  function realmIndex(id) {
    const r = realmById.get(id);
    return r ? r.order : 0;
  }
  function powerAt(id) {
    const e = byId.get(id);
    const h = (e && e.power_history) || [];
    if (!h.length) return null;
    let cur = h[0];
    h.forEach(p => { if (p.ch <= CURRENT_CH) cur = p; });
    return cur;
  }
  /** 指定章号时的修为（取该章或之前最后一条） */
  function powerAtCh(id, ch) {
    const e = byId.get(id);
    const h = (e && e.power_history) || [];
    let cur = null;
    h.forEach(p => { if (p.ch <= ch) cur = p; });
    return cur || h[0] || null;
  }
  function powerFull(p) {
    if (!p) return '—';
    const r = realmById.get(p.realm);
    return (r ? r.name : p.realm) + (p.stage ? '·' + p.stage : '');
  }
  /** 综合等级数：境界序 ×100 + 层数序，用于跨境界与同境界内比较 */
  function levelNum(p) {
    if (!p) return 0;
    const r = realmById.get(p.realm);
    const st = (r && r.stages) || [];
    const i = st.indexOf(p.stage);
    return (r ? r.order : 0) * 100 + (i >= 0 ? i : 0);
  }
  /** 把等级差换算成可读文案：同境界内说「X 层」，跨境界说「X 级」 */
  function fbLayer(diff) {
    const a = Math.abs(diff);
    return a >= 100 ? `${Math.floor(a / 100)} 级` : `${a} 层`;
  }
  /** 境界内的层数比例 0..1，用于同境界内部的色阶渐变；无细分时按初入浅色处理 */
  function stageFrac(p) {
    if (!p) return 0;
    const r = realmById.get(p.realm);
    const st = (r && r.stages) || [];
    if (!st.length) return 0;
    const i = st.indexOf(p.stage);
    return i < 0 ? 0 : (st.length > 1 ? i / (st.length - 1) : 0);
  }
  /** 境界基色：每个境界一个色相，按 order 取色，超出后循环 */
  function realmBaseColor(realmId) {
    const ri = Math.max(realmIndex(realmId), 1);
    return REALM_COLOR[(ri - 1) % REALM_COLOR.length];
  }
  /** 境界内色阶：frac 0=初入浅色，1=巅峰深色；80% → 40% 保证在米色轨道上可辨 */
  function realmTone(realmId, frac) {
    const base = realmBaseColor(realmId);
    const f = Math.max(0, Math.min(1, Number(frac) || 0));
    return shade(base, 80 - f * 40);
  }
  /** 境界基色 + 层数明度：练气一层浅、九层深，一眼看出成长 */
  function realmColorOf(p) {
    return realmTone(p && p.realm, stageFrac(p));
  }
  function shade(hex, lightness) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const max = Math.max(r, g, b) / 255, min = Math.min(r, g, b) / 255;
    let h = 0, s = 0;
    const L0 = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = L0 > 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r / 255 ? ((g / 255 - b / 255) / d + (g < b ? 6 : 0))
        : max === g / 255 ? ((b / 255 - r / 255) / d + 2)
        : ((r / 255 - g / 255) / d + 4);
      h *= 60;
    }
    return `hsl(${h.toFixed(0)}, ${(s * 100).toFixed(0)}%, ${lightness.toFixed(0)}%)`;
  }

  /* ================= 顶栏 ================= */
  const overdueCnt = FORESHADOWS.filter(f => fsStatus(f) === 'overdue').length;
  const analyzedCh = (D.meta.coverage && D.meta.coverage.chapters_done) || D.chapters.length;
  const isPartial = analyzedCh < D.meta.chapters;
  const cutoff = CURRENT_CH;
  document.getElementById('title').textContent = D.meta.title;
  document.getElementById('tag').textContent =
    [D.meta.genre, D.meta.platform, D.meta.status].filter(Boolean).join(' · ') +
    (isPartial ? ` · 已分析 ${analyzedCh} 章` : ' · 全书');
  document.getElementById('stats').innerHTML =
    `<span class="cov"><b>${cutoff}</b> / ${D.meta.chapters} 章可读</span>` +
    `<span class="book"><b>${(D.meta.chars / 10000).toFixed(0)}</b> 万字</span>` +
    `<span><b>${D.entities.filter(e => e.type === 'character').length}</b> 角色</span>` +
    `<span class="entities"><b>${D.entities.length}</b> 实体</span>`;
  if (overdueCnt) {
    const dot = document.getElementById('fsDot');
    dot.hidden = false;
    dot.title = overdueCnt + ' 个伏笔在当前进度已超期';
  }

  /* ---------- 阅读进度控件 ---------- */
  function renderReaderBar() {
    const max = maxChapter(FULL_D);
    const range = document.getElementById('cutoff');
    const label = document.getElementById('cutoffLabel');
    const hint = document.getElementById('readerHint');
    if (!range || !label || !hint) return;
    range.min = 1;
    range.max = max;
    range.value = cutoff;
    label.textContent = `第 ${cutoff} / ${max} 章`;
    const allBtn = document.getElementById('cutoffAll');
    if (allBtn) allBtn.disabled = cutoff >= max;
    const nextBtn = document.getElementById('cutoffNext');
    if (nextBtn) nextBtn.disabled = cutoff >= max;
    const done = (FULL_D.meta.coverage && FULL_D.meta.coverage.chapters_done) || max;
    const total = FULL_D.meta.chapters || max;
    if (cutoff < max) {
      hint.className = 'reader-hint is-future';
      hint.textContent = `只显示第 1–${cutoff} 章；第 ${cutoff + 1} 章后默认锁定`;
    } else if (done < total) {
      hint.className = 'reader-hint';
      hint.textContent = `档案覆盖到第 ${max} 章（全书 ${total} 章；后续尚未分析）`;
    } else {
      hint.className = 'reader-hint';
      hint.textContent = '全书已解锁 · 可拖动进度回看任意章节';
    }
  }
  function goCutoff(n) {
    const max = maxChapter(FULL_D);
    const next = Math.max(1, Math.min(max, Math.round(n)));
    try { localStorage.setItem(titleKey(FULL_D), String(next)); } catch (e) {}
    const url = new URL(location.href);
    url.searchParams.set('cutoff', String(next));
    url.hash = '';
    location.href = url.toString();
  }
  if (document.getElementById('cutoff')) {
    renderReaderBar();
    const range = document.getElementById('cutoff');
    range.addEventListener('input', () => {
      document.getElementById('cutoffLabel').textContent = `第 ${range.value} / ${maxChapter(FULL_D)} 章`;
    });
    range.addEventListener('change', () => goCutoff(range.value));
    document.getElementById('cutoffPrev').addEventListener('click', () => goCutoff(cutoff - 10));
    document.getElementById('cutoffNext').addEventListener('click', () => goCutoff(cutoff + 10));
    document.getElementById('cutoffAll').addEventListener('click', () => goCutoff(maxChapter(FULL_D)));
  }



/* Novel Atlas viewer · 图谱画布与渲染
   职责：力导向布局 / 节点绘制 / 关系线 / 相机 */
  /* ================= 图谱 ================= */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  const rawNodes = D.entities.map(e => {
    const d = deg.get(e.id) || 0;
    return {
      id: e.id, ref: e, name: e.name,
      r: 6.8 + Math.min(d, 22) * 0.58,
      d, x: 0, y: 0, vx: 0, vy: 0, fixed: false,
      dimT: 0, selT: 0        // 变暗 / 选中的过渡进度，0→1 插值用
    };
  });
  // 只画有关系连线的节点。孤立点没有信息量，还会把核心群挤到角落
  const nodes = rawNodes.filter(n => n.d > 0);
  const isolatedCount = rawNodes.length - nodes.length;
  const nodeById = new Map(nodes.map(n => [n.id, n]));

  const groups = [...new Set(nodes.map(n => n.ref.group))];
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  groups.forEach((g, gi) => {
    const members = nodes.filter(n => n.ref.group === g);
    const count = members.length;

    // “其他”大多是互不相干的散点，硬塞进一个阵营会堆成一团
    if (g === '其他' || count > 42) {
      members.forEach((n, i) => {
        const a = i * GOLDEN + gi * 1.7;
        const ring = 315 + (i % 7) * 27 + (count > 42 ? 30 : 0);
        n.x = Math.cos(a) * ring * 1.12;
        n.y = Math.sin(a) * ring * 0.82;
      });
      return;
    }

    const a = (gi / Math.max(groups.length, 1)) * Math.PI * 2 - Math.PI / 2;
    const ring = 245 + Math.min(120, Math.sqrt(count) * 15);
    const cx = Math.cos(a) * ring * 1.2;
    const cy = Math.sin(a) * ring * 0.9;
    const memberR = 38 + Math.sqrt(count) * 13;
    members.forEach((n, i) => {
      const t = (i / Math.max(1, members.length)) * Math.PI * 2 + (gi % 2 ? 0.35 : 0);
      const rr = memberR * (0.72 + Math.random() * 0.4);
      n.x = cx + Math.cos(t) * rr + (Math.random() - .5) * 12;
      n.y = cy + Math.sin(t) * rr + (Math.random() - .5) * 12;
    });
  });

  const groupAnchors = new Map();
  groups.forEach(g => {
    const members = nodes.filter(n => n.ref.group === g);
    if (g !== '其他' && members.length > 1) {
      groupAnchors.set(g, {
        x: members.reduce((s, n) => s + n.x, 0) / members.length,
        y: members.reduce((s, n) => s + n.y, 0) / members.length
      });
    }
  });

  const links = D.relations.map(r => ({
    s: nodeById.get(r.s), t: nodeById.get(r.t), ref: r,
    w: r.weight || 0.5, type: r.type,
    actT: 1                  // 高亮过渡进度，初始全亮
  })).filter(l => l.s && l.t);

  const adj = new Map();
  links.forEach(l => {
    if (!adj.has(l.s.id)) adj.set(l.s.id, new Set());
    if (!adj.has(l.t.id)) adj.set(l.t.id, new Set());
    adj.get(l.s.id).add(l.t.id);
    adj.get(l.t.id).add(l.s.id);
  });

  let graphScope = 'core';
  let groupFilter = '';
  const coreCount = nodes.filter(n => n.ref.type === 'org' || n.d >= 3).length;

  function visibleNode(n) {
    if (groupFilter) return n.ref.group === groupFilter;
    if (graphScope === 'core') return n.ref.type === 'org' || n.d >= 3;
    return true;
  }
  function visibleLink(l) { return visibleNode(l.s) && visibleNode(l.t); }

  function ensureNodeVisible(id) {
    const n = nodeById.get(id);
    if (n && !visibleNode(n)) {
      groupFilter = '';
      graphScope = 'all';
      updateGraphTools();
    }
  }

  function updateGraphTools() {
    const core = document.getElementById('scopeCore');
    const all = document.getElementById('scopeAll');
    const sel = document.getElementById('groupFilter');
    if (!core || !all || !sel) return;
    core.textContent = `核心 ${coreCount}`;
    all.textContent = `全部 ${nodes.length}`;
    core.classList.toggle('on', graphScope === 'core');
    all.classList.toggle('on', graphScope === 'all');
    if (!sel.dataset.init) {
      sel.innerHTML = `<option value="">全部势力</option>` +
        groups.map(g => `<option value="${g}">${g}</option>`).join('');
      sel.dataset.init = '1';
      sel.addEventListener('change', () => {
        groupFilter = sel.value;
        if (groupFilter) graphScope = 'all';
        updateGraphTools();
        hoverId = hoverLink = null;
        fitView();
        alpha = Math.max(alpha, 0.22);
      });
    }
    sel.value = groupFilter;
    document.getElementById('scopeCore').onclick = () => {
      graphScope = 'core'; groupFilter = ''; updateGraphTools(); fitView(); alpha = Math.max(alpha, 0.22);
    };
    document.getElementById('scopeAll').onclick = () => {
      graphScope = 'all'; groupFilter = ''; updateGraphTools(); fitView(); alpha = Math.max(alpha, 0.22);
    };
  }

  let view = { x: 0, y: 0, k: 1, fitK: 1 };
  let hoverId = null, hoverLink = null, selectId = null, alpha = 1;
  let camAnim = null;
  const ripples = [];
  let pointer = { x: 0, y: 0 };

  function mixHex(a, b, t) {
    const parse = c => {
      c = (c || '#999').replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)];
    };
    const A = parse(a), B = parse(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
  }

  // 把某个节点平滑移到可视区中心；右侧详情面板展开时，中心左移，避免被面板挡住
  function centerOn(n, animate) {
    if (!n) return;
    const panelW = panel.classList.contains('open') ? Math.min(348, W * 0.48) : 0;
    const tx = (W - panelW) / 2 - n.x * view.k;
    const ty = H / 2 - n.y * view.k;
    if (!animate) { view.x = tx; view.y = ty; camAnim = null; return; }
    camAnim = { fx: view.x, fy: view.y, tx, ty, start: performance.now(), dur: 460 };
  }

  function stepCamera(now) {
    if (!camAnim) return;
    const t = Math.min(1, (now - camAnim.start) / camAnim.dur);
    const e = 1 - Math.pow(1 - t, 3);
    view.x = camAnim.fx + (camAnim.tx - camAnim.fx) * e;
    view.y = camAnim.fy + (camAnim.ty - camAnim.fy) * e;
    if (t >= 1) camAnim = null;
  }

  function pulseNode(n) {
    if (!n) return;
    ripples.push({ n, t: 0 });
    if (ripples.length > 3) ripples.shift();
  }

  function screenRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else {
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
  }

  function drawRelationLabels(focus, hot) {
    if (!links.length || W <= 0) return;
    const boxes = [];
    const place = (text, sx, sy, color) => {
      ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
      const tw = ctx.measureText(text).width;
      const bw = tw + 12, bh = 17;
      const candidates = [0, 11, -11, 22, -22];
      for (const off of candidates) {
        const x = sx + off;
        const y = sy;
        const left = x - bw / 2, top = y - bh / 2;
        if (left < 4 || top < 4 || left + bw > W - 4 || top + bh > H - 4) continue;
        const box = { l: left, t: top, r: left + bw, b: top + bh };
        if (boxes.some(b => !(box.r < b.l - 2 || box.l > b.r + 2 || box.b < b.t - 2 || box.t > b.b + 2))) continue;
        boxes.push(box);
        ctx.globalAlpha = 0.95;
        screenRoundRect(left, top, bw, bh, 4);
        ctx.fillStyle = 'rgba(250,249,245,0.94)';
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 0.9;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#45423B';
        ctx.textAlign = 'center';
        ctx.fillText(text, x, y + 3.5);
        return true;
      }
      return false;
    };

    let candidates = [];
    if (focus) {
      candidates = links.filter(l => visibleLink(l) && hot.has(l.s.id) && hot.has(l.t.id))
        .sort((a, b) => b.w - a.w).slice(0, 16);
    } else if (!hoverLink) {
      if (view.k >= 1.1) {
        candidates = links.filter(visibleLink).sort((a, b) => b.w - a.w).slice(0, 34);
      } else {
        // 远景下只标出最重要的几条关系，避免一上来就被标签淹没
        candidates = links.filter(visibleLink).sort((a, b) => b.w - a.w).slice(0, 8);
      }
    }

    candidates.forEach(l => {
      const a = toScreen(l.s), b = toScreen(l.t);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      if (len < 54) return;
      const nx = -dy / len, ny = dx / len;
      const mx = (a.x + b.x) / 2 + nx * 8;
      const my = (a.y + b.y) / 2 + ny * 8;
      const st = REL_STYLE[l.type] || REL_STYLE.social;
      place(relLabel(l), mx, my, st.color);
    });
  }

  function drawLinkTooltip() {
    if (!hoverLink) return;
    const st = REL_STYLE[hoverLink.type] || REL_STYLE.social;
    const text = `${hoverLink.s.name} · ${relLabel(hoverLink)} · ${hoverLink.t.name}`;
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    const bw = ctx.measureText(text).width + 20, bh = 25;
    let left = pointer.x + 13, top = pointer.y - 36;
    if (left + bw > W - 6) left = pointer.x - bw - 13;
    if (top < 6) top = pointer.y + 14;
    if (left < 6) left = 6;
    if (top + bh > H - 6) top = H - bh - 6;
    screenRoundRect(left, top, bw, bh, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    ctx.fill();
    ctx.strokeStyle = st.color;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#2B2A26';
    ctx.textAlign = 'left';
    ctx.fillText(text, left + 10, top + 16);
  }

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = rect.width; H = rect.height;
    if (W <= 0 || H <= 0) return;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function tick() {
    if (alpha < 0.008) return;
    const cx = (W / 2 - view.x) / view.k;
    const cy = (H / 2 - view.y) / view.k;
    const k = 0.0009 * alpha;

    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { d2 = 1; dx = Math.random() - .5; dy = Math.random() - .5; }
        const d = Math.sqrt(d2);
        const f = (3400 * alpha) / d2;
        const fx = (dx / d) * f, fy = (dy / d) * f;
        // 近距离额外排斥，避免节点叠在一起
        const minD = a.r + b.r + 16;
        if (d < minD) {
          const push = (minD - d) * 0.42 * alpha;
          a.vx -= (dx / d) * push; a.vy -= (dy / d) * push;
          b.vx += (dx / d) * push; b.vy += (dy / d) * push;
        }
        a.vx -= fx; a.vy -= fy;
        b.vx += fx; b.vy += fy;
      }
    }
    links.forEach(l => {
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const target = 104 + (1 - l.w) * 52;
      const f = (d - target) * 0.015 * l.w * alpha;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      l.s.vx += fx; l.s.vy += fy;
      l.t.vx -= fx; l.t.vy -= fy;
    });
    nodes.forEach(n => {
      if (n.fixed) { n.vx = n.vy = 0; return; }
      const anchor = groupAnchors.get(n.ref.group);
      if (anchor) {
        n.vx += (anchor.x - n.x) * 0.0022 * alpha;
        n.vy += (anchor.y - n.y) * 0.0022 * alpha;
      }
      n.vx += (cx - n.x) * k * 1.15;
      n.vy += (cy - n.y) * k * 1.15;
      n.vx *= 0.87; n.vy *= 0.87;
      n.x += n.vx; n.y += n.vy;
    });
    alpha *= 0.994;
  }

  function fitView(pad) {
    if (!nodes.length || W <= 0) return;
    pad = pad || 46;
    const shown = nodes.filter(visibleNode);
    const scope = shown.length ? shown : nodes;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    scope.forEach(n => {
      minX = Math.min(minX, n.x - n.r); maxX = Math.max(maxX, n.x + n.r);
      minY = Math.min(minY, n.y - n.r); maxY = Math.max(maxY, n.y + n.r);
    });

    const w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
    const k = Math.max(0.42, Math.min((W - pad * 2) / w, (H - pad * 2) / h, 1.4));
    view.k = k;
    view.fitK = k;      // 缩放倍数以此为基准，见 20-graph-interaction 的 wheel
    view.x = W / 2 - (minX + maxX) / 2 * k;
    view.y = H / 2 - (minY + maxY) / 2 * k;
  }

  // 力导向天然接近圆形；宽屏下把横向铺开，避免左右两侧大片留白
  function spreadLayoutAspect() {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
    });
    const w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
    const target = Math.max(0.9, (W - 80) / Math.max(H - 80, 1));
    const ratio = w / h;
    if (ratio < target) {
      const cx = (minX + maxX) / 2;
      const sx = Math.min(2.8, target / ratio);
      nodes.forEach(n => { n.x = cx + (n.x - cx) * sx; });
    }
  }

  // 人物=圆，势力=圆角方块，器物=菱形，妖兽=三角
  function nodePath(n, rr) {
    const type = n.ref.type;
    ctx.beginPath();
    if (type === 'org') {
      const s = rr * 1.14;
      if (ctx.roundRect) ctx.roundRect(n.x - s, n.y - s, s * 2, s * 2, Math.min(5, rr * 0.36));
      else ctx.rect(n.x - s, n.y - s, s * 2, s * 2);
    } else if (type === 'item') {
      const s = rr * 1.02;
      ctx.moveTo(n.x, n.y - s); ctx.lineTo(n.x + s, n.y);
      ctx.lineTo(n.x, n.y + s); ctx.lineTo(n.x - s, n.y);
      ctx.closePath();
    } else if (type === 'creature') {
      const s = rr * 1.2;
      ctx.moveTo(n.x, n.y - s);
      ctx.lineTo(n.x + s * 0.94, n.y + s * 0.72);
      ctx.lineTo(n.x - s * 0.94, n.y + s * 0.72);
      ctx.closePath();
    } else {
      ctx.arc(n.x, n.y, rr, 0, Math.PI * 2);
    }
  }

  // 节点内的小类型图标：四类一律绘制；size 给最小可辨尺寸，笔画随节点自适应
  function drawNodeTypeIcon(type, x, y, size) {
    const s = Math.max(size, 6.2);
    ctx.save();
    ctx.translate(x, y);
    // item 节点底色偏浅，金色描边加深一档保证对比；org 用墨青，人物/妖兽用白
    ctx.strokeStyle = type === 'item' ? '#8F6B33' : type === 'org' ? '#3D6B7D' : '#FFFFFF';
    ctx.lineWidth = Math.max(0.85, s * 0.08);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    if (type === 'character') {
      ctx.arc(0, -s * 0.15, s * 0.16, 0, Math.PI * 2);
      ctx.moveTo(-s * 0.32, s * 0.38);
      ctx.quadraticCurveTo(-s * 0.3, s * 0.03, 0, s * 0.03);
      ctx.quadraticCurveTo(s * 0.3, s * 0.03, s * 0.32, s * 0.38);
    } else if (type === 'org') {
      ctx.moveTo(-s * 0.4, -s * 0.04); ctx.lineTo(0, -s * 0.32); ctx.lineTo(s * 0.4, -s * 0.04);
      ctx.moveTo(-s * 0.3, s * 0.02); ctx.lineTo(-s * 0.3, s * 0.38);
      ctx.moveTo(s * 0.3, s * 0.02); ctx.lineTo(s * 0.3, s * 0.38);
      ctx.moveTo(-s * 0.12, s * 0.38); ctx.lineTo(-s * 0.12, s * 0.16);
      ctx.lineTo(s * 0.12, s * 0.16); ctx.lineTo(s * 0.12, s * 0.38);
      ctx.moveTo(-s * 0.44, s * 0.43); ctx.lineTo(s * 0.44, s * 0.43);
    } else if (type === 'item') {
      ctx.moveTo(-s * 0.25, s * 0.34); ctx.lineTo(s * 0.27, -s * 0.32);
      ctx.lineTo(s * 0.38, -s * 0.1); ctx.lineTo(-s * 0.06, s * 0.4); ctx.closePath();
    } else if (type === 'creature') {
      ctx.moveTo(-s * 0.3, s * 0.02);
      ctx.quadraticCurveTo(-s * 0.44, s * 0.3, -s * 0.14, s * 0.34);
      ctx.lineTo(s * 0.14, s * 0.34);
      ctx.quadraticCurveTo(s * 0.44, s * 0.3, s * 0.3, s * 0.02);
      ctx.moveTo(-s * 0.36, -s * 0.2); ctx.arc(-s * 0.36, -s * 0.2, s * 0.1, 0, Math.PI * 2);
      ctx.moveTo(0, -s * 0.3); ctx.arc(0, -s * 0.3, s * 0.11, 0, Math.PI * 2);
      ctx.moveTo(s * 0.36, -s * 0.2); ctx.arc(s * 0.36, -s * 0.2, s * 0.1, 0, Math.PI * 2);
    }
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    if (W <= 0) return;
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(view.x, view.y);
    ctx.scale(view.k, view.k);

    const focus = hoverId || selectId;
    const hot = focus ? new Set([focus, ...(adj.get(focus) || [])]) : null;


    links.forEach(l => {
      if (!visibleLink(l)) return;
      const st = REL_STYLE[l.type] || REL_STYLE.social;
      const sameGroup = l.s.ref.group === l.t.ref.group;
      const isHover = l === hoverLink;
      const target = (!focus || (hot.has(l.s.id) && hot.has(l.t.id))) ? 1 : 0;
      l.actT += (target - l.actT) * 0.15;
      ctx.beginPath();
      ctx.strokeStyle = isHover ? st.color : mixHex('#F0ECE2', st.color, l.actT);
      ctx.lineWidth = st.width * (0.7 + 0.3 * l.actT) * (sameGroup ? 1 : 0.78) * (isHover ? 1.9 : 1);
      ctx.globalAlpha = isHover ? 0.96 : (focus ? (0.06 + 0.94 * l.actT) : (sameGroup ? 0.52 : 0.22));
      ctx.setLineDash(st.dash);
      ctx.moveTo(l.s.x, l.s.y);
      ctx.lineTo(l.t.x, l.t.y);
      ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    nodes.forEach(n => {
      if (!visibleNode(n)) return;
      const targetDim = (focus && !hot.has(n.id)) ? 1 : 0;
      n.dimT += (targetDim - n.dimT) * 0.16;
      const targetSel = n.id === selectId ? 1 : 0;
      n.selT += (targetSel - n.selT) * 0.18;

      const color = GROUP_COLOR[n.ref.group] || '#999';
      const type = n.ref.type;
      const breathe = 1 + n.selT * (0.055 + 0.022 * Math.sin(now / 320));
      const rr = n.r * breathe * (type === 'org' ? 1.02 : type === 'item' ? 0.88 : type === 'creature' ? 0.98 : 1);
      ctx.globalAlpha = 1 - n.dimT * 0.72;

      // 选中节点外圈呼吸环
      if (n.selT > 0.015) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, rr + 4 + 4 * n.selT, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(43,42,38,${0.16 * n.selT})`;
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }

      if (type === 'org') {
        nodePath(n, rr);
        ctx.fillStyle = mixHex('#FFFFFF', color, 0.2);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.7;
        ctx.stroke();
      } else if (type === 'item') {
        nodePath(n, rr);
        ctx.fillStyle = mixHex('#FFFFFF', color, 0.5);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.1;
        ctx.stroke();
      } else {
        nodePath(n, rr);
        ctx.fillStyle = color;
        ctx.fill();
        if (type === 'creature') {
          ctx.strokeStyle = mixHex(color, '#2B2A26', 0.28);
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // character / org / item / creature 四类一律绘制类型图标，不再按度数分两套阈值
      drawNodeTypeIcon(type, n.x, n.y, Math.max(rr * 0.96, 6.4));

      if (n.selT > 0.05) {
        nodePath(n, rr);
        ctx.lineWidth = 1.4 + 1.1 * n.selT;
        ctx.strokeStyle = `rgba(43,42,38,${0.4 + 0.55 * n.selT})`;
        ctx.stroke();
      } else if (n.id === selectId) {
        nodePath(n, rr);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#2B2A26';
        ctx.stroke();
      }

      if (!targetDim && (type === 'org' || n.d >= 8 || n.selT > 0.2 || view.k > 1.45)) {
        ctx.globalAlpha = (1 - n.dimT) * (0.55 + 0.45 * n.selT);
        ctx.save();
        ctx.translate(n.x, n.y + rr + 11 / Math.max(view.k, 0.5));
        ctx.scale(1 / view.k, 1 / view.k);
        ctx.font = `${n.selT > 0.2 ? '600 ' : ''}10.5px -apple-system, "PingFang SC", sans-serif`;
        ctx.fillStyle = '#2B2A26';
        ctx.textAlign = 'center';
        ctx.fillText(n.name, 0, 0);
        ctx.restore();
      }
    });
    ctx.globalAlpha = 1;

    // 点击/切换节点时的扩散波纹
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.t += 0.026;
      if (r.t >= 1) { ripples.splice(i, 1); continue; }
      const n = r.n;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 5 + r.t * 34, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(43,42,38,${(1 - r.t) * 0.38})`;
      ctx.lineWidth = 1.4 * (1 - r.t) + 0.4;
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    drawRelationLabels(focus, hot);
    drawLinkTooltip();
    ctx.restore();
  }

  function loop() {
    stepCamera(performance.now());
    tick();
    draw();
    requestAnimationFrame(loop);
  }



/* Novel Atlas viewer · 图谱交互与详情面板
   职责：命中测试 / 拖拽 / 选择 / 侧栏详情 */
  function toWorld(px, py) { return { x: (px - view.x) / view.k, y: (py - view.y) / view.k }; }
  function toScreen(n) { return { x: n.x * view.k + view.x, y: n.y * view.k + view.y }; }
  function relLabel(l) { return l.ref.label || REL_CN[l.type] || '关系'; }

  function pickLink(px, py) {
    let best = null, bestD = 5.5;
    links.forEach(l => {
      if (!visibleLink(l)) return;
      const a = toScreen(l.s), b = toScreen(l.t);
      const vx = b.x - a.x, vy = b.y - a.y;
      const len2 = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((px - a.x) * vx + (py - a.y) * vy) / len2));
      const qx = a.x + vx * t, qy = a.y + vy * t;
      const d = Math.hypot(px - qx, py - qy);
      if (d < bestD) { bestD = d; best = l; }
    });
    return best;
  }
  function pick(px, py) {
    const p = toWorld(px, py);
    let best = null, bestD = Infinity;
    nodes.forEach(n => {
      if (!visibleNode(n)) return;
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < n.r + 6 && d < bestD) { bestD = d; best = n; }
    });
    return best;
  }

  let dragNode = null, panning = false, last = null, moved = false, clickedEmpty = false;

  canvas.addEventListener('mousedown', e => {
    camAnim = null;
    const rect = canvas.getBoundingClientRect();
    const n = pick(e.clientX - rect.left, e.clientY - rect.top);
    moved = false; clickedEmpty = !n;
    if (n) { dragNode = n; n.fixed = true; n._px = e.clientX; n._py = e.clientY; }
    else { panning = true; last = { x: e.clientX, y: e.clientY }; }
    canvas.classList.add('dragging');
  });

  window.addEventListener('mousemove', e => {
    if (e.target !== canvas) { hoverId = null; hoverLink = null; return; }
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (dragNode) {
      const p = toWorld(mx, my);
      if (Math.hypot(e.clientX - dragNode._px, e.clientY - dragNode._py) > 3) moved = true;
      dragNode.x = p.x; dragNode.y = p.y;
      alpha = Math.max(alpha, 0.28);
      return;
    }
    if (panning && last) {
      view.x += e.clientX - last.x; view.y += e.clientY - last.y;
      last = { x: e.clientX, y: e.clientY }; moved = true;
      return;
    }
    if (mx < 0 || my < 0 || mx > W || my > H) { hoverId = null; hoverLink = null; return; }
    const n = pick(mx, my);
    hoverId = n ? n.id : null;
    hoverLink = n ? null : pickLink(mx, my);
    pointer = { x: mx, y: my };
    canvas.style.cursor = (n || hoverLink) ? 'pointer' : 'grab';
  });

  window.addEventListener('mouseup', e => {
    if (dragNode) {
      const n = dragNode;
      const dist = Math.hypot(e.clientX - n._px, e.clientY - n._py);
      if (dist < 6) select(n.id); else n.fixed = false;
    } else if (clickedEmpty && !moved) {
      selectId = null; closePanel();
    }
    dragNode = null; panning = false; last = null; clickedEmpty = false;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camAnim = null;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const before = toWorld(mx, my);
    // 倍数作用于「适配比例」，与地图 zoomMapBy 同一套语义。
    // fitView 算出的 k 随节点分布与视口在 0.42–1.4 之间浮动，用绝对上限（原 3.2）
    // 会让布局紧凑的书只能放大一点点，布局稀疏的书又能放到很大。
    const fit = view.fitK || view.k || 1;
    const z = Math.max(0.35, Math.min(6, (view.k / fit) * (e.deltaY < 0 ? 1.1 : 0.9)));
    view.k = fit * z;
    const after = toWorld(mx, my);
    view.x += (after.x - before.x) * view.k;
    view.y += (after.y - before.y) * view.k;
  }, { passive: false });

  canvas.addEventListener('dblclick', () => {
    nodes.forEach(n => { n.fixed = false; });
    alpha = 0.5;
    setTimeout(fitView, 60);
  });

  /* ================= 详情面板 ================= */
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panelBody');

  function closePanel() {
    panel.classList.remove('open');
    selectId = null;
  }
  function animatePanelBody() {
    panelBody.classList.remove('switch-in');
    void panelBody.offsetWidth;
    panelBody.classList.add('switch-in');
  }
  document.getElementById('panelClose').addEventListener('click', closePanel);

  function relColor(t) { return (REL_STYLE[t] || REL_STYLE.social).color; }

  function renderPowerHistory(e) {
    const h = e.power_history || [];
    if (!h.length) return '';
    return `<div class="sec-title" style="margin-top:18px">境界轨迹</div>
      <div class="power-list">
      ${h.map(p => `<div class="power-row">
        <span class="power-ch">第 ${p.ch} 章</span>
        <span><span class="power-realm">${powerFull(p)}</span>
        ${p.note ? `<span class="power-note"> · ${p.note}</span>` : ''}</span>
      </div>`).join('')}
      </div>`;
  }

  function select(id, opts = {}) {
    const rec = allById.get(id);
    if (!rec) return;
    if (rec._kind !== 'entity') { renderLite(rec); return; }
    ensureNodeVisible(id);
    selectId = id;
    const e = rec;
    const neighbors = links.filter(l => l.s.id === id || l.t.id === id)
      .map(l => ({ other: l.s.id === id ? l.t : l.s, rel: l.ref }))
      .sort((a, b) => (b.rel.weight || 0) - (a.rel.weight || 0));

    const power = powerAt(id);
    const myForeshadows = FORESHADOWS.filter(f =>
      (f.content || '').includes(e.name) ||
      (f.note || '').includes(e.name));

    panelBody.innerHTML = `
      <h2 class="ent-name">${entityIcon(e.type, 'entity-icon-lg')}<span>${e.name}</span></h2>
      <div class="ent-meta">
        ${TYPE_NAME[e.type] || ''} · 第 ${e.first_ch} 章登场${e.last_ch ? ` · 第 ${e.last_ch} 章退场` : ''}
        ${power ? ` · 当前 ${powerFull(power)}` : ''}
      </div>
      <div class="chips">
        <span class="chip grp" style="background:${GROUP_COLOR[e.group] || '#999'}">${e.group}</span>
        ${(e.aliases || []).map(a => `<span class="chip">${a}</span>`).join('')}
      </div>
      <p class="ent-desc">${e.desc || ''}</p>
      ${e.attrs ? `<div class="sec-title">档案</div><div class="attrs">${
        Object.entries(e.attrs).map(([k, v]) => `<b>${k}</b> · ${v}`).join('<br>')
      }</div>` : ''}
      ${renderPowerHistory(e)}
      <div class="sec-title" style="margin-top:18px">关系 · ${neighbors.length}</div>
      ${neighbors.map(n => `
        <div class="rel-item" data-goto="${n.other.id}">
          <span class="rel-dot" style="background:${relColor(n.rel.type)}"></span>
          <span class="rel-name">${entityIcon(n.other.ref.type, 'entity-icon-sm')}${n.other.name}</span>
          <span class="rel-label">${n.rel.label || REL_CN[n.rel.type] || ''}</span>
        </div>`).join('')}
      ${myForeshadows.length ? `<div class="sec-title" style="margin-top:18px">相关伏笔</div>` +
        myForeshadows.map(f => `
          <div class="rel-item">
            <span class="rel-dot" style="background:${STATUS_META[fsStatus(f)].color}"></span>
            <span class="rel-name" style="font-size:12px">${f.content}</span>
          </div>`).join('') : ''}
    `;
    panel.classList.add('open');
    animatePanelBody();
    const picked = nodeById.get(id);
    pulseNode(picked);
    if (opts.center && picked) centerOn(picked, true);
    panelBody.querySelectorAll('[data-goto]').forEach(el => {
      el.addEventListener('click', () => {
        const t = el.getAttribute('data-goto');
        select(t, { center: true });
      });
    });
  }

  function renderLite(r) {
    const kindCn = r.type === 'org' ? '势力' : r._kind === 'place' ? '地点' : '设定';
    let extra = '';
    if (r.parent) {
      const p = allById.get(r.parent);
      if (p) extra = `<div class="chips"><span class="chip">上级：${p.name}</span></div>`;
    }
    if (r._kind === 'concept' && r.kind) {
      extra += `<div class="chips"><span class="chip">${
        { worldview: '世界观', golden_finger: '金手指', technique: '功法',
          item_grade: '品阶', organization_rule: '组织规则', prophecy: '预言' }[r.kind] || r.kind
      }</span></div>`;
    }
    const rules = (r.rules && r.rules.length) ? `
      <div class="sec-title" style="margin-top:16px">规则</div>
      <div class="attrs">${r.rules.map(x => '· ' + x).join('<br>')}</div>` : '';
    const limits = (r.limits && r.limits.length) ? `
      <div class="sec-title" style="margin-top:16px">限制 / 代价</div>
      <div class="attrs" style="color:#A6314A">${r.limits.map(x => '· ' + x).join('<br>')}</div>` : '';
    panelBody.innerHTML = `
      <h2 class="ent-name">${r.type ? entityIcon(r.type, 'entity-icon-lg') : ''}<span>${r.name}</span></h2>
      <div class="ent-meta">${r.type ? TYPE_NAME[r.type] : kindCn} · 第 ${r.first_ch || '?'} 章出现</div>
      ${extra}
      <p class="ent-desc">${r.desc || ''}</p>
      ${rules}${limits}
    `;
    panel.classList.add('open');
    animatePanelBody();
  }



/* Novel Atlas viewer · 视图切换、总览与疑点
   职责：setView / 首页 / 疑点索引 */
