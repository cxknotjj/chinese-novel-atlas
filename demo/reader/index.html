        </div>
      </div>

      <h2>世界入口 <span class="n">八个视图，共用同一份世界档案</span></h2>
      <div class="home-grid">
        ${entries.map(([v, title, count, desc]) => `
          <div class="home-card" data-home-view="${v}">
            <div class="hc-k">${escHtml(count)}</div>
            <div class="hc-v">${escHtml(title)}</div>
            <div class="hc-n">${escHtml(desc)}</div>
          </div>`).join('')}
      </div>

      <div class="home-note">
        <b>阅读原则：</b>所有视图都只显示第 1–${cutoff} 章读者已知的内容。
        地图坐标是叙事示意，不是经纬度；疑点是数据候选，不是对作品的判决。
      </div>
    `;
    home.querySelectorAll('[data-home-view]').forEach(el => {
      el.addEventListener('click', () => setView(el.dataset.homeView));
    });
  }

  /* ================= 疑点索引 ================= */
  let anomalyFilter = 'all';
  const anomalyStateKey = id => 'novel-atlas.anomaly.' + id;
  function anomalyState(id) {
    try { return localStorage.getItem(anomalyStateKey(id)) || ''; } catch (e) { return ''; }
  }
  function setAnomalyState(id, state) {
    try { localStorage.setItem(anomalyStateKey(id), state); } catch (e) {}
    renderAnomalies();
  }
  function renderAnomalies() {
    const wrap = views.anomalies;
    if (!wrap) return;
    const all = D.anomalies || [];
    const sev = { high: 0, warning: 0, info: 0 };
    all.forEach(a => { sev[a.severity] = (sev[a.severity] || 0) + 1; });
    const filtered = anomalyFilter === 'warning'
      ? all.filter(a => a.severity !== 'info')
      : anomalyFilter === 'foreshadow'
        ? all.filter(a => a.kind === 'foreshadow_unresolved')
        : anomalyFilter === 'other'
          ? all.filter(a => a.kind !== 'foreshadow_unresolved' && a.kind !== 'entity_after_last')
          : all;
    wrap.innerHTML = `
      <h2>作品疑点索引 <span class="n">${all.length} 条 · 第 1–${cutoff} 章范围内</span></h2>
      <div class="home-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px">
        <div class="home-card"><div class="hc-k">高优先</div><div class="hc-v">${sev.high || 0}</div><div class="hc-n">明确冲突或高置信候选</div></div>
        <div class="home-card"><div class="hc-k">待复核</div><div class="hc-v">${sev.warning || 0}</div><div class="hc-n">需要回原文确认</div></div>
        <div class="home-card"><div class="hc-k">线索型</div><div class="hc-v">${sev.info || 0}</div><div class="hc-n">越级、别名、关系等候选</div></div>
      </div>
      <div class="fs-meta" style="margin:4px 0 12px">
        只标注，不给改稿建议。每条疑点必须带章节坐标或原文片段；点证据可跳到对应章节。
      </div>
      <div class="power-toolbar">
        <span>筛选</span>
        ${[['all','全部'],['warning','高优先/待复核'],['foreshadow','伏笔未回收'],['other','其他线索']].map(([k,n]) =>
          `<button class="power-filter${anomalyFilter === k ? ' on' : ''}" data-anomaly-filter="${k}">${n}</button>`).join('')}
      </div>
      ${filtered.length ? filtered.map(a => {
        const state = anomalyState(a.id);
        const sevCn = { high: '高优先', warning: '待复核', info: '线索' }[a.severity] || a.severity;
        const range = (() => {
          const r = a.chapter_range || [];
          if (!r.length) return '';
          return r[0] === r[r.length - 1] ? String(r[0]) : `${r[0]}–${r[r.length - 1]}`;
        })();
        const ev = (a.evidence || []).map(e =>
          `<div><button class="geo-jump" data-anomaly-ch="${escHtml(String(e.coordinate || '').replace(/^ch/i, '').split(':')[0])}">${escHtml(e.coordinate || '')}</button>
            ${escHtml(e.quote || '')}</div>`).join('');
        return `<div class="anomaly-card ${state === 'verified' ? 'verified' : ''}">
          <div class="anomaly-head">
            <span class="anomaly-sev ${escHtml(a.severity)}">${sevCn}</span>
            <span class="chip">${escHtml(a.kind_cn || a.kind)}</span>
            <span class="chip">置信 ${escHtml(a.confidence || '—')}</span>
            ${range ? `<span class="chip">第 ${escHtml(range)} 章</span>` : ''}
            ${state === 'verified' ? '<span class="chip">已核实</span>' : state === 'rejected' ? '<span class="chip">已标误报</span>' : ''}
          </div>
          <div class="ac-title">${escHtml(a.title || '')}</div>
          <div class="ac-meta">${escHtml(a.detail || '')}</div>
          <div class="ac-ev">${ev || '暂无坐标证据'}</div>
          <div class="ac-note">${escHtml(a.reader_note || '')}</div>
          <div class="ac-actions">
            <button data-anomaly-verify="${escHtml(a.id)}">标记已核实</button>
            <button data-anomaly-reject="${escHtml(a.id)}">标为误报</button>
          </div>
        </div>`;
      }).join('') : '<div class="anomaly-empty">当前进度没有可展示的疑点。继续阅读或换一本分析完整的书。</div>'}
    `;
    wrap.querySelectorAll('[data-anomaly-filter]').forEach(b => b.addEventListener('click', () => {
      anomalyFilter = b.dataset.anomalyFilter;
      renderAnomalies();
    }));
    wrap.querySelectorAll('[data-anomaly-verify]').forEach(b => b.addEventListener('click', () => setAnomalyState(b.dataset.anomalyVerify, 'verified')));
    wrap.querySelectorAll('[data-anomaly-reject]').forEach(b => b.addEventListener('click', () => setAnomalyState(b.dataset.anomalyReject, 'rejected')));
    wrap.querySelectorAll('[data-anomaly-ch]').forEach(b => b.addEventListener('click', () => {
      const n = Number(b.dataset.anomalyCh);
      const c = CHAPTERS.find(x => x.ch === n);
      if (c) showChapter(c);
    }));
  }



/* Novel Atlas viewer · 百科与地点志
   职责：百科分页 / 地点树 / 地点详情 */
  /* ================= 百科 ================= */
  const WIKI_PAGE_SIZE = 24;
  let wikiCharPage = 0, wikiOtherPage = 0, wikiPlacePage = 0, wikiConceptPage = 0;

  // 分页片段：百科 / 节奏 / 伏笔三处复用，放在模块作用域
  function pagerHTML(total, page, size, attr) {
    const pages = Math.max(1, Math.ceil(total / size));
    if (pages <= 1) return '';
    page = Math.min(Math.max(page, 0), pages - 1);
    let start = Math.max(0, page - 2);
    let end = Math.min(pages, start + 5);
    if (end - start < 5) start = Math.max(0, end - 5);
    let nums = '';
    for (let i = start; i < end; i++) {
      nums += `<button data-${attr}="${i}" class="${i === page ? 'on' : ''}">${i + 1}</button>`;
    }
    return `<div class="pager">
      <button data-${attr}="${page - 1}" ${page === 0 ? 'disabled' : ''}>上一页</button>
      ${start > 0 ? `<button data-${attr}="0">1</button><span>…</span>` : ''}
      ${nums}
      ${end < pages ? `<span>…</span><button data-${attr}="${pages - 1}">${pages}</button>` : ''}
      <button data-${attr}="${page + 1}" ${page >= pages - 1 ? 'disabled' : ''}>下一页</button>
      <span>共 ${total} 条</span>
    </div>`;
  }

  function renderWiki() {

  const WIKI_PAGE_SIZE = 24;
    const scrollTop = views.wiki.scrollTop;
    const chars = D.entities.filter(e => e.type === 'character');
    const others = D.entities.filter(e => e.type !== 'character');
    const charPages = Math.max(1, Math.ceil(chars.length / WIKI_PAGE_SIZE));
    const otherPages = Math.max(1, Math.ceil(others.length / WIKI_PAGE_SIZE));
    const placePages = Math.max(1, Math.ceil(D.places.length / WIKI_PAGE_SIZE));
    const conceptPages = Math.max(1, Math.ceil(D.concepts.length / WIKI_PAGE_SIZE));
    wikiCharPage = Math.min(wikiCharPage, charPages - 1);
    wikiOtherPage = Math.min(wikiOtherPage, otherPages - 1);
    wikiPlacePage = Math.min(wikiPlacePage, placePages - 1);
    wikiConceptPage = Math.min(wikiConceptPage, conceptPages - 1);

    const secs = [
      {
        title: '角色', items: chars.slice(wikiCharPage * WIKI_PAGE_SIZE, (wikiCharPage + 1) * WIKI_PAGE_SIZE),
        total: chars.length, page: wikiCharPage, attr: 'wchar', showType: false
      },
      {
        title: '势力 / 器物 / 妖兽', items: others.slice(wikiOtherPage * WIKI_PAGE_SIZE, (wikiOtherPage + 1) * WIKI_PAGE_SIZE),
        total: others.length, page: wikiOtherPage, attr: 'wother', showType: true
      },
      { title: '境界体系', items: REALMS.map(r => ({ id: r.id, name: r.name, desc: r.desc })), total: REALMS.length, showType: false },
      {
        title: '地点', items: D.places.slice(wikiPlacePage * WIKI_PAGE_SIZE, (wikiPlacePage + 1) * WIKI_PAGE_SIZE),
        total: D.places.length, page: wikiPlacePage, attr: 'wplace', showType: false
      },
      {
        title: '设定', items: D.concepts.slice(wikiConceptPage * WIKI_PAGE_SIZE, (wikiConceptPage + 1) * WIKI_PAGE_SIZE),
        total: D.concepts.length, page: wikiConceptPage, attr: 'wconcept', showType: false
      }
    ].filter(s => s.items.length);

    views.wiki.innerHTML = secs.map(s => `
      <h2>${s.title} <span class="n">${s.total} 条${s.attr ? ` · 第 ${s.page + 1} / ${Math.max(1, Math.ceil(s.total / WIKI_PAGE_SIZE))} 页` : ''}</span></h2>
      <div class="grid">
        ${s.items.map(it => `
          <div class="card" data-id="${it.id}">
            ${s.showType && it.type ? `<div class="card-type">${entityIcon(it.type)}<span>${TYPE_NAME[it.type] || it.type}</span></div>` : ''}
            <div class="n">${!s.showType && it.type ? entityIcon(it.type, 'entity-icon-sm') : ''}${it.name}</div>
            <div class="d">${(it.desc || '').slice(0, 64)}</div>
          </div>`).join('')}
      </div>
      ${s.attr ? pagerHTML(s.total, s.page, WIKI_PAGE_SIZE, s.attr) : ''}`).join('');

    views.wiki.querySelectorAll('[data-wchar]').forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      wikiCharPage = +b.dataset.wchar;
      renderWiki();
      const h = views.wiki.querySelectorAll('h2')[0];
      if (h) h.scrollIntoView({ block: 'start' });
    }));
    views.wiki.querySelectorAll('[data-wother]').forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      wikiOtherPage = +b.dataset.wother;
      renderWiki();
      const h = views.wiki.querySelectorAll('h2')[1];
      if (h) h.scrollIntoView({ block: 'start' });
    }));
    views.wiki.querySelectorAll('[data-wplace]').forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      wikiPlacePage = +b.dataset.wplace;
      renderWiki();
      const h = [...views.wiki.querySelectorAll('h2')].find(x => x.textContent.trim().startsWith('地点'));
      if (h) h.scrollIntoView({ block: 'start' });
    }));
    views.wiki.querySelectorAll('[data-wconcept]').forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      wikiConceptPage = +b.dataset.wconcept;
      renderWiki();
      const h = [...views.wiki.querySelectorAll('h2')].find(x => x.textContent.trim().startsWith('设定'));
      if (h) h.scrollIntoView({ block: 'start' });
    }));
    views.wiki.querySelectorAll('[data-id]').forEach(c => {
      c.addEventListener('click', () => {
        const id = c.dataset.id;
        const rec = allById.get(id);
        if (rec && rec._kind === 'entity') {
          setView('graph');
          select(id, { center: true });
        } else if (rec && rec._kind === 'place') {
          openPlace(id);
        } else if (rec) {
          renderLite(rec);
        } else {
          const r = REALMS.find(x => x.id === id);
          if (r) renderLite({ _kind: 'concept', name: r.name, desc: r.desc, first_ch: r.first_ch });
        }
      });
    });
    views.wiki.scrollTop = scrollTop;
  }

  /* ================= 地点志 ================= */
  let geoSelected = (placeById.get('p_yueguo') || placeRoots[0] || {}).id || '';
  const geoExpanded = new Set([...placeChildren.keys()]);

  function placeOwnerText(p, short) {
    const info = placeOwnerInfo(p);
    if (info.disputed) return short ? '交界' : info.roots.map(o => o.name).join(' / ');
    if (info.special) return info.special;
    if (!info.roots.length) return '未归属';
    const root = info.roots[0];
    if (info.direct && info.direct.id !== root.id) return short ? info.direct.name : root.name + ' · ' + info.direct.name + '辖';
    return root.name;
  }

  function ownerBadgesHTML(info) {
    let out = info.roots.map(o =>
      `<button class="geo-badge geo-jump" data-org="${o.id}" title="查看势力档案">${escHtml(o.name)}</button>`).join('');
    if (info.disputed) out += `<span class="geo-badge warn">交界 · 双方主张</span>`;
    if (info.special) out += `<span class="geo-badge warn">${escHtml(info.special)}</span>`;
    if (!out) out = `<span class="geo-empty">未标注势力归属</span>`;
    return out;
  }

  function geoRowHTML(p, depth) {
    const kids = placeChildren.get(p.id) || [];
    const st = placeStage(p);
    const info = placeOwnerInfo(p);
    const owner = placeOwnerText(p, true);
    const sel = p.id === geoSelected;
    return `<div class="geo-row${sel ? ' on' : ''}" data-place="${p.id}"
        style="padding-left:${11 + depth * 18}px">
      <button class="geo-toggle${kids.length ? '' : ' leaf'}" data-toggle="${p.id}"
        aria-label="展开或收起">${geoExpanded.has(p.id) ? '−' : '+'}</button>
      <i class="geo-dot" style="background:${st.color}"></i>
      <span class="geo-name" title="${escHtml(p.name)}">${escHtml(p.name)}</span>
      <span class="geo-ch">${p.first_ch ? '第' + p.first_ch + '章' : '—'}</span>
      <span class="geo-owner${info.roots.length || info.special ? ' owned' : ''}"
        title="${escHtml(placeOwnerText(p))}">${escHtml(owner)}</span>
    </div>${geoExpanded.has(p.id) ? kids.map(k => geoRowHTML(k, depth + 1)).join('') : ''}`;
  }

  function geoDetailHTML(p) {
    const st = placeStage(p);
    const depth = placeDepth(p);
    const info = placeOwnerInfo(p);
    const kids = placeChildren.get(p.id) || [];
    const path = placePath(p);
    const first = chapterByCh.get(p.first_ch);
    const matches = CHAPTERS.filter(c =>
      [c.title, c.summary, c.hook].filter(Boolean).join(' ').includes(p.name));
    const evs = [];
    if (first) evs.push({ c: first, tag: '首现' });
    matches.forEach(c => {
      if (c.ch !== (first && first.ch) && evs.length < 5) evs.push({ c, tag: '点名' });
    });

    const people = D.entities.filter(e => e.type === 'character' &&
      ([e.desc, ...(e.aliases || [])].filter(Boolean).join(' ').includes(p.name)));
    const sameGroup = info.roots.length
      ? D.entities.filter(e => e.type === 'character' && info.roots.some(o => e.group === o.group))
        .sort((a, b) => (deg.get(b.id) || 0) - (deg.get(a.id) || 0)).slice(0, 7)
      : [];
    const orgRoots = info.roots.slice(0, 2);
    const seenSib = new Set();
    const allSameOwnerPlaces = orgRoots.length
      ? PLACES.filter(x => {
          if (x.id === p.id) return false;
          const xi = placeOwnerInfo(x);
          if (!xi.roots.some(r => orgRoots.some(o => o.id === r.id))) return false;
          if (seenSib.has(x.id)) return false;
          seenSib.add(x.id);
          return true;
        })
      : [];
    const sameOwnerPlaces = allSameOwnerPlaces.slice(0, 12);

    const attrs = Object.entries(p.attrs || {});
    return `
      <h2 class="geo-detail-title">${escHtml(p.name)}</h2>
      <div class="geo-meta">第 ${p.first_ch || '—'} 章首现 · ${st.label} · 第 ${depth + 1} 层</div>
      <div class="geo-badges">${ownerBadgesHTML(info)}<span class="geo-badge">${kids.length} 个下级地点</span></div>
      <p class="geo-desc">${escHtml(p.desc || '暂无档案描述。')}</p>

      <div class="geo-sec-title">位置档案</div>
      <div class="geo-kv">
        <div class="k">父级路径</div>
        <div class="v">${path.map(x => `<button class="geo-jump" data-jump="${x.id}">${escHtml(x.name)}</button>`).join(' › ') || '—'}</div>
        ${attrs.map(([k, v]) => `<div class="k">${escHtml(k)}</div><div class="v">${escHtml(v)}</div>`).join('')}
      </div>

      <div class="geo-sec-title">子地点</div>
      <div class="geo-chip-row">${kids.length ? kids.map(k =>
        `<button class="geo-chip geo-jump" data-jump="${k.id}">${escHtml(k.name)} <span style="color:#9A9488">第${k.first_ch || '—'}章</span></button>`).join('') :
        '<span class="geo-empty">无下级地点记录</span>'}</div>

      <div class="geo-sec-title">归属与势力档案</div>
      ${orgRoots.length ? orgRoots.map(o => `
        <div class="geo-org-card">
          <b>${escHtml(o.name)}</b>
          <span class="geo-org-desc">${escHtml((o.desc || '暂无势力档案描述。').slice(0, 120))}</span>
          <button class="geo-org-link" data-org="${o.id}">档案</button>
        </div>`).join('') : info.special ? `
        <div class="geo-org-card gap">
          <b>${escHtml(info.special)}</b>
          <span class="geo-org-desc">没有单一势力归属，按原文的共管/公共区域处理；不强行挂到某一方。</span>
        </div>` : `
        <div class="geo-org-card gap">
          <b>数据缺口</b>
          <span class="geo-org-desc">只有行政/地理 parent，没有可核实的势力归属；保留为空，不猜。</span>
        </div>`}
      ${sameOwnerPlaces.length ? `
        <div class="geo-sec-title">同势力其他据点（${allSameOwnerPlaces.length}${allSameOwnerPlaces.length > 12 ? '，显示前 12' : ''}）</div>
        <div class="geo-chip-row">${sameOwnerPlaces.map(x =>
          `<button class="geo-chip geo-jump" data-jump="${x.id}">${escHtml(x.name)} <span style="color:#9A9488">第${x.first_ch || '—'}章</span></button>`).join('')}</div>` : ''}

      <div class="geo-sec-title">章节证据 · 摘要点名</div>
      <div class="geo-evidence">${evs.length ? evs.map(({ c, tag }) => `
        <div class="geo-ev-row" data-ch="${c.ch}">
          <div class="geo-ev-ch">第 ${c.ch} 章<br><span style="color:#B4B2A9">${tag}</span></div>
          <div class="geo-ev-body"><b>${escHtml(c.title)}</b> · ${escHtml((c.summary || '').slice(0, 82))}</div>
        </div>`).join('') : '<div class="geo-empty">章节摘要没有直接点名此地；目前只有首现章记录，没有可附会的事件。</div>'}</div>

      <div class="geo-sec-title">档案关联人物</div>
      <div class="geo-chip-row">${people.length
        ? people.slice(0, 7).map(e => `<button class="geo-chip" data-ent="${e.id}">${entityIcon(e.type, 'entity-icon-sm')}${escHtml(e.name)}</button>`).join('')
        : sameGroup.length
          ? sameGroup.map(e => `<button class="geo-chip" data-ent="${e.id}">${entityIcon(e.type, 'entity-icon-sm')}${escHtml(e.name)}</button>`).join('')
          : '<span class="geo-empty">档案里没有直接提到此地的人物。</span>'}</div>
      <div class="geo-empty" style="margin-top:6px">${people.length
        ? '按人物简介直接提到地名匹配；不等于此人在该地登场。'
        : sameGroup.length
          ? '这里没有直接点名的人物；上面是同势力人物（按档案归属列出，不等于在场）。'
          : ''}</div>

      <div class="geo-empty" style="margin-top:12px">本页只用层级、归属和首现章；数据没有坐标，不虚构方位。</div>
    `;
  }

  function renderGeo() {
    if (!geoSelected || !placeById.has(geoSelected)) geoSelected = (placeById.get('p_yueguo') || placeRoots[0] || {}).id || '';
    const scrollTop = views.geo.scrollTop;
    const p = placeById.get(geoSelected);
    const counts = GEO_STAGES.map(s => ({
      ...s, count: PLACES.filter(x => placeStage(x).label === s.label).length
    }));
    views.geo.innerHTML = `
      <div class="geo-note">
        ${PLACES.length} 个地点按 <b>parent</b> 组成层级容器，按首现章分四个地理阶段。数据只有层级、归属和出现章号，没有坐标；这张页面不画地图，也不猜方位。
      </div>
      <div class="geo-stage-strip">${counts.map(s => `
        <span class="geo-stage-chip"><i style="background:${s.color}"></i><b>${s.label}</b>
          <span>${s.count} 处 · ${s.note}</span></span>`).join('')}</div>
      <div class="geo-layout">
        <div class="geo-tree-panel">
          <div class="geo-tree-head"><b>地点层级树</b><span>${PLACES.length} 个地点 · ${placeRoots.length} 个顶层容器</span></div>
          ${placeRoots.map(p => geoRowHTML(p, 0)).join('')}
        </div>
        <div class="geo-detail">${p ? geoDetailHTML(p) : '<div class="geo-empty">没有地点数据。</div>'}</div>
      </div>
    `;

    views.geo.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.dataset.toggle;
      if (geoExpanded.has(id)) geoExpanded.delete(id); else geoExpanded.add(id);
      renderGeo();
    }));
    views.geo.querySelectorAll('[data-place]').forEach(row => row.addEventListener('click', () => {
      geoSelected = row.dataset.place;
      renderGeo();
    }));
    views.geo.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.dataset.jump;
      if (!placeById.has(id)) return;
      geoSelected = id;
      renderGeo();
      const row = views.geo.querySelector(`[data-place="${id}"]`);
      if (row) row.scrollIntoView({ block: 'center' });
    }));
    views.geo.querySelectorAll('[data-ent]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      setView('graph');
      select(b.dataset.ent, { center: true });
    }));
    views.geo.querySelectorAll('[data-org]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const o = byId.get(b.dataset.org);
      if (o) renderLite(o);
    }));
    views.geo.querySelectorAll('[data-ch]').forEach(row => row.addEventListener('click', () => {
      const c = chapterByCh.get(+row.dataset.ch);
      if (c) showChapter(c);
    }));
    views.geo.scrollTop = scrollTop;
  }

  function openPlace(id) {
    if (!placeById.has(id)) return;
    geoSelected = id;
    setView('geo');
  }



/* Novel Atlas viewer · 地图数据模型与视图变换
   职责：M1/M2/2D 模型 / 分层 / 缩放 / drawMap 调度 */
  /* ================= 地图视图（M1 拓扑 / M2 证据化示意） ================= */
  // 空间关系可选：缺失或空 list 时 M2 自动回退 M1，不算错误
  const SPATIAL = Array.isArray(D.spatial_relations) ? D.spatial_relations : [];
  // 示意布局可选：data.map_layout（v2 契约），缺失时 2D 回退拓扑
  const MAP_LAYOUT = (D.map_layout && D.map_layout.mode === 'schematic') ? D.map_layout : null;
  // 有 direction/distance 证据的端点集合（徽标判定）
  const evidenceEndpoints = new Set();
  SPATIAL.forEach(r => {
    if (r.kind === 'direction' || r.kind === 'distance') { evidenceEndpoints.add(r.s); evidenceEndpoints.add(r.t); }
  });
  const SPATIAL_KIND_CN = {
    direction: '方位', distance: '距离', contain: '包含', adjacent: '相邻',
    portal: '传送', travel_path: '航线/路径', road: '道路', river: '河流',
    separated_by: '相隔', in_between: '介于'
  };
  const CONF_CN = { high: '高置信', medium: '中置信', low: '低置信' };
  const CONF_COLOR = { high: '#5A7A5E', medium: '#B8925A', low: '#9A9488' };
  const M2_KINDS = new Set(['direction', 'distance', 'contain', 'adjacent']);
  // 方向语义统一为「s 位于 t 的该方位」；向量 [x, y]，x 东正、y 南正
  const DIR_VEC = {
    north_of: [0, -1], south_of: [0, 1], west_of: [-1, 0], east_of: [1, 0],
    northeast_of: [1, -1], northwest_of: [-1, -1],
    southeast_of: [1, 1], southwest_of: [-1, 1]
  };

  // 三个子视图：map2d 示意 2D（默认）/ m2 证据方位（约束求解，原样保留）/ topo 拓扑树
  let mapMode = 'map2d';
  let mapLayer = null;        // m2 / topo 用：null=默认最大根层；'all'=总览
  let map2dLayer = 'all';
  let mapSlice = 'all';
  let mapModel = null;
  let mapHoverNode = null, mapHoverEdge = null;
  let mapView = { x: 0, y: 0, k: 1 };
  let mapDragNode = null, mapPanning = false, mapLast = null, mapMoved = false, mapPressNode = null;
let mapEditMode = false, mapDirty = false, mapEditSelected = null;

  const mapSubtreeCache = new Map();
  function mapSubtree(rootId) {
    if (mapSubtreeCache.has(rootId)) return mapSubtreeCache.get(rootId);
    const out = new Set([rootId]);
    const walk = id => (placeChildren.get(id) || []).forEach(c => { out.add(c.id); walk(c.id); });
    walk(rootId);
    mapSubtreeCache.set(rootId, out);
    return out;
  }
  function mapLayerList() {
    const roots = placeRoots.map(p => ({ id: p.id, name: p.name, count: mapSubtree(p.id).size }));
    roots.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh'));
    return [{ id: 'all', name: '全部', count: PLACES.length }, ...roots];
  }
  function mapRootOf(id) {
    let cur = placeById.get(id), seen = new Set();
    while (cur && cur.parent && placeById.has(cur.parent) && !seen.has(cur.id)) {
      seen.add(cur.id); cur = placeById.get(cur.parent);
    }
    return cur ? cur.id : id;
  }
  const mapRootColor = new Map();
  function mapColorOf(rootId) {
    if (!mapRootColor.has(rootId)) mapRootColor.set(rootId, PALETTE[mapRootColor.size % PALETTE.length]);
    return mapRootColor.get(rootId);
  }
  function resolvedMapLayer() {
    if (mapLayer) return mapLayer;
    const list = mapLayerList();
    return list[1] ? list[1].id : 'all';
  }
  function mapLayerNodeIds() {
    const l = resolvedMapLayer();
    if (l === 'all') return new Set(PLACES.map(p => p.id));
    return mapSubtree(l);
  }
  function mapRelsFor(ids) {
    const m2 = [], aux = [];
    SPATIAL.forEach(r => {
      if (!placeById.has(r.s) || !placeById.has(r.t) || r.s === r.t) return;
      if (!ids.has(r.s) && !ids.has(r.t)) return;
      if (M2_KINDS.has(r.kind)) m2.push(r); else aux.push(r);
    });
    return { m2, aux };
  }

  function mapTimeSlices() {
    const list = (MAP_LAYOUT && Array.isArray(MAP_LAYOUT.time_slices)) ? MAP_LAYOUT.time_slices : [];
    return list.filter(s => {
      const ch = Number(s.ch || s.first_ch || s.start_ch || 0);
      return ch > 0 && ch <= cutoff;
    });
  }
  function activeMapSlice() {
    if (mapSlice === 'all') return null;
    return mapTimeSlices().find(s => String(s.ch) === String(mapSlice)) || null;
  }
  function map2dRegionOf(placeId) {
    return (MAP_LAYOUT.regions || []).find(r =>
      r.layer && (r.layer === mapRootOf(placeId) || mapSubtree(r.layer).has(placeId)));
  }

  /* ---------- 示意 2D：读 map_layout 的近似布局 ---------- */
  function map2dRegionLayerOf(placeId) {
    const root = mapRootOf(placeId);
    const reg = (MAP_LAYOUT.regions || []).find(r => r.layer && (r.layer === root || mapSubtree(r.layer).has(placeId)));
    return reg ? reg.layer : null;
  }
  function buildMap2dModel() {
    if (!MAP_LAYOUT) {
      return {
        nodes: [], edges: [], regions: [], unknown: [], sat: null, map2d: true,
        fallback: { reason: '未提供示意坐标，已回退拓扑视图' }
      };
    }
    const slice = activeMapSlice();
    const sliceNodes = new Set((slice && slice.nodes) || []);
    const sliceRegions = new Set((slice && slice.regions) || []);
    const sliceRoutes = new Set((slice && slice.routes) || []);
    const sliceFiltered = !!(slice && (sliceNodes.size || sliceRegions.size));
    const rawNodes = (MAP_LAYOUT.nodes || []).filter(n => placeById.has(n.place)).filter(n => {
      if (!sliceFiltered) return true;
      if (sliceNodes.has(n.place)) return true;
      const region = map2dRegionOf(n.place);
      return !!(region && sliceRegions.has(region.id));
    });
    const nodes = rawNodes.map(n => {
      const p = placeById.get(n.place);
      const layer = n.layer || map2dRegionLayerOf(n.place);
      return {
        id: n.place, ref: p, name: p.name, x: n.x, y: n.y,
        rank: n.rank || 2, label: n.label !== false, layer,
        marker: n.marker || null, markerOffset: n.markerOffset,
        rootId: mapRootOf(n.place), kids: (placeChildren.get(n.place) || []).length,
        r: 7, evidence: evidenceEndpoints.has(n.place),
        unknown: false, inLayer: true
      };
    });
    const availLayers = new Set();
    nodes.forEach(n => { if (n.layer) availLayers.add(n.layer); });
    (MAP_LAYOUT.regions || []).forEach(r => { if (r.layer) availLayers.add(r.layer); });
    // 当前选中层在本数据中不存在时，回退「全部」，不得整层隐藏成空
    const layerFilter = (map2dLayer === 'all' || availLayers.has(map2dLayer)) ? map2dLayer : 'all';
    const regions = (MAP_LAYOUT.regions || []).filter(r =>
      (!sliceRegions.size || sliceRegions.has(r.id) || !sliceFiltered) &&
      (layerFilter === 'all' || !r.layer || r.layer === layerFilter));
    const visibleNodes = nodes.filter(n => layerFilter === 'all' || n.layer === layerFilter);
    const visibleIds = new Set(visibleNodes.map(n => n.id));
    const edges = SPATIAL
      .filter(r => visibleIds.has(r.s) && visibleIds.has(r.t))
      .map(r => ({ s: r.s, t: r.t, kind: r.kind, ref: r }));
    const routes = (MAP_LAYOUT.routes || []).filter(r => {
      if (!sliceRoutes.size) return true;
      return sliceRoutes.has(r.id) || (!r.id && visibleIds.has(r.s) && visibleIds.has(r.t));
    });
    return {
      nodes: visibleNodes, edges, regions, unknown: [], sat: null, map2d: true, fallback: null,
      terrain: MAP_LAYOUT.terrain || null, routes
    };
  }

  /* ---------- 拓扑：places.parent 层级树（次要视图，不做美化） ---------- */
  function buildM1Model(ids, aux) {
    const nodes = [...ids].map(id => {
      const p = placeById.get(id);
      return {
        id, ref: p, name: p.name, kids: (placeChildren.get(id) || []).length,
        ch: p.first_ch || 9999, x: 0, y: 0, r: 7, rootId: mapRootOf(id)
      };
    });
    const byIdM = new Map(nodes.map(n => [n.id, n]));
    const edges = [];
    nodes.forEach(n => {
      (placeChildren.get(n.id) || []).forEach(c => {
        if (byIdM.has(c.id)) edges.push({ s: n.id, t: c.id, kind: 'parent', ref: null });
      });
    });
    aux.forEach(r => {
      if (byIdM.has(r.s) && byIdM.has(r.t)) edges.push({ s: r.s, t: r.t, kind: r.kind, ref: r });
    });

    // 确定性树形布局：叶子按 DFS 顺序排槽位，父节点取孩子中点；坐标只用于避让
    const roots = nodes.filter(n => {
      const p = placeById.get(n.id);
      return !p.parent || !byIdM.has(p.parent);
    });
    let slot = 0;
    const levelH = 76, slotW = 66;
    const assign = (pid, depth) => {
      const n = byIdM.get(pid);
      const kids = (placeChildren.get(pid) || []).filter(c => byIdM.has(c.id));
      if (!kids.length) { n.x = slot * slotW; n.y = depth * levelH; slot++; return; }
      kids.forEach(c => assign(c.id, depth + 1));
      const xs = kids.map(c => byIdM.get(c.id).x);
      n.x = (Math.min(...xs) + Math.max(...xs)) / 2;
      n.y = depth * levelH;
    };
    roots.forEach(r => assign(r.id, 0));
    nodes.forEach(n => { n.r = 6.5 + Math.min(n.kids, 8) * 1.1; });
    return { nodes, edges, unknown: [], sat: null, fallback: null };
  }

  /* ---------- M2：证据化示意地图 ---------- */
  function buildM2Model(ids) {
    const { m2 } = mapRelsFor(ids);
    const nodeIds = new Set(ids);
    m2.forEach(r => { nodeIds.add(r.s); nodeIds.add(r.t); });

    const dirRels = m2.filter(r => r.kind === 'direction');
    const distRels = m2.filter(r => r.kind === 'distance');
    const evidenceN = dirRels.length + distRels.length;
    // 层内方向/距离约束不足 3 条：不画任何坐标，回退 M1
    if (evidenceN < 3) {
      return {
        nodes: [], edges: [], unknown: [], sat: null,
        fallback: { reason: `该层方位证据不足（${evidenceN} 条方向/距离约束），已回退到 M1 拓扑图` }
      };
    }

    const nodes = [...nodeIds].map(id => {
      const p = placeById.get(id);
      return {
        id, ref: p, name: p.name, kids: (placeChildren.get(id) || []).length,
        x: 50, y: 50, r: 7, unknown: false, inLayer: ids.has(id), rootId: mapRootOf(id)
      };
    });
    const byIdM = new Map(nodes.map(n => [n.id, n]));
    const hasDir = new Set(), hasDist = new Set();
    m2.forEach(r => {
      if (r.kind === 'direction') { hasDir.add(r.s); hasDir.add(r.t); }
      if (r.kind === 'distance') { hasDist.add(r.s); hasDist.add(r.t); }
    });
    // 没有任何 direction / distance 证据的节点一律进方位未知区，绝不落进四象限
    nodes.forEach(n => { n.unknown = !hasDir.has(n.id) && !hasDist.has(n.id); });

    // 确定性初值：黄金角圆周，无随机种子
    const GOLD = Math.PI * (3 - Math.sqrt(5));
    nodes.forEach((n, i) => {
      const a = i * GOLD;
      n.x = 50 + Math.cos(a) * 26;
      n.y = 50 + Math.sin(a) * 26;
    });
    const active = nodes.filter(n => !n.unknown);

    // 轻量约束松弛：固定轮次迭代，结果确定、无漂移
    for (let round = 0; round < 140; round++) {
      m2.forEach(r => {
        if (r.kind !== 'direction') return;
        const a = byIdM.get(r.s), b = byIdM.get(r.t);
        if (!a || !b || a.unknown || b.unknown) return;
        const v = DIR_VEC[r.value];
        if (!v) return;
        a.x += v[0] * 1.6; a.y += v[1] * 1.6;
        b.x -= v[0] * 1.6; b.y -= v[1] * 1.6;
      });
      m2.forEach(r => {
        if (r.kind !== 'contain') return;
        const parent = byIdM.get(r.s), child = byIdM.get(r.t);
        if (!parent || !child || child.unknown) return;
        // contain 只把子节点拉进父节点区域，不锁象限
        child.x += (parent.x - child.x) * 0.12;
        child.y += (parent.y - child.y) * 0.12;
      });
      m2.forEach(r => {
        if (r.kind !== 'adjacent') return;
        const a = byIdM.get(r.s), b = byIdM.get(r.t);
        if (!a || !b || a.unknown || b.unknown) return;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        if (d > 22) { a.x += dx / d * 0.5; a.y += dy / d * 0.5; b.x -= dx / d * 0.5; b.y -= dy / d * 0.5; }
      });
      m2.forEach(r => {
        if (r.kind !== 'distance') return;
        const a = byIdM.get(r.s), b = byIdM.get(r.t);
        if (!a || !b || a.unknown || b.unknown) return;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        // distance 只作弱分离力，不把「百余里」折算成像素比例
        if (d < 14) { const push = (14 - d) / d * 0.4; a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push; }
      });
      for (let i = 0; i < active.length; i++) for (let j = i + 1; j < active.length; j++) {
        const a = active[i], b = active[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        if (d < 10) { const push = (10 - d) / d * 0.3; a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push; }
      }
      active.forEach(n => { n.x = Math.max(6, Math.min(94, n.x)); n.y = Math.max(6, Math.min(94, n.y)); });
    }

    const edges = m2
      .filter(r => byIdM.has(r.s) && byIdM.has(r.t))
      .map(r => ({ s: r.s, t: r.t, kind: r.kind, ref: r }));

    // 约束满足率（按布局后的实际方位核对）
    let dirOk = 0;
    dirRels.forEach(r => {
      const a = byIdM.get(r.s), b = byIdM.get(r.t);
      if (!a || !b || a.unknown || b.unknown) return;
      const v = DIR_VEC[r.value]; if (!v) return;
      let ok = true;
      if (v[0] < 0 && a.x >= b.x) ok = false;
      if (v[0] > 0 && a.x <= b.x) ok = false;
      if (v[1] < 0 && a.y >= b.y) ok = false;
      if (v[1] > 0 && a.y <= b.y) ok = false;
      if (ok) dirOk++;
    });
    let distOk = 0;
    distRels.forEach(r => {
      const a = byIdM.get(r.s), b = byIdM.get(r.t);
      if (!a || !b || a.unknown || b.unknown) return;
      if (Math.hypot(a.x - b.x, a.y - b.y) >= 10) distOk++;
    });
    const containRels = m2.filter(r => r.kind === 'contain');
    let contOk = 0;
    containRels.forEach(r => {
      const p = byIdM.get(r.s), c = byIdM.get(r.t);
      if (!p || !c || c.unknown) return;
      if (Math.hypot(p.x - c.x, p.y - c.y) <= 26) contOk++;
    });

    nodes.forEach(n => { n.r = 7 + Math.min(n.kids, 6) * 0.8; });
    return {
      nodes, edges,
      unknown: nodes.filter(n => n.unknown),
      sat: { direction: `${dirOk}/${dirRels.length}`, distance: `${distOk}/${distRels.length}`, region: `${contOk}/${containRels.length}` },
      fallback: null
    };
  }

  function computeMapModel() {
    if (mapMode === 'map2d') return buildMap2dModel();
    const ids = mapLayerNodeIds();
    if (mapMode === 'm2') return buildM2Model(ids);
    const { aux } = mapRelsFor(ids);
    return buildM1Model(ids, aux);
  }

  /* ---------- 画布绘制 ---------- */
  function mapCanvas2d() {
    const canvas = document.getElementById('mapCanvas');
    return canvas ? { canvas, ctx: canvas.getContext('2d') } : null;
  }
  function mapFit() {
    const stage = document.getElementById('mapStage');
    if (!stage || !mapModel || (!mapModel.nodes.length && !(mapModel.regions && mapModel.regions.length))) {
      mapView = { x: 0, y: 0, k: 1, kx: 1, ky: 1, fitKx: 1, fitKy: 1 };
      return;
    }
    const rect = stage.getBoundingClientRect();
    const pad = mapModel.map2d ? 26 : 42;
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    if (mapModel.regions) {
      mapModel.regions.forEach(reg => (reg.polygon || []).forEach(pt => {
        minX = Math.min(minX, pt[0]); maxX = Math.max(maxX, pt[0]);
        minY = Math.min(minY, pt[1]); maxY = Math.max(maxY, pt[1]);
      }));
    }
    mapModel.nodes.forEach(n => {
      if (n.unknown) return;
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
    });
    const w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
    if (mapModel.map2d) {
      // 2D 示意：map_layout 的 0–100 直接映射到底图矩形，全出血、不留内边距（内边距只作用于 UI 控件）
      mapView.kx = rect.width / 100;
      mapView.ky = rect.height / 100;
      mapView.k = Math.min(mapView.kx, mapView.ky);
      mapView.x = 0; mapView.y = 0;
      mapView.fitKx = mapView.kx; mapView.fitKy = mapView.ky;
    } else {
      const maxK = 1.6;
      mapView.k = Math.max(0.3, Math.min((rect.width - pad * 2) / w, (rect.height - pad * 2) / h, maxK));
      mapView.kx = mapView.ky = mapView.k;
      mapView.x = rect.width / 2 - (minX + maxX) / 2 * mapView.k;
      mapView.y = rect.height / 2 - (minY + maxY) / 2 * mapView.k;
      mapView.fitKx = mapView.kx; mapView.fitKy = mapView.ky;
    }
  }
  function mapZoomScale() {
    const fit = mapView.fitKx || mapView.kx || 1;
    const now = mapView.kx || mapView.k || 1;
    return Math.max(0.2, Math.min(8, now / fit));
  }
  function syncMapZoomLabel() {
    const el = document.getElementById('mapZoomValue');
    if (!el) return;
    const pct = Math.round(mapZoomScale() * 100);
    el.textContent = pct + '%';
    el.title = `当前缩放 ${pct}% · 点击恢复到 100%`;
  }
  function mapLabelScale() {
    const z = mapZoomScale();
    return z >= 1 ? Math.min(1.8, Math.pow(z, 0.6)) : 1;
  }
  function mToScreen(n) {
    const kx = mapView.kx || mapView.k, ky = mapView.ky || mapView.k;
    return { x: n.x * kx + mapView.x, y: n.y * ky + mapView.y };
  }
  /** 地图缩放的唯一入口：倍数作用于「适配比例」，不作用于像素。
      两个坑：
      1. 用绝对像素上限（如 6）会让宽屏上的 fitKx（= width/100）一开局就超过上限，
         滚轮往上反而变小 —— 1900px 宽时最大只能到 6/19 ≈ 32%。
      2. kx/ky 必须乘同一倍数。分别夹取会让一方先触顶，地图宽高比失衡被拉伸。
      (ax, ay) 是缩放锚点（画布坐标），鼠标滚轮传鼠标位置，按钮传画布中心。 */
  function zoomMapBy(f, ax, ay) {
    const kx0 = mapView.kx || mapView.k, ky0 = mapView.ky || mapView.k;
    const fx = mapView.fitKx || kx0, fy = mapView.fitKy || ky0;
    const wx = (ax - mapView.x) / kx0;
    const wy = (ay - mapView.y) / ky0;
    const z = Math.max(0.35, Math.min(6, (kx0 / fx) * f));
    mapView.kx = fx * z;
    mapView.ky = fy * z;
    mapView.k = Math.min(mapView.kx, mapView.ky);
    mapView.x = ax - wx * mapView.kx;
    mapView.y = ay - wy * mapView.ky;
  }

  function zoomBy(f) {
    const stage = document.getElementById('mapStage');
    if (!stage) return;
    const rect = stage.getBoundingClientRect();
    zoomMapBy(f, rect.width / 2, rect.height / 2);
    drawMap();
  }

  function mapEdgeStyle(edge) {
    if (mapMode === 'topo') {
      if (edge.kind === 'parent') return { color: '#C9C2B2', width: 1.3, dash: [], alpha: 0.85 };
      return { color: '#9A9488', width: 1.1, dash: [5, 4], alpha: 0.75 };
    }
    if (mapMode === 'map2d') {

      return dashed

  const CONF_STYLE_MAP = {

  function drawMap() {
    syncMapZoomLabel();
    const pack = mapCanvas2d();
    if (!pack || !mapModel) return;
    const { canvas, ctx } = pack;
    const stage = document.getElementById('mapStage');
    const rect = stage.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
    if (mapModel.fallback) return;
    if (mapModel.map2d) { drawMap2d(ctx, rect); return; }
    if (!mapModel.nodes.length) return;

    // 边
    mapModel.edges.forEach(edge => {
      const a = mapModel.nodes.find(n => n.id === edge.s);
      const b = mapModel.nodes.find(n => n.id === edge.t);
      if (!a || !b) return;
      const sa = mToScreen(a), sb = mToScreen(b);

      ctx.beginPath();

      ctx.stroke();

    ctx.globalAlpha = 1;

    // 节点（M2 方位未知节点只进托盘，不画进四象限画布）
    mapModel.nodes.forEach(n => {
      if (n.unknown) return;
      const s = mToScreen(n);
      const color = mapMode === 'm2' && !n.inLayer ? '#9A9488' : mapColorOf(n.rootId);
      ctx.beginPath();
      ctx.arc(s.x, s.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      const hover = n === mapHoverNode;
      const showLabel = hover || (mapMode === 'topo'
        ? (n.kids >= 1 || n.id === resolvedMapLayer())
        : (n.inLayer && (n.kids >= 1 || n.id === resolvedMapLayer())));
      if (showLabel) {
        ctx.font = `${hover ? '600 ' : ''}10.5px -apple-system, "PingFang SC", sans-serif`;
        ctx.fillStyle = '#2B2A26';
        ctx.textAlign = 'center';
        ctx.fillText(n.name, s.x, s.y + n.r + 13 / Math.max(mapView.k, 0.6));
      }
    });

    // 悬停提示
    if (mapHoverEdge) {
      const r = mapHoverEdge.ref;
      const ch = (r.evidence && r.evidence.ch) || r.first_ch || '—';
      const text = `${SPATIAL_KIND_CN[r.kind] || r.kind} · ${r.value || ''} · 第 ${ch} 章`;
      drawMapTooltip(ctx, text);
    } else if (mapHoverNode) {
      const n = mapHoverNode;
      const extra = mapMode === 'm2'
        ? (n.unknown ? '方位未知（无方向/距离证据）' : '示意坐标（非真实经纬度）')
        : '层级/拓扑位置，仅用于避让';
      drawMapTooltip(ctx, `${n.name} · ${extra}`);
    }
  }



/* Novel Atlas viewer · 地图纸面、地形与 stamp

  /* ---------- 示意 2D 绘制 ---------- */
  function worldToScreenPt(pt) {
    const kx = mapView.kx || mapView.k, ky = mapView.ky || mapView.k;

  }
  // 位图资产：构建时资源占位被替换为 data URI；运行时缓存 Image。
  const mapAssetCache = {};

    }

  }
  // cover 铺满：保持比例，允许上下/左右微裁，不变形
  function drawCover(ctx, img, rect) {

    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(rect.width / iw, rect.height / ih);
    const w = iw * scale, h = ih * scale;
    ctx.drawImage(img, (rect.width - w) / 2, (rect.height - h) / 2, w, h);
    return true;
  }
  // 把图片 cover 到指定 box（保留 x/y），用于海域纹理，不能复用顶部 0,0 的 drawCover
  function drawBoxCover(ctx, img, box) {
    if (!img.complete || !img.naturalWidth) return false;

    const scale = Math.max(box.w / iw, box.h / ih);
    const w = iw * scale, h = ih * scale;
    ctx.drawImage(img, box.x + (box.w - w) / 2, box.y + (box.h - h) / 2, w, h);
    return true;
  }

  function drawContain(ctx, img, x, y, w, h) {
    if (!img.complete || !img.naturalWidth) return false;

    const scale = Math.min(w / iw, h / ih);
    const dw = iw * scale, dh = ih * scale;

    return true;
  }

    ctx.lineTo(tip.x + Math.cos(a2) * s, tip.y + Math.sin(a2) * s);

  function atlasRgba(hex, alpha) {
    const s = String(hex || '#000').replace('#', '');

      const y = Array.isArray(p) ? p[1] : p.y;

      const y = Array.isArray(p) ? p[1] : p.y;

      y0 = Math.min(y0, y); y1 = Math.max(y1, y);

      const xj = poly[j][0], yj = poly[j][1];

    }

    const out = [];
    const cr = (p0, p1, p2, p3, t) => {
      const t2 = t * t, t3 = t2 * t;
      return {
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      };
    };
    for (let i = 0; i < P.length - 3; i++) {
      for (let j = 0; j < steps; j++) out.push(cr(P[i], P[i + 1], P[i + 2], P[i + 3], j / steps));

  function drawAtlasPaper(ctx, rect) {

  function drawAtlasLand(ctx, reg, rect) {

  function drawAtlasWaterPoly(ctx, pts, rect, opt) {
    if (!pts || pts.length < 3) return;

    ctx.shadowColor = atlasRgba('#5B7A80', 0.34);

    ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = 'rgba(201,185,143,0.80)';
    ctx.lineWidth = 1.3;
    ctx.setLineDash([7, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(59,51,42,0.20)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function drawAtlasRidgeFallback(ctx, ridge) {
    const pts = smoothWorldPoints(ridge.points).map(p => atlasWorldScreen(p));
    if (pts.length < 2) return;
    const z = mapZoomScale();
    ctx.save();
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.22);
    ctx.lineWidth = 7 * z;
    ctx.lineJoin = 'round';
    drawPolyline(ctx, pts);
    ctx.stroke();
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.55);
    ctx.lineWidth = Math.max(1.2, (ridge.width || 1.8) * 0.9) * z;
    drawPolyline(ctx, pts);
    ctx.stroke();
    ctx.restore();
  }
  function smoothWorldPoints(points) {
    const raw = (points || []).map(p => ({ x: p[0], y: p[1] }));
    return atlasSmoothPoints(raw, 10);
  }
  function drawAtlasStamp(ctx, spec, rect, nodesById) {
    const asset = ATLAS_STAMP_BY_ID[spec.asset];
    if (!asset) return false;
    const img = mapAsset(asset.src);
    let cx = atlasNum(spec.x, 50), cy = atlasNum(spec.y, 50);
    let node = null;
    if (spec.attach) {
      if (!nodesById || !nodesById.has(spec.attach)) return false;
      node = nodesById.get(spec.attach);
      if (node.layer && map2dLayer !== 'all' && node.layer !== map2dLayer) return false;
      cx = node.x;
      cy = node.y + atlasNum(spec.offsetY, 0);
    } else if (spec.layer && map2dLayer !== 'all' && spec.layer !== map2dLayer) {
      return false;
    }
    const defaults = { terrain: 14, water: 10, architecture: 8, vegetation: 6 };
    const wWorld = atlasNum(spec.w, defaults[asset.type] || 8);
    const p = atlasWorldScreen([cx, cy]);
    const x = p.x;
    const y = p.y;
    if (!img.complete || !img.naturalWidth) {
      img.onload = () => { if (curView === 'map') drawMap(); };
      return false;
    }
    const w = wWorld / 100 * rect.width * mapZoomScale();
    const h = w * img.naturalHeight / img.naturalWidth;
    const pivot = spec.anchor === 'center' ? [0.5, 0.5] : (asset.pivot || [0.5, 0.875]);
    ctx.save();
    ctx.translate(x, y);
    if (spec.rotation) ctx.rotate(spec.rotation * Math.PI / 180);
    if (spec.flip) ctx.scale(-1, 1);
    ctx.globalAlpha = atlasNum(spec.opacity, 0.86);
    ctx.drawImage(img, -w * pivot[0], -h * pivot[1], w, h);
    ctx.restore();
    if (node && asset.type === 'architecture') {
      node._markerDy = Math.max(node._markerDy || 0, atlasNum(spec.markerOffset, 2.0));
    }
    return true;
  }
  function drawAtlasStamps(ctx, rect) {
    const list = Array.isArray(ATLAS.stamps) ? ATLAS.stamps.slice() : [];
    const nodesById = new Map((mapModel.nodes || []).map(n => [n.id, n]));
    list.sort((a, b) => atlasNum(a.order, 0) - atlasNum(b.order, 0));
    let drawn = 0;
    list.forEach(s => { if (drawAtlasStamp(ctx, s, rect, nodesById)) drawn++; });
    return drawn;
  }

  function drawAtlasTerrain(ctx, rect) {
    const terrain = mapModel.terrain || {};
    const nodesById = new Map((mapModel.nodes || []).map(n => [n.id, n]));
    const visibleRegions = new Set((mapModel.regions || []).map(r => r.id));
    const featureVisible = f => !f.region || visibleRegions.has(f.region);

    // 山脊：默认直接使用手绘 PNG ridge；无图时退回代码墨线
    (terrain.ridges || []).filter(featureVisible).forEach((ridge, i) => {
      const pts = ridge.points || [];
      if (ATLAS.terrainStamps !== false && pts.length >= 2) {
        const b = atlasBBox(pts);
        const ridgeId = (i % 2 && ATLAS_STAMP_BY_ID.terrain_ridge_02) ? 'terrain_ridge_02' : 'terrain_ridge_01';
        const w = Math.max(8, Math.min(24, b.w * 1.35 + 5));
        drawAtlasStamp(ctx, {
          asset: ridgeId, x: b.x + b.w / 2, y: Math.min(96, b.y + b.h + 1.5),
          w, opacity: 0.62
        }, rect, nodesById);
      } else {
        drawAtlasRidgeFallback(ctx, ridge);
      }
    });

    // 河流：双线水脉，不用固定 PNG
    (terrain.rivers || []).filter(featureVisible).forEach(r => {
      const pts = smoothWorldPoints(r.points).map(p => atlasWorldScreen(p));
      if (pts.length < 2) return;
      const z = mapZoomScale();
      const w = Math.max(1.2, (r.width || 1) * rect.width / 100 * 0.55) * z;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.water, 0.22);
      ctx.lineWidth = w * 3.2;
      drawPolyline(ctx, pts); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.water, 0.62);
      ctx.lineWidth = w;
      drawPolyline(ctx, pts); ctx.stroke();
      ctx.strokeStyle = 'rgba(245,247,242,0.45)';
      ctx.lineWidth = Math.max(0.7, w * 0.35);
      drawPolyline(ctx, pts); ctx.stroke();
      ctx.restore();
    });

    (terrain.lakes || []).filter(featureVisible).forEach(lake => {
      drawAtlasWaterPoly(ctx, atlasChaikin(lake.polygon, 2), rect, {
        top: 0.18, mid: 0.34, bottom: 0.38, coast: 0.32, texture: false
      });
    });

    (terrain.islets || []).filter(() => map2dLayer === 'all' || !mapModel.regions.length || (mapModel.regions || []).some(r => r.shape === 'sea')).forEach(islet => {
      const p = atlasWorldScreen([islet.x, islet.y]);
      const x = p.x, y = p.y;
      const r = Math.max(2.5, (islet.r || 1.2) / 100 * rect.width) * mapZoomScale();
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.35, r * 0.78, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,220,197,0.86)';
      ctx.shadowColor = 'rgba(90,70,40,0.22)';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.32);
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.45, y - r * 0.12);
      ctx.lineTo(x, y - r * 0.62);
      ctx.lineTo(x + r * 0.38, y - r * 0.08);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.26);
      ctx.stroke();
      ctx.restore();
    });
  }



/* Novel Atlas viewer · 地图路线、标记、文字与装饰
   职责：路线 / 图标 / 地名 / 题签 / 印章 / 免责声明 */
  function drawAtlasRoutes(ctx, rect) {
    const nodesById = new Map((mapModel.nodes || []).map(n => [n.id, n]));
    const seaPolys = (mapModel.regions || []).filter(r => r.shape === 'sea' && r.polygon).map(r => r.polygon);
    const labels = [];
    (mapModel.routes || []).forEach(route => {
      const a = nodesById.get(route.s), b = nodesById.get(route.t);
      if (!a || !b) return;
      const world = [{ x: a.x, y: a.y }]
        .concat((route.curve || []).map(p => ({ x: p[0], y: p[1] })))
        .concat([{ x: b.x, y: b.y }]);
      const pts = atlasSmoothPoints(world, 14).map(p => atlasWorldScreen([p.x, p.y]));
      if (pts.length < 2) return;
      const sea = route.tone === 'sea' || seaPolys.some(poly =>
        atlasPointInPoly({ x: a.x, y: a.y }, poly) ||
        atlasPointInPoly({ x: b.x, y: b.y }, poly));
      const isRiver = route.kind === 'river';
      const solid = route.kind === 'road' || isRiver;
      const color = isRiver ? ATLAS_THEME.water : (sea ? '#6F8B93' : ATLAS_THEME.route);
      const alpha = sea ? 0.82 : 0.88;
      const z = mapZoomScale();
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = atlasRgba(color, alpha);
      ctx.lineWidth = (isRiver ? 1.5 : (sea ? 2.1 : 1.9)) * z;
      ctx.setLineDash(solid ? [] : [7 * z, 5 * z]);
      drawPolyline(ctx, pts);
      ctx.stroke();
      ctx.setLineDash([]);
      // 端点：小墨点，避免“无头线段”
      if (!isRiver) {
        [pts[0], pts[pts.length - 1]].forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.4 * z, 0, Math.PI * 2);
          ctx.fillStyle = atlasRgba(color, 0.58); ctx.fill();
          ctx.strokeStyle = atlasRgba(ATLAS_THEME.paper, 0.7); ctx.lineWidth = 0.8 * z; ctx.stroke();
        });
      }
      if (!solid) {
        const tip = pts[pts.length - 1], from = pts[Math.max(0, pts.length - 8)];
        atlasArrow(ctx, tip, from, atlasRgba(color, 0.92), z);
      }
      ctx.restore();
      if (route.label) {
        const idx = Math.max(0, Math.floor(pts.length * 0.56));
        const p = pts[idx];
        const labelFont = 11 * mapLabelScale();
        ctx.save();
        ctx.font = `${labelFont}px -apple-system,"PingFang SC",sans-serif`;
        const tw = ctx.measureText(route.label).width;
        ctx.restore();
        labels.push({
          kind: 'route', text: route.label, x: p.x, y: p.y - labelFont * 0.8,
          w: tw + 8, h: labelFont * 1.45, priority: 3, color: sea ? '#627E86' : '#7A3B2E', font: labelFont
        });
      }
    });
    return labels;
  }

  function drawAtlasMarker(ctx, type, cx, cy, size, highlighted) {
    if (type === 'none') return;
    const u = size / 100;
    if (!u) return;
    const px = v => v / u;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(u, u);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (highlighted) {
      ctx.beginPath(); ctx.arc(50, 50, 48, 0, Math.PI * 2);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.seal, 0.75); ctx.lineWidth = px(2.2); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(50, 50, 44, 0, Math.PI * 2);
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.34); ctx.lineWidth = px(0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(50, 50, 40, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,220,197,0.20)'; ctx.fill();

    if (type === 'city') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.86); ctx.lineWidth = px(1.1);
      ctx.beginPath();
      ctx.moveTo(27, 64); ctx.lineTo(27, 50); ctx.lineTo(32, 50); ctx.lineTo(32, 46);
      ctx.lineTo(38, 46); ctx.lineTo(38, 50); ctx.lineTo(44, 50); ctx.lineTo(44, 46);
      ctx.lineTo(50, 46); ctx.lineTo(50, 50); ctx.lineTo(56, 50); ctx.lineTo(56, 46);
      ctx.lineTo(62, 46); ctx.lineTo(62, 50); ctx.lineTo(68, 50); ctx.lineTo(68, 64);
      ctx.closePath(); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.50); ctx.lineWidth = px(0.8);
      ctx.beginPath(); ctx.moveTo(27, 57); ctx.lineTo(68, 57); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(46, 64); ctx.lineTo(46, 58); ctx.lineTo(48, 55.5);
      ctx.lineTo(50, 54.5); ctx.lineTo(52.5, 55.5); ctx.lineTo(54, 58); ctx.lineTo(54, 64);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.84); ctx.lineWidth = px(1); ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 60, 2.2, Math.PI, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.accent, 0.55); ctx.fill();
    } else if (type === 'sect') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.84); ctx.lineWidth = px(1.2);
      ctx.beginPath();
      ctx.moveTo(29, 49); ctx.quadraticCurveTo(50, 36, 71, 49); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.68); ctx.lineWidth = px(1);
      ctx.beginPath(); ctx.moveTo(27, 51); ctx.quadraticCurveTo(50, 40, 73, 51); ctx.stroke();
      ctx.lineWidth = px(1.1);
      ctx.beginPath();
      ctx.moveTo(40, 51); ctx.lineTo(40, 67); ctx.moveTo(60, 51); ctx.lineTo(60, 67);
      ctx.moveTo(36, 67); ctx.lineTo(64, 67); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.accent, 0.68);
      ctx.beginPath();
      ctx.moveTo(46, 67); ctx.lineTo(46, 59); ctx.lineTo(48, 56);
      ctx.lineTo(50, 55); ctx.lineTo(52, 56); ctx.lineTo(54, 59); ctx.lineTo(54, 67);
      ctx.stroke();
    } else if (type === 'secret') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.72); ctx.lineWidth = px(1.25);
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 5; a += 0.22) {
        const r = 4.5 + a * 1.45;
        const x = 50 + Math.cos(a) * r, y = 50 + Math.sin(a) * r;
        if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 50, 2.1, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.seal, 0.78); ctx.fill();
      ctx.beginPath(); ctx.arc(66, 34, 1.7, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.accent, 0.55); ctx.fill();
    } else if (type === 'danger') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.seal, 0.86); ctx.lineWidth = px(1.3);
      ctx.beginPath(); ctx.moveTo(50, 26); ctx.lineTo(74, 68); ctx.lineTo(26, 68); ctx.closePath(); ctx.stroke();
      ctx.lineWidth = px(1.2);
      ctx.beginPath(); ctx.moveTo(50, 43); ctx.lineTo(50, 56); ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 61, 1.8, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.seal, 0.86); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(50, 50, 11, 0, Math.PI * 2);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.52); ctx.lineWidth = px(1); ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 50, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.ink, 0.62); ctx.fill();
    }
    ctx.restore();
  }

  function drawAtlasRegionLabel(ctx, box, text, fontPx) {
    ctx.save();
    ctx.font = `600 ${fontPx}px "Songti SC","SimSun",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, fontPx * 0.12);
    ctx.strokeStyle = 'rgba(243,236,221,0.88)';
    ctx.strokeText(text, box.x + box.w / 2, box.y + box.h / 2);
    ctx.fillStyle = ATLAS_THEME.ink;
    ctx.fillText(text, box.x + box.w / 2, box.y + box.h / 2);
    ctx.restore();
  }
  function drawAtlasNodeLabel(ctx, cand) {
    ctx.save();
    ctx.font = `${cand.rank === 1 ? '600 ' : ''}${cand.font}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3.2, cand.font * 0.22);
    ctx.strokeStyle = 'rgba(243,236,221,0.94)';
    ctx.strokeText(cand.text, cand.x, cand.y);
    ctx.fillStyle = cand.color || '#2B2A26';
    ctx.fillText(cand.text, cand.x, cand.y);
    ctx.restore();
  }

  function drawAtlasCompass(ctx, cx, cy, size, opacity) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(size / 100, size / 100);
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = ATLAS_THEME.ink;
    ctx.fillStyle = ATLAS_THEME.ink;
    [[46, 0.36, 1.8], [40, 0.46, 1.2], [31, 0.34, 1]].forEach(([r, a, w]) => {
      ctx.beginPath(); ctx.arc(50, 50, r, 0, Math.PI * 2);
      ctx.globalAlpha = opacity * a; ctx.lineWidth = w; ctx.stroke();
    });
    ctx.globalAlpha = opacity;
    for (let i = 0; i < 24; i++) {
      const a = i * Math.PI / 12;
      const r1 = 18.5, r2 = 11;
      ctx.beginPath();
      ctx.moveTo(50 + Math.cos(a) * r1, 50 + Math.sin(a) * r1);
      ctx.lineTo(50 + Math.cos(a) * r2, 50 + Math.sin(a) * r2);
      ctx.globalAlpha = opacity * (i % 6 === 0 ? 0.55 : 0.32);
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }
    ctx.globalAlpha = opacity;
    ctx.beginPath();
    ctx.moveTo(50, 50); ctx.lineTo(46.3, 26); ctx.lineTo(50, 18); ctx.lineTo(53.7, 26); ctx.closePath();
    ctx.fillStyle = atlasRgba(ATLAS_THEME.seal, 0.62); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(50, 50); ctx.lineTo(46.3, 74); ctx.lineTo(50, 82); ctx.lineTo(53.7, 74); ctx.closePath();
    ctx.fillStyle = atlasRgba(ATLAS_THEME.ink, 0.48); ctx.fill();
    ctx.beginPath(); ctx.arc(50, 50, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = atlasRgba(ATLAS_THEME.ink, 0.75); ctx.fill();
    ctx.restore();
  }

  function atlasTitleSpec() {
    const def = atlasDefaultTitle();
    const base = Object.assign({ x: 4.2, y: 8.8, size: 3.1, direction: 'vertical' }, ATLAS.title || {});
    const byLayer = (map2dLayer !== 'all' && ATLAS.titleByLayer) ? ATLAS.titleByLayer[map2dLayer] : null;
    const spec = Object.assign({}, base, byLayer || {});
    if (!spec.text) spec.text = def.text;
    return spec;
  }

  function atlasTitleBox(ctx, rect) {
    const spec = atlasTitleSpec();
    const fs = Math.max(11, Math.min((atlasNum(spec.size, 3.1) / 100) * rect.width, rect.height * 0.053));
    const text = spec.text || '山河舆图';
    const chars = Array.from(text);
    const vertical = spec.direction !== 'horizontal';
    const lineH = fs * 1.04;
    let w = fs * 1.65, h = chars.length * lineH + fs * 0.85;
    if (!vertical) {
      ctx.save();
      ctx.font = `600 ${fs}px "Songti SC","SimSun",serif`;
      w = ctx.measureText(text).width + fs * 1.7;
      h = fs * 1.65;
      ctx.restore();
    }
    let x = (atlasNum(spec.x, 4.2) / 100) * rect.width;
    let y = (atlasNum(spec.y, 8.8) / 100) * rect.height;
    // 左上角云纹的安全区：题签不压在纸底装饰上
    const cornerW = rect.width * 0.105, cornerH = rect.height * 0.18;
    if (x < cornerW && y < cornerH) y = cornerH + 4;
    return { x, y, w, h };
  }

  function drawAtlasCartouche(ctx, rect, spec) {
    const fs = Math.max(11, Math.min((atlasNum(spec.size, 3.1) / 100) * rect.width, rect.height * 0.053));
    const text = spec.text || '山河舆图';
    const chars = Array.from(text);
    const vertical = spec.direction !== 'horizontal';
    const lineH = fs * 1.04;
    let w = fs * 1.65, h = chars.length * lineH + fs * 0.85;
    if (!vertical) {
      ctx.save();
      ctx.font = `600 ${fs}px "Songti SC","SimSun",serif`;
      w = ctx.measureText(text).width + fs * 1.7;
      h = fs * 1.65;
      ctx.restore();
    }
    const x = (atlasNum(spec.x, 4.2) / 100) * rect.width;
    const y = (atlasNum(spec.y, 9) / 100) * rect.height;
    ctx.save();
    ctx.fillStyle = 'rgba(244,237,223,0.72)';
    ctx.shadowColor = 'rgba(90,70,40,0.12)';
    ctx.shadowBlur = 12;
    ctx.fillRect(x, y, w, h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.60);
    ctx.lineWidth = 1.6;
    ctx.strokeRect(x + 0.8, y + 0.8, w - 1.6, h - 1.6);
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.34);
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9);
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.accent, 0.55);
    ctx.lineWidth = 1;
    const c = Math.min(9, fs * 0.38);
    [[x + 7, y + 7, 1, 1], [x + w - 7, y + 7, -1, 1],
     [x + 7, y + h - 7, 1, -1], [x + w - 7, y + h - 7, -1, -1]].forEach(([px, py, dx, dy]) => {
      ctx.beginPath(); ctx.moveTo(px + dx * c, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * c); ctx.stroke();
    });
    ctx.fillStyle = ATLAS_THEME.ink;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${fs}px "Songti SC","SimSun",serif`;
    if (vertical) {
      chars.forEach((ch, i) => ctx.fillText(ch, x + w / 2, y + fs * 0.55 + i * lineH + fs * 0.42));
    } else {
      ctx.fillText(text, x + w / 2, y + h / 2 + 1);
    }
    ctx.restore();
    return {
      frame: { x, y, w, h },
      seal: {
        x: (atlasNum(spec.sealX, (x + w / 2) / rect.width * 100)),
        y: (atlasNum(spec.sealY, (y + h + fs * 0.72) / rect.height * 100)),
        size: atlasNum(spec.sealSize, 2.55),
        ch: spec.sealCh || chars[0] || '山',
        angle: atlasNum(spec.sealAngle, -0.035)
      }
    };
  }

  function drawAtlasSeal(ctx, rect, spec) {
    const size = Math.max(16, (atlasNum(spec.size, 2.5) / 100) * rect.width);
    const cx = (atlasNum(spec.x, 6) / 100) * rect.width;
    const cy = (atlasNum(spec.y, 28) / 100) * rect.height;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(atlasNum(spec.angle, 0));
    ctx.fillStyle = ATLAS_THEME.seal;
    ctx.globalAlpha = 0.92;
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(245,235,215,0.68)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(-size / 2 + size * 0.12, -size / 2 + size * 0.12, size * 0.76, size * 0.76);
    ctx.fillStyle = '#F5EBD7';
    ctx.font = `${Math.max(10, Math.round(size * 0.52))}px "SimSun",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(Array.from(spec.ch || '山')[0], 0, 1);
    ctx.restore();
  }

  function drawAtlasDisclaimer(ctx, rect, spec) {
    const text = spec && spec.text ? spec.text : '示意舆图 · 方位与比例非精确';
    const y = (atlasNum(spec && spec.y, 95.5) / 100) * rect.height;
    const fs = Math.max(9, Math.min(12, rect.width / 120));
    ctx.save();
    ctx.font = `${fs}px -apple-system,"PingFang SC",sans-serif`;
    const textW = ctx.measureText(text).width;
    const left = rect.width * 0.5 - (textW + fs * 2.1) / 2;
    ctx.strokeStyle = 'rgba(166,106,69,0.50)';
    ctx.lineWidth = 1;
    ctx.strokeRect(left, y - fs * 0.9, fs * 1.45, fs * 1.6);
    ctx.strokeStyle = 'rgba(166,106,69,0.28)';
    ctx.strokeRect(left + 2.2, y - fs * 0.9 + 2.2, fs * 1.45 - 4.4, fs * 1.6 - 4.4);
    ctx.fillStyle = 'rgba(141,128,112,0.88)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, left + fs * 2.1, y);
    ctx.restore();
  }

  function atlasDefaultTitle() {
    const land = (mapModel.regions || []).find(r => r.shape === 'land' && r.name);
    const base = land ? land.name.replace(/(?:大陆|大洲|之洲)$/g, '') : '山河';
    return { text: `${base}舆图`, sealCh: Array.from(base)[0] || '山' };
  }

  function drawAtlasFixedUI(ctx, rect) {
    const titleSpec = atlasTitleSpec();
    const title = drawAtlasCartouche(ctx, rect, titleSpec);
    const sealSpec = Object.assign({}, title.seal, ATLAS.seal || {});
    if (map2dLayer !== 'all' && titleSpec.sealCh) sealSpec.ch = titleSpec.sealCh;
    drawAtlasSeal(ctx, rect, sealSpec);
    if (ATLAS.compass !== false) {
      const compass = Object.assign({ x: 91.5, y: 87.5, size: 7.2, opacity: 0.46 }, ATLAS.compass || {});
      drawAtlasCompass(ctx, (compass.x / 100) * rect.width, (compass.y / 100) * rect.height,
        (compass.size / 100) * rect.width, atlasNum(compass.opacity, 0.46));
    }
    drawAtlasDisclaimer(ctx, rect, ATLAS.disclaimer);
  }

  function drawMap2dLegend(ctx, rect, markerSize) {
    // 图例改由页脚文字承担；画布内不压地图，避免挡题签/罗盘
  }



/* Novel Atlas viewer · 地图场景合成
   职责：drawMap2d 的绘制顺序 / 标签避让 / 悬停提示 */
  function drawMap2d(ctx, rect) {
    const regions = mapModel.regions || [];
    const nodes = mapModel.nodes || [];
    const regionLayerIds = new Set(regions.map(r => r.layer).filter(Boolean));
    const nodesById = new Map(nodes.map(n => [n.id, n]));
    const zoomZ = mapView.fitKx ? (mapView.kx / mapView.fitKx) : 1;
    const markerSizes = {};
    const hideMarker = n => n.rank === 3 && zoomZ < 1.32;

    // 1) 纸底 + 内框
    drawAtlasPaper(ctx, rect);

    // 地图内容统一裁到纸面内框，避免缩放时压到边框
    const framePad = Math.max(10, rect.width * 0.018);
    ctx.save();
    ctx.beginPath();
    ctx.rect(framePad, framePad, rect.width - framePad * 2, rect.height - framePad * 2);
    ctx.clip();

    // 2) 区域：陆地只留极淡水色，海/秘境是可见主体
    regions.filter(r => r.shape === 'land').forEach(r => drawAtlasLand(ctx, r, rect));
    regions.filter(r => r.shape === 'void').forEach(r => drawAtlasVoid(ctx, r, rect));
    regions.filter(r => r.shape === 'sea').forEach(r => drawAtlasSea(ctx, r, rect));

    // 3) 地形：山脊 / 河流 / 湖泊 / 岛链
    drawAtlasTerrain(ctx, rect);

    // 4) 手绘 stamp：地形之外的建筑/植被/云水
    drawAtlasStamps(ctx, rect);

    // 5) 路线：数据点列 → Catmull-Rom 平滑，不用固定 PNG
    const routeLabels = drawAtlasRoutes(ctx, rect);

    // 6) 标签候选：区域 > rank1 > 航路 > rank2 > rank3
    const candidates = [];
    const safePad = framePad + 9;
    const onStage = (x, y, pad = 16) => x >= safePad - pad && x <= rect.width - safePad + pad && y >= safePad - pad && y <= rect.height - safePad + pad;
    const titleBox = atlasTitleBox(ctx, rect);
    const uiBoxes = [{ x: titleBox.x - 10, y: titleBox.y - 10, w: titleBox.w + 20, h: titleBox.h + 20 }];
    if (ATLAS.compass !== false) {
      const comp = Object.assign({ x: 91.5, y: 87.5, size: 7.2 }, ATLAS.compass || {});
      const cs = (comp.size / 100) * rect.width;
      const cx = (comp.x / 100) * rect.width, cy = (comp.y / 100) * rect.height;
      uiBoxes.push({ x: cx - cs / 2 - 6, y: cy - cs / 2 - 6, w: cs + 12, h: cs + 12 });
    }
    const ds = ATLAS.disclaimer || {};
    const dsFs = Math.max(9, Math.min(12, rect.width / 120));
    const dsX = (atlasNum(ds.x, 1.7) / 100) * rect.width, dsY = (atlasNum(ds.y, 95.5) / 100) * rect.height;
    const dsW = (ds.text || '示意舆图 · 方位与比例非精确').length * dsFs * 1.02 + dsFs * 3;
    uiBoxes.push({ x: dsX - 4, y: dsY - dsFs * 1.1, w: dsW + 8, h: dsFs * 2.2 });
    regions.forEach(r => {
      if (!r.name) return;
      const at = r.label_at || [50, 50];
      const text = r.label || r.name;
      const font = Math.max(17, Math.min(30, rect.width * 0.022)) * mapLabelScale();
      const p = atlasWorldScreen(at);
      if (!onStage(p.x, p.y, font * 0.8)) return;
      ctx.save();
      ctx.font = `600 ${font}px "Songti SC","SimSun",serif`;
      const tw = ctx.measureText(text).width;
      ctx.restore();
      candidates.push({
        kind: 'region', text, x: p.x, y: p.y,
        w: tw + 12, h: font * 1.3, priority: 0, font
      });
    });

    const visibleNodeCount = nodes.filter(n => !n.unknown).length;
    nodes.forEach(n => {
      if (n.label === false || regionLayerIds.has(n.id)) return;
      if (n.rank === 2 && visibleNodeCount > 26 && zoomZ < 1.12) return;
      if (n.rank === 3 && zoomZ < 1.55) return;
      const s = atlasNodeScreen(n);
      const type = atlasMarkerTypeOf(n);
      const size = type === 'none' ? 10 * mapZoomScale() : atlasMarkerSizeOnScreen(n.rank || 2, rect);
      markerSizes[n.id] = size;
      if (!onStage(s.x, s.y, size)) return;
      const font = (n.rank === 1 ? Math.max(12, Math.min(15, rect.width / 105)) : Math.max(11, Math.min(13, rect.width / 125))) * mapLabelScale();
      ctx.save();
      ctx.font = `${n.rank === 1 ? '600 ' : ''}${font}px -apple-system,"PingFang SC",sans-serif`;
      const tw = ctx.measureText(n.name).width;
      ctx.restore();
      let ly = s.y + size / 2 + font * 1.1;
      if (ly + font > rect.height - 12) ly = s.y - size / 2 - font * 0.9;
      if (ly < framePad + font * 0.9 || ly > rect.height - framePad - font * 0.9) return;
      candidates.push({
        kind: 'node', id: n.id, text: n.name, x: s.x, y: ly,
        w: tw + 10, h: font * 1.35, priority: n.rank === 1 ? 1 : (n.rank === 3 ? 4 : 2),
        font, rank: n.rank
      });
    });
    routeLabels.forEach(l => { if (onStage(l.x, l.y, 12)) candidates.push(l); });

    // 标记 icon 的保留框：文字不得压住别的标记；rank3 在远景不占位
    const reserved = nodes.filter(n => !hideMarker(n) && atlasMarkerTypeOf(n) !== 'none').map(n => {
      const s = atlasNodeScreen(n);
      const size = markerSizes[n.id] || atlasMarkerSizeOnScreen(n.rank || 2, rect);
      return { id: n.id, box: { x: s.x - size / 2 - 2, y: s.y - size / 2 - 2, w: size + 4, h: size + 4 } };
    });
    const boxHit = (a, b) => !(a.x + a.w < b.x || a.x > b.x + b.w || a.y + a.h < b.y || a.y > b.y + b.h);

    candidates.sort((a, b) => a.priority - b.priority || (a.y - b.y));
    const kept = [], dropped = [];
    candidates.forEach(c => {
      const box = { x: c.x - c.w / 2, y: c.y - c.h / 2, w: c.w, h: c.h };
      const hitLabel = kept.some(k => boxHit(box, k.box));
      const hitMarker = reserved.some(r => r.id !== c.id && boxHit(box, r.box));
      const hitUI = uiBoxes.some(u => boxHit(box, u));
      if (hitLabel || hitMarker || hitUI) { dropped.push(c); return; }
      kept.push(Object.assign({}, c, { box }));
    });

    // 7) 区域名
    kept.filter(c => c.kind === 'region').forEach(c => drawAtlasRegionLabel(ctx, c.box, c.text, c.font));

    // 8) 标记
    nodes.forEach(n => {
      if (n.unknown || hideMarker(n)) { n._markerR = 0; n._hidden = true; return; }
      const s = atlasNodeScreen(n);
      const type = atlasMarkerTypeOf(n);
      n._hidden = type === 'none';
      if (type === 'none') { n._markerR = 0; return; }
      const size = markerSizes[n.id] || atlasMarkerSizeOnScreen(n.rank || 2, rect);
      if (!onStage(s.x, s.y, size)) { n._markerR = 0; n._hidden = true; return; }
      drawAtlasMarker(ctx, type, s.x, s.y, size, n === mapHoverNode || n.id === mapEditSelected);
      n._markerR = Math.max(12, size);
    });

    // 9) 节点名 / 航路名
    kept.filter(c => c.kind === 'node').forEach(c => {
      c.color = c.rank === 1 ? '#2B2A26' : '#4A4234';
      drawAtlasNodeLabel(ctx, c);
    });
    kept.filter(c => c.kind === 'route').forEach(c => {
      ctx.save();
      ctx.font = `${c.font}px -apple-system,"PingFang SC",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, c.font * 0.18);
      ctx.strokeStyle = 'rgba(243,236,221,0.92)';
      ctx.strokeText(c.text, c.x, c.y);
      ctx.fillStyle = c.color;
      ctx.fillText(c.text, c.x, c.y);
      ctx.restore();
    });

    ctx.restore();

    // 10) 固定 UI：题签、印章、罗盘、免责小印
    drawAtlasFixedUI(ctx, rect);

    // 11) 统计与调试
    let overlapPairs = 0;
    for (let i = 0; i < kept.length; i++) for (let j = i + 1; j < kept.length; j++) {
      if (boxHit(kept[i].box, kept[j].box)) overlapPairs++;
    }
    let sx0 = 1e9, sy0 = 1e9, sx1 = -1e9, sy1 = -1e9;
    kept.forEach(b => {
      sx0 = Math.min(sx0, b.box.x); sy0 = Math.min(sy0, b.box.y);
      sx1 = Math.max(sx1, b.box.x + b.box.w); sy1 = Math.max(sy1, b.box.y + b.box.h);
    });
    const useW = rect.width > 0 && sx1 > -1e8 ? +((sx1 - sx0) / rect.width).toFixed(3) : 0;
    const useH = rect.height > 0 && sy1 > -1e8 ? +((sy1 - sy0) / rect.height).toFixed(3) : 0;
    const comp = Object.assign({ x: 91.5, y: 87.5, size: 7.2 }, ATLAS.compass || {});
    const compR = comp.size / 100 * rect.width / 2;
    let compassGap = 1e9;
    nodes.forEach(n => {
      const s = atlasNodeScreen(n);
      const size = markerSizes[n.id] || (atlasMarkerTypeOf(n) === 'none' ? 10 * mapZoomScale() : atlasMarkerSizeOnScreen(n.rank || 2, rect));
      const d = Math.hypot(s.x - comp.x / 100 * rect.width, s.y - comp.y / 100 * rect.height);
      compassGap = Math.min(compassGap, d - compR - size / 2);
    });
    mapModel._stats = {
      overlapPairs,
      textTotal: candidates.length,
      textKept: kept.length,
      textDropped: dropped.length,
      keptLabels: kept.length,
      droppedLabels: dropped.length,
      iconSizes: { marker: markerSizes[nodes[0] && nodes[0].id] || 24, rank1: atlasMarkerSizeOnScreen(1, rect), rank2: atlasMarkerSizeOnScreen(2, rect), rank3: atlasMarkerSizeOnScreen(3, rect) },
      inlineImages: 23,
      atlasRasterCount: 21,
      vectorComponents: 9,
      baseLayout: 'atlas-cover',
      regionVisible: kept.filter(b => b.kind === 'region').length,
      compassBadgeMinGapPx: Math.round(compassGap),
      nodeCount: nodes.length,
      zoomZ: +zoomZ.toFixed(2),
      fitKx: +(mapView.fitKx || 0).toFixed(2),
      kx: +(mapView.kx || 0).toFixed(2),
      screenUse: { w: useW, h: useH },
      canvas: { w: Math.round(rect.width), h: Math.round(rect.height) }
    };
    let statsEl = document.getElementById('mapStats');
    if (!statsEl) {
      statsEl = document.createElement('div');
      statsEl.id = 'mapStats'; statsEl.hidden = true;
      document.body.appendChild(statsEl);
    }
    statsEl.textContent = JSON.stringify(mapModel._stats);

    // 12) 悬停提示
    if (mapHoverEdge) {
      const r = mapHoverEdge.ref;
      const ch = (r.evidence && r.evidence.ch) || r.first_ch || '—';
      drawMapTooltip(ctx, `${SPATIAL_KIND_CN[r.kind] || r.kind} · ${r.value || ''} · 第 ${ch} 章`);
    } else if (mapHoverNode) {
      const n = mapHoverNode;
      const badge = n.evidence ? '有原文方位证据' : '近似摆放';
      drawMapTooltip(ctx, `${n.name} · ${badge}`);
    }
  }


/* Novel Atlas viewer · 地图交互与编排器
   职责：命中 / 图层 / 时间切片 / 编排面板 / 缩放拖拽 */

  function drawMapTooltip(ctx, text) {
    const stage = document.getElementById('mapStage');
    if (!stage) return;
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    const tw = ctx.measureText(text).width;
    const bw = tw + 20, bh = 24;
    let left = mapPointer.x + 13, top = mapPointer.y - 32;
    if (left + bw > stage.clientWidth - 6) left = mapPointer.x - bw - 13;
    if (top < 6) top = mapPointer.y + 14;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(left, top, bw, bh, 5);
    else ctx.rect(left, top, bw, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    ctx.fill();
    ctx.strokeStyle = '#E3DFD5';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#2B2A26';
    ctx.textAlign = 'left';
    ctx.fillText(text, left + 10, top + 16);
  }

  function mapPickNode(px, py) {
    if (mapModel.map2d) {
      let best = null, bd = 1e9;
      mapModel.nodes.forEach(n => {
        if (n.unknown || n._hidden || atlasMarkerTypeOf(n) === 'none') return;
        const s = atlasNodeScreen(n);
        const rad = Math.max(12, n._markerR || 12);
        const d = Math.hypot(px - s.x, py - s.y);
        if (d < rad && d < bd) { bd = d; best = n; }
      });
      return best;
    }
    const kx = mapView.kx || mapView.k, ky = mapView.ky || mapView.k;
    const p = { x: (px - mapView.x) / kx, y: (py - mapView.y) / ky };
    let best = null, bd = Infinity;
    mapModel.nodes.forEach(n => {
      if (n.unknown) return;
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < n.r + 5 && d < bd) { bd = d; best = n; }
    });
    return best;
  }
  function mapPickEdge(px, py) {
    let best = null, bd = 6;
    mapModel.edges.forEach(e => {
      const a = mapModel.nodes.find(n => n.id === e.s);
      const b = mapModel.nodes.find(n => n.id === e.t);
      if (!a || !b) return;
      const sa = mToScreen(a), sb = mToScreen(b);
      const vx = sb.x - sa.x, vy = sb.y - sa.y;
      const len2 = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((px - sa.x) * vx + (py - sa.y) * vy) / len2));
      const qx = sa.x + vx * t, qy = sa.y + vy * t;
      const d = Math.hypot(px - qx, py - qy);
      if (d < bd) { bd = d; best = e; }
    });
    return best;
  }

  /* ---------- 点位详情（复用右侧面板，补父级路径/子地点/空间关系） ---------- */
  function openMapPlace(id) {
    const p = placeById.get(id);
    if (!p) return;
    const path = placePath(p);
    const kids = placeChildren.get(id) || [];
    const rels = SPATIAL.filter(r => r.s === id || r.t === id);
    let coordNote = '', badgeNote = '', sourceNote = '层级拓扑，无坐标';
    if (mapMode === 'm2' && mapModel && !mapModel.fallback) {
      const n = mapModel.nodes.find(x => x.id === id);
      if (n) coordNote = n.unknown ? '方位未知（无方向/距离证据）'
        : `示意坐标（非真实经纬度）：(${n.x.toFixed(1)}, ${n.y.toFixed(1)})`;
      sourceNote = '约束求解示意坐标（非真实经纬度）';
    } else if (mapMode === 'map2d' && mapModel && !mapModel.fallback) {
      const n = mapModel.nodes.find(x => x.id === id);
      badgeNote = n ? (n.evidence ? ' · 有原文方位证据' : ' · 近似摆放') : '';
      sourceNote = '示意布局（非经纬度，叙事导航用近似摆放）';
    }

    const relHTML = rels.length ? rels.map(r => {
      const otherId = r.s === id ? r.t : r.s;
      const other = placeById.get(otherId);
      const ch = (r.evidence && r.evidence.ch) || r.first_ch || '—';
      const quote = (r.evidence && r.evidence.quote) || '';
      return `<div class="rel-item" data-map-goto="${otherId}">
        <span class="rel-dot" style="background:${CONF_COLOR[r.confidence] || '#9A9488'}"></span>
        <span class="rel-name">${other ? escHtml(other.name) : escHtml(otherId)}</span>
        <span class="rel-label">${SPATIAL_KIND_CN[r.kind] || r.kind} · ${escHtml(r.value || '')} · ${CONF_CN[r.confidence] || r.confidence}</span>
      </div>
      <div class="geo-ev-body" style="padding:0 0 6px 22px">第 ${ch} 章 · ${escHtml(quote) || '（无原文摘录）'}</div>`;
    }).join('') : '<div class="geo-empty">没有记录在案的空间关系。</div>';

    panelBody.innerHTML = `
      <h2 class="ent-name"><span>${escHtml(p.name)}</span></h2>
