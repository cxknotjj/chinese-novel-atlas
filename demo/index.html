<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凡人修仙传 · Novel Atlas</title>
<style>
  :root {
    --paper: #FAF9F5;
    --ink: #2B2A26;
    --ink-2: #6B675E;
    --ink-3: #9A9488;
    --line: #E3DFD5;
    --crimson: #A6314A;
    --indigo: #3D6B7D;
    --gold: #B8925A;
    --danger: #C0392B;
    --ok: #5A7A5E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--paper); color: var(--ink); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 实体类型图标：人物 / 势力 / 器物 / 妖兽 */
  .entity-icon {
    display: inline-flex; align-items: center; justify-content: center;
    flex: none; width: 16px; height: 16px;
    color: var(--ink-2); vertical-align: -3px;
  }
  .entity-icon svg {
    width: 100%; height: 100%; display: block;
    fill: none; stroke: currentColor; stroke-width: 1.65;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .entity-icon-character { color: var(--crimson); }
  .entity-icon-org { color: var(--indigo); }
  .entity-icon-item { color: var(--gold); }
  .entity-icon-creature { color: var(--ok); }
  .entity-icon-sm { width: 14px; height: 14px; }
  .entity-icon-lg { width: 20px; height: 20px; }

  header {
    height: 56px; display: flex; align-items: center; gap: 16px;
    padding: 0 20px; border-bottom: 1px solid var(--line);
    background: rgba(250,249,245,0.94); backdrop-filter: blur(8px);
    flex-wrap: nowrap; overflow: hidden; flex: none; width: 100%;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; flex: none; }
  .brand h1 { font-size: 16px; font-weight: 500; margin: 0; white-space: nowrap; }
  .brand .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: #F2EFE7; color: var(--ink-2); white-space: nowrap;
  }
  .stats { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex: none; }
  .stats b { font-weight: 500; color: var(--ink); }
  .stats .cov b { color: var(--crimson); }
  .stats span { white-space: nowrap; }

  .tabs { display: flex; gap: 1px; margin-left: auto; flex: none; }
  .tab {
    padding: 6px 12px; font-size: 12.5px; color: var(--ink-2);
    background: none; border: none; border-radius: 6px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .tab:hover { background: rgba(0,0,0,0.035); }
  .tab.on { background: var(--ink); color: #fff; }
  .tab .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--danger); margin-left: 5px; vertical-align: middle;
  }

  /* ---------- 读者进度条 ---------- */
  #readerBar {
    height: 38px; display: flex; align-items: center; gap: 14px;
    padding: 0 20px; border-bottom: 1px solid var(--line);
    background: #F6F3EB; color: var(--ink-2);
    font-size: 11.5px; overflow: hidden; flex: none;
  }
  #readerBar .reader-progress { display: flex; align-items: center; gap: 7px; flex: none; }
  #readerBar .rp-label { color: var(--ink-3); letter-spacing: .04em; }
  #readerBar input[type=range] {
    width: clamp(120px, 22vw, 320px); accent-color: var(--crimson);
    cursor: pointer;
  }
  #readerBar .rp-step, #readerBar .rp-all {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: 5px; font: inherit; padding: 2px 7px; cursor: pointer;
  }
  #readerBar .rp-step:hover, #readerBar .rp-all:hover { border-color: #C9C2B2; }
  #readerBar .rp-step:disabled, #readerBar .rp-all:disabled { opacity: .4; cursor: default; }
  #readerBar #cutoffLabel { color: var(--ink); font-weight: 500; white-space: nowrap; }
  #readerBar .reader-hint {
    color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #readerBar .is-future { color: var(--danger); }

  main { display: flex; flex: 1; min-width: 0; min-height: 0; width: 100%; position: relative; }

  /* ---------- 总览 / 疑点 ---------- */
  .home-hero {
    border: 1px solid var(--line); border-radius: 14px; background:
      linear-gradient(135deg, #FFFDF8 0%, #F7F1E5 55%, #F1E8D8 100%);
    padding: 28px 30px 24px; margin-bottom: 18px; position: relative; overflow: hidden;
  }
  .home-hero:after {
    content: "舆"; position: absolute; right: 24px; top: 16px; font-size: 54px;
    color: rgba(166,49,74,0.08); font-family: "Songti SC", "STSong", serif;
  }
  .home-kicker { font-size: 10.5px; letter-spacing: .16em; color: var(--ink-3); margin-bottom: 7px; }
  .home-title { font-size: 30px; font-weight: 500; margin: 0 0 8px; letter-spacing: .03em; }
  .home-sub { color: var(--ink-2); font-size: 13px; line-height: 1.8; max-width: 760px; }
  .home-meta { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
  .home-meta b { color: var(--ink); font-weight: 500; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .home-card {
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    padding: 14px 15px; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .home-card:hover { border-color: #C9C2B2; transform: translateY(-1px); }
  .home-card.static { cursor: default; }
  .home-card.static:hover { border-color: var(--line); transform: none; }
  .home-card .hc-k { font-size: 10.5px; letter-spacing: .1em; color: var(--ink-3); }
  .home-card .hc-v { font-size: 16px; margin: 5px 0 2px; color: var(--ink); }
  .home-card .hc-n { font-size: 11.5px; color: var(--ink-2); line-height: 1.7; }
  .home-card.alarm .hc-v { color: var(--danger); }
  .home-note {
    margin: 16px 0 0; border-left: 2px solid var(--gold); padding: 8px 0 8px 12px;
    color: var(--ink-2); font-size: 12px; line-height: 1.8; background: #FCFAF4;
  }
  .anomaly-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .anomaly-sev { font-size: 10px; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .anomaly-sev.high { background: #FBEAE7; color: var(--danger); }
  .anomaly-sev.warning { background: #FBF2E2; color: #9A6A30; }
  .anomaly-sev.info { background: #EEF3F3; color: var(--indigo); }
  .anomaly-card {
    border: 1px solid var(--line); border-radius: 9px; background: #fff;
    padding: 13px 15px; margin-bottom: 9px;
  }
  .anomaly-card .ac-title { font-size: 13.5px; font-weight: 500; margin: 0 0 4px; }
  .anomaly-card .ac-meta { font-size: 11px; color: var(--ink-3); margin-bottom: 7px; }
  .anomaly-card .ac-detail { font-size: 12px; color: var(--ink-2); line-height: 1.8; }
  .anomaly-card .ac-ev { margin-top: 8px; padding: 7px 9px; background: #FBF8F1; border-radius: 5px; font-size: 11px; color: var(--ink-2); line-height: 1.75; }
  .anomaly-card .ac-note { margin-top: 7px; font-size: 11px; color: var(--ink-3); }
  .anomaly-card .ac-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .anomaly-card .ac-actions button {
    border: 1px solid var(--line); background: #fff; border-radius: 5px; font: inherit;
    font-size: 11px; padding: 2px 8px; color: var(--ink-2); cursor: pointer;
  }
  .anomaly-card .ac-actions button:hover { border-color: #C9C2B2; }
  .anomaly-card.verified { opacity: .62; }
  .anomaly-empty { color: var(--ink-3); font-size: 12px; padding: 18px 0; }

  /* ---------- 全书搜索 ---------- */
  #searchPanel {
    position: fixed; top: 98px; right: 20px; width: min(460px, 92vw); max-height: 62vh;
    overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(43,42,38,0.14); z-index: 20; padding: 8px;
  }
  #searchPanel .sp-title { font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; padding: 4px 7px 7px; }
  #searchPanel .sp-row {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12px; line-height: 1.6;
  }
  #searchPanel .sp-row:hover { background: #F7F4EC; }
  #searchPanel .sp-kind { flex: none; font-size: 10px; color: var(--ink-3); width: 32px; padding-top: 2px; }
  #searchPanel .sp-main { min-width: 0; }
  #searchPanel .sp-name { color: var(--ink); font-weight: 500; }
  #searchPanel .sp-desc { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #searchPanel .sp-locked { color: var(--ink-3); cursor: default; }
  #searchPanel .sp-locked .sp-name { color: var(--ink-3); font-weight: 400; }
  #searchPanel .sp-empty { padding: 10px 8px 14px; color: var(--ink-3); font-size: 12px; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #legend {
    position: absolute; left: 16px; bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 4px 11px; max-width: 330px;
    font-size: 11px; color: var(--ink-2); pointer-events: none;
  }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 8px; height: 8px; border-radius: 50%; }
  #legend .legend-types {
    display: flex; flex-wrap: wrap; flex-basis: 100%; gap: 4px 12px; color: var(--ink-3);
    padding-bottom: 3px; margin-bottom: 3px; border-bottom: 1px dashed #E4DFD4;
  }
  #legend .legend-types b { font-weight: 500; color: var(--ink-2); }
  #legend .legend-types .entity-icon { width: 14px; height: 14px; }
  #legend .rel-legend i {
    width: 15px; height: 0; border-radius: 0; background: none !important;
    border-top-width: 1.6px; border-top-style: solid;
  }

  #hint {
    position: absolute; right: 16px; bottom: 16px;
    font-size: 11px; color: var(--ink-3); text-align: right; line-height: 1.7;
    pointer-events: none;
  }

  #graphTools {
    position: absolute; left: 16px; top: 16px; z-index: 6;
    display: flex; align-items: center; gap: 5px;
    padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(250,249,245,0.92); backdrop-filter: blur(6px);
    font-size: 11px; color: var(--ink-3);
  }
  #graphTools .gt-label { margin-right: 2px; }
  #graphTools button {
    border: 1px solid transparent; border-radius: 5px; padding: 3px 7px;
    background: none; color: var(--ink-2); font: inherit; cursor: pointer;
  }
  #graphTools button:hover { background: #F4F1E9; }
  #graphTools button.on { background: #2B2A26; color: #fff; }
  #graphTools select {
    max-width: 110px; border: 1px solid var(--line); border-radius: 5px;
    padding: 3px 5px; background: #fff; color: var(--ink-2);
    font: inherit; outline: none;
  }

  aside {
    display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 348px;
    background: #fff; border-left: 1px solid var(--line);
    box-shadow: -10px 0 30px rgba(43,42,38,0.06);
    overflow-y: auto; padding: 20px 20px 40px; z-index: 5;
  }
  aside.open { display: block; animation: panelIn 0.26s cubic-bezier(.2,.8,.2,1); }
  @keyframes panelIn {
    from { opacity: 0; transform: translateX(16px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes panelBodyIn {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #panelBody.switch-in { animation: panelBodyIn 0.28s cubic-bezier(.2,.8,.2,1); }
  @media (prefers-reduced-motion: reduce) {
    aside.open, #panelBody.switch-in { animation: none; }
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-thumb { background: #E0DCD2; border-radius: 4px; }

  .panel-close {
    position: absolute; top: 14px; right: 16px; width: 22px; height: 22px;
    border: none; background: none; cursor: pointer; color: var(--ink-3);
    font-size: 17px; line-height: 1; font-family: inherit;
  }
  .panel-close:hover { color: var(--ink); }

  .ent-name { font-size: 20px; font-weight: 500; margin: 0 0 4px; padding-right: 26px; display: flex; align-items: center; gap: 7px; }
  .ent-name .entity-icon { margin-top: -2px; }
  .ent-meta { font-size: 11.5px; color: var(--ink-3); margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #F4F1E9; color: var(--ink-2); }
  .chip.grp { color: #fff; }
  .ent-desc { font-size: 13px; line-height: 1.8; color: #45423B; margin: 0 0 16px; }

  .sec-title {
    font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-3);
    margin: 0 0 9px; font-weight: 500;
  }
  .rel-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px dashed #EFEBE1; font-size: 12.5px; cursor: pointer;
  }
  .rel-item:hover .rel-name { color: var(--crimson); }
  .rel-name { display: inline-flex; align-items: center; gap: 4px; }
  .rel-name .entity-icon { width: 12px; height: 12px; }
  .rel-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .rel-label { color: var(--ink-3); font-size: 11px; margin-left: auto; text-align: right; }

  .attrs { font-size: 12px; line-height: 1.95; color: var(--ink-2); }
  .attrs b { color: var(--ink); font-weight: 500; }

  .power-list { font-size: 12px; }
  .power-row {
    display: grid; grid-template-columns: 56px 1fr; gap: 8px;
    padding: 5px 0; border-bottom: 1px dashed #EFEBE1;
  }
  .power-ch { color: var(--ink-3); font-size: 11px; }
  .power-realm { color: var(--ink); }
  .power-note { color: var(--ink-3); font-size: 11px; }

  /* ---------- 通用视图容器 ---------- */
  .view {
    flex: 1; min-width: 0; width: 100%;
    padding: 20px 32px 48px; overflow-y: auto; height: 100%;
  }
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 7px; flex-wrap: wrap; margin: 18px 0 4px;
    font-size: 11.5px; color: var(--ink-3);
  }
  .pager button {
    min-width: 28px; height: 26px; padding: 0 9px;
    border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink-2); cursor: pointer;
    font: inherit; transition: border-color .15s, background .15s;
  }
  .pager button:hover:not(:disabled) { border-color: #C9C2B2; background: #FCFBF7; }
  .pager button.on { background: #2B2A26; border-color: #2B2A26; color: #fff; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .view::-webkit-scrollbar { width: 8px; }
  .view::-webkit-scrollbar-thumb { background: #E0DCD2; border-radius: 4px; }
  .view h2 {
    font-size: 12px; font-weight: 500; color: var(--ink-2);
    margin: 22px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .view h2:first-child { margin-top: 0; }
  .view h2 .n { color: var(--ink-3); font-weight: 400; }

  /* 百科 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 9px; }
  .card {
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px;
    background: #fff; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #C9C2B2; transform: translateY(-1px); }
  .card-type {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; line-height: 1;
    padding: 4px 7px; margin-bottom: 6px; border-radius: 3px;
    background: #F3F0E8; color: var(--ink-3);
  }
  .card-type .entity-icon { width: 13px; height: 13px; }
  .card .n { font-size: 13.5px; font-weight: 500; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .card .n .entity-icon { width: 15px; height: 15px; }
  .card .d {
    font-size: 11px; color: var(--ink-3); line-height: 1.5;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* 地点志 */
  .geo-note {
    font-size: 11px; color: var(--ink-3); line-height: 1.7;
    margin: -2px 0 14px; max-width: 900px;
  }
  .geo-stage-strip {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .geo-stage-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px;
    background: #fff; font-size: 10.5px; color: var(--ink-2);
  }
  .geo-stage-chip i {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
  }
  .geo-stage-chip b { font-weight: 500; color: var(--ink); }
  .geo-stage-chip span { color: var(--ink-3); }

  .geo-layout {
    display: grid; grid-template-columns: minmax(360px, 0.78fr) minmax(0, 1.22fr);
    gap: 18px; align-items: start;
  }
  .geo-tree-panel {
    background: #fff; border: 1px solid var(--line); border-radius: 11px;
    overflow: hidden;
  }
  .geo-tree-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 11px 14px; border-bottom: 1px solid #F2EFE7;
    font-size: 11.5px; color: var(--ink-3);
  }
  .geo-tree-head b { font-size: 13px; font-weight: 500; color: var(--ink); }
  .geo-row {
    display: grid; grid-template-columns: 16px 8px minmax(0, 1fr) auto auto;
    align-items: center; gap: 7px;
    min-height: 32px; padding: 5px 11px 5px 0;
    border-bottom: 1px solid #F6F2EA;
    cursor: pointer;
  }
  .geo-row:hover { background: #FCFBF7; }
  .geo-row.on { background: #FBF3EE; box-shadow: inset 3px 0 var(--crimson); }
  .geo-toggle {
    border: none; background: none; padding: 0; color: var(--ink-3);
    font: 12px/1 monospace; cursor: pointer; text-align: center;
  }
  .geo-toggle.leaf { visibility: hidden; }
  .geo-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .geo-name { font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .geo-ch { font-size: 10px; color: var(--ink-3); white-space: nowrap; }
  .geo-owner {
    max-width: 94px; overflow: hidden; text-overflow: ellipsis;
    padding: 1px 5px; border-radius: 3px; font-size: 9.5px; white-space: nowrap;
    background: #F3F0E8; color: var(--ink-3);
  }
  .geo-owner.owned { color: #6B4A5A; background: #F6EEF1; }

  .geo-detail {
    position: sticky; top: 0;
    background: #fff; border: 1px solid var(--line); border-radius: 11px;
    padding: 17px 19px 20px; min-height: 260px;
  }
  .geo-detail-title {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 4px; font-size: 20px; font-weight: 500;
  }
  .geo-meta { font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  .geo-badges { display: flex; gap: 5px; flex-wrap: wrap; margin: 0 0 11px; }
  .geo-badge {
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px;
    background: #FAF8F3; color: var(--ink-2); font-size: 10px;
  }
  .geo-badge.warn { color: #8A6D3B; background: #FDF8EC; border-color: #F0E3C8; }
  .geo-desc { font-size: 12px; line-height: 1.8; color: var(--ink-2); margin: 0 0 12px; }
  .geo-sec-title {
    font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em;
    margin: 15px 0 6px; padding-top: 10px; border-top: 1px dashed #EFEBE1;
  }
  .geo-kv { display: grid; grid-template-columns: 58px 1fr; gap: 4px 10px; font-size: 11px; line-height: 1.65; }
  .geo-kv .k { color: var(--ink-3); }
  .geo-kv .v { color: var(--ink-2); }
  .geo-jump {
    border: none; background: none; padding: 0; margin: 0 5px 3px 0;
    color: var(--ink-2); font: inherit; cursor: pointer; border-bottom: 1px dotted #C9C2B2;
  }
  .geo-jump:hover { color: var(--crimson); }
  .geo-chip-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .geo-org-card {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center;
    border: 1px solid #EFE9DC; border-radius: 7px; background: #FCFBF7;
    padding: 8px 10px; margin-bottom: 5px;
  }
  .geo-org-card b { font-size: 11.5px; font-weight: 500; color: var(--ink); }
  .geo-org-card .geo-org-desc {
    font-size: 10.5px; color: var(--ink-2); line-height: 1.65;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .geo-org-card .geo-org-link {
    border: 1px solid var(--line); background: #fff; border-radius: 4px;

<body>

<header>
  <div class="brand">
    <h1 id="title">—</h1>
    <span class="tag" id="tag">—</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab on" data-view="home">总览</button>
    <button class="tab" data-view="graph">图谱</button>
    <button class="tab" data-view="wiki">百科</button>
    <button class="tab" data-view="geo">地点志</button>
    <button class="tab" data-view="map">地图</button>
    <button class="tab" data-view="power">版图</button>
    <button class="tab" data-view="rhythm">节奏</button>
    <button class="tab" data-view="realms">境界</button>
    <button class="tab" data-view="foreshadow">伏笔<span class="dot" id="fsDot" hidden></span></button>
  </div>
  <input type="search" id="search" placeholder="搜索全书：人物 / 地点 / 设定 / 伏笔">
</header>

<div id="readerBar">
  <div class="reader-progress">
    <span class="rp-label">阅读进度</span>
    <button id="cutoffPrev" class="rp-step" title="向前 10 章">−10</button>
    <input id="cutoff" type="range" min="1" max="1" value="1" step="1">
    <button id="cutoffNext" class="rp-step" title="向后 10 章">+10</button>
    <b id="cutoffLabel">第 1 章</b>

d":"worldview","name":"制符之道","desc":"以符纸、妖兽血丹砂与符笔绘制灵符。新手需上千次失败才入门，合格制符师要数万次练习，材料损耗极大。","first_ch":136,"rules":["符纸需特殊原料","丹砂以妖兽血调制","符笔决定成功率"],"limits":["低阶修士难以承受材料损耗"]},{"id":"c_fushu","kind":"worldview","name":"符术与灵符","desc":"灵符把法术预存符内，可用灵力直接激发；符术则须持特定符箓念咒施法，多用于定神、传音等辅助法术。","first_ch":138,"rules":["灵符：灵力激发","符术：念咒施法"],"limits":["符术符箓需自行绘制或购买"]},{"id":"c_fabao","kind":"worldview","name":"法宝与残片","desc":"法宝为结丹、元婴级修士炼制之物，威能远超低阶法器。残片仍可能保留隐形、遮灵气等奇异功效。","first_ch":139,"rules":["结丹/元婴修士炼制","残片仍具部分威能"],"limits":["低阶修士无法炼化修复"]},{"id":"c_qipai","kind":"organization_rule","name":"越国七派","desc":"越国七大修仙门派：掩月宗、黄枫谷、灵兽山、清虚门、化刀坞、天阙堡、巨剑门。掩月宗最强，灵兽山次之。","first_ch":127,"rules":["掩月宗最强","灵兽山次之","其余五派相当"],"limits":[]},{"id":"c_shengxianling","kind":"organization_rule","name":"升仙令","desc":"越国七派发给立下巨功的修仙家族之令。持令上门等同升仙大会胜出，可入门并获筑基丹，认令不认人，可转让交易。","first_ch":141,"rules":["七派各制","认令不认人","可转让交易"],"limits":["数百年才出现一次"]},{"id":"c_chuwudai","kind":"item_grade","name":"储物袋","desc":"修仙者随身法器，可把物品缩小十倍收入袋中。低阶袋无认主，不能装活物，容量与缩小倍数有限。","first_ch":148,"rules":["灵力锁定收入/取出","十倍缩小"],"limits":["不可装活物","被抢即失","容量有限"]},{"id":"c_fubao","kind":"worldview","name":"符宝","desc":"比灵符更高一阶的符类宝物，威力接近法宝。韩立的灰剑即是符宝，可斩黑索圆球、取修士首级。","first_ch":143,"rules":["威力近法宝","需法力驱动"],"limits":["法力耗尽则威能大减"]},{"id":"c_heqidan","kind":"item_grade","name":"合气丹","desc":"黄枫谷内炼制的精进法力丹药，叶长老正炼一炉，并答应分给吴管事一半。","first_ch":150,"rules":[],"limits":["材料昂贵"]},{"id":"c_huangfeng_jieceng","kind":"organization_rule","name":"黄枫谷弟子阶层","desc":"执事弟子（未服筑基丹）→领事弟子（服丹未筑基）→筑基弟子（真正修士，独辟洞府）。管事掌实权，结丹以上决定存亡。","first_ch":147,"rules":["执事弟子杂务最多","领事弟子管执事","筑基弟子免杂务"],"limits":["筑基丹名额极少"]},{"id":"c_difeihuo","kind":"worldview","name":"地肺之火","desc":"玄阳之地蕴藏的地火，比修士先天真火更精纯、高温且持久，可大幅提高成丹率，门派多设玄阳火地供弟子租用。","first_ch":156,"rules":["可替代先天真火","需玄阳之地","岳麓殿辟三十六间地火间，坞石耐高温不怕地火熔炼","龙首地火可自行调节火焰大小与高度","火星砂可暂增地火威力，持续时间不久","玉牌封屋后与外界断绝联系，非数名结丹合力不能入"],"limits":["按次收费","需筑基以上才可自如操控","坞石越国不出产，须从极西之地他国弄来"]},{"id":"c_xuejin_shilian","kind":"organization_rule","name":"血禁试炼","desc":"越国七派每五年派炼气弟子进入风属性古禁采集筑基丹主药。禁制只拦筑基以上，炼气可入，各派为灵药自相残杀。","first_ch":160,"rules":["每五年一次","衰弱期五天","仅炼气可入"],"limits":["生还者不足四分之一","灵药逐年减少"]},{"id":"c_dingyandan","kind":"item_grade","name":"定颜丹","desc":"能使青春永驻、容貌长存的丹药，无需真火，但原料皆需千年以上药性，对修为无用，故极少有人知晓。","first_ch":159,"rules":["无需先天真火"],"limits":["药材需千年药性"]},{"id":"c_fangshi_rule","kind":"organization_rule","name":"修仙坊市规矩","desc":"坊市五里内禁飞；外来修士交一块低阶灵石即可摆摊一日并受坊市保护；坊市由门派筑基高手驻守维持秩序。","first_ch":162,"rules":["五里内禁飞","摆摊一日一灵石","坊市保护摊主"],"limits":["不得私下斗法"]},{"id":"c_qipai_lishi","kind":"organization_rule","name":"越国七派历史","desc":"千年前越国正邪两派大战两败俱伤，七个不入流小派联手将其连根拔起，瓜分功法，奠定七派中立独大的格局。","first_ch":177,"rules":["七派中立","正邪功法兼收","联手驱逐外来势力"],"limits":["内部同样弱肉强食"]},{"id":"c_jindi_transfer","kind":"worldview","name":"禁地随机传送","desc":"从风刃大阵破开的通道进入禁地，会触动残留挪移阵法，被随机传送到禁地各处，位置好坏全看运气。","first_ch":180,"rules":["进入即随机传送"],"limits":["可能落入妖兽巢穴或绝地"]},{"id":"c_jindi_three","kind":"worldview","name":"禁地三类人","desc":"血禁试炼弟子分三类：十一层以下的弱者被清洗；十二三层的中等者杀人抢宝；各派精锐在中心区清场夺药。","first_ch":185,"rules":["弱者先死","中等者抢宝","精锐最后对决"],"limits":["第一日死伤大半"]},{"id":"c_center_layers","kind":"worldview","name":"中心区三层","desc":"血色禁地中心区分三层：外层为观赏花园，中层为迷雾环形山与灵药产地，内层为百丈宝塔与未破禁制。","first_ch":194,"rules":["外层花园","中层环形山","内层宝塔"],"limits":["第三层禁制无人能破"]},{"id":"c_yueyang_rule","kind":"organization_rule","name":"月阳宝珠执掌规矩","desc":"月阳宝珠由七派轮流执掌，每次禁地开启由持宝门派在规定时间驱雾，其余门派监督，保证同时入山。","first_ch":194,"rules":["七派轮流","定时驱雾","各派监督"],"limits":["不得抢先或拖延"]},{"id":"c_jindi_endgame","kind":"worldview","name":"禁地最后一日","desc":"前两日各派尚有克制，最后一天弟子满载而归时，才是互相劫杀、抢夺灵药的真正血战。","first_ch":200,"rules":["前两日克制","最后一日劫杀"],"limits":["满载者最危险"]},{"id":"c_yinyang_qianyin","kind":"technique","name":"阴阳牵引术","desc":"掩月宗双修道侣联手牵制妖兽的合击之术：道侣并肩握手，各发红蓝光柱合击，配合师祖圆环法宝困锁妖兽。","first_ch":204,"rules":["男女道侣配对并肩","红蓝光芒合击","圆环法宝困锁"],"limits":["道侣丧生者只能取法器普通备战"]},{"id":"c_wuyou_zhen","kind":"technique","name":"无忧针法","desc":"源自墨大夫遗物的针灸针法，可清除人短期记忆；须先服忘尘丹，施针后对方会忘记半日内经历之事。","first_ch":203,"rules":["先服忘尘丹","银针施针","抹去半日记忆"],"limits":["仍有少许危险","只能清除短期记忆"]},{"id":"c_wangchen_dan","kind":"item_grade","name":"忘尘丸","desc":"火红色异香药丸，韩立早年随手配制，配合无忧针法使用，确保施针无后患，令人忘记半日内发生之事。","first_ch":203,"rules":["施针前服下"],"limits":["可能仍有少许危险"]},{"id":"c_sunv_lunhui_gong","kind":"technique","name":"素女轮回功","desc":"南宫婉独门功法，可永驻容颜；每隔数十年法力轮回一次，人变回年幼模样。轮回期内能将禁制法力渡给男子（不能传女子），受对方境界所限；破身约损五六年法力。","first_ch":208,"rules":["容颜永驻","数十年法力轮回返幼","可向男子渡送禁制法力"],"limits":["法力不能传给女子","渡送受对方境界限制","破身损失数年法力"]},{"id":"c_xiaowuxing_jinfa","kind":"technique","name":"小五行须弥禁法","desc":"小五行符发动的禁制，可令青石通道自行挤压弥合、封死出入口，被困者一时难以破开，连结丹修士亦束手无策。","first_ch":206,"rules":["符箓贴于通道入口发动","通道石体自行挤压弥合"],"limits":["困于地下者无法原路返回"]},{"id":"c_yinjing","kind":"item_grade","name":"银精","desc":"祭炼法宝的珍贵原料，须结丹期以上修士以真火从大量纯银中提炼；掺入法器可大幅提升质地，直赶普通法宝。","first_ch":207,"rules":["结丹期以上真火提炼","掺入法器提升质地"],"limits":["普通修士无法提炼"]},{"id":"c_jindi_bet","kind":"organization_rule","name":"禁地灵药赌局","desc":"禁地关闭后，三派长辈以弟子上交灵药多少赌输赢；上缴后还须由领队携带的嗅灵兽在三丈内复查，以防私藏百年以上灵药。","first_ch":210,"rules":["三派长辈比对灵药数量","弟子先主动上缴","嗅灵兽三丈内复查"],"limits":["百年以上灵药藏匿不过嗅灵兽"]},{"id":"c_qingyuan_jianjue","kind":"technique","name":"青元剑诀","desc":"原玄剑门镇派绝学，本十三层，灭门时被黄枫谷抢下半部残本，现存九层；前三层炼气可修，中三层筑基，后三层结丹。","first_ch":216,"rules":["前三层练成可徒手发出丈许剑芒","中三层修成瞬发护体剑盾，带剑芒反击","后三层大成神通剑影分光术，须有飞剑或飞刀法宝","第七层起每升一层多炼化一道剑影，极致三道，威力三分之一"],"limits":["第四层起每隔数日散功：四层失十分之一，五层十分之二，六层十分之三","残本至多修到结丹期","修炼奇慢，每炼一层扩经展脉、深邃丹田，六层筑基后期法力多近三分之一"]},{"id":"c_lingyan","kind":"worldview","name":"灵脉与灵眼","desc":"灵气浓处久成灵脉；灵气最郁结处为灵眼；灵气长期过密可实体化为灵眼之物（珠、石、泉、树），在其附近打坐可加快修炼。","first_ch":220,"rules":["灵眼之物上好者可加快近二三成修炼速度","灵眼之物形成后可人为用法力挪走，不损耗功效"],"limits":["灵眼之物须数万年乃至十几万年进化再加机缘方可形成"]},{"id":"c_shixie_li","kind":"organization_rule","name":"师徒谢师礼规矩","desc":"黄枫谷不成文规矩：有明确师徒关系者，师傅有权抽取徒弟上交师门贡品的一半作为谢师礼，仅限一次，下不为例。","first_ch":212,"rules":["师傅抽徒弟贡品一半","仅限一次"],"limits":["不影响其他人的全额奖赏"]},{"id":"c_liandan","kind":"worldview","name":"炼丹之道","desc":"丹药成败主要在火候控制与开炉取丹时机，配方比例先辈已固定；炼丹师与制符师同为修仙界最烧钱也最吃香的职业。","first_ch":214,"rules":["成丹关键在火候与取丹时机","可按固定比例增减原料数量"],"limits":["成名炼丹师炼拿手丹药成丹率也仅约一半"]},{"id":"c_daoyan_wuxing_zhen","kind":"technique","name":"颠倒五行阵","desc":"号称小禁断之阵的五行幻阵，覆盖面积较小、无主动杀敌之效，但幻化掩饰山门、迷惑困敌之功不逊大门派护派大阵；全套十八阵盘、三十六阵旗。","first_ch":226,"rules":["十八阵盘配三十六阵旗","按玉简方法纹丝不差布设","可幻化掩饰洞府与山门"],"limits":["此套为残品，仅原阵法威力十分之一","需阵法师实地校准改进"]},{"id":"c_da_yanyi","kind":"technique","name":"大衍诀","desc":"千竹教秘传的傀儡操控功法，以神念驱使傀儡；层次越高可同时驱使的傀儡越多，第三层即可驱使二百傀儡机关。","first_ch":230,"rules":["以神念操控傀儡","层次越高可驱使的傀儡越多"],"limits":["功法不全则难以精进"]},{"id":"c_kuilei_jishu","kind":"worldview","name":"傀儡机关术","desc":"源于法器炼制又截然不同的道术，极西之地盛行；按机关术正式分级（如二级傀儡兽），顶级傀儡人可与筑基后期修士一较高下。","first_ch":224,"rules":["傀儡虎豹喷属性光柱","人偶机关人射光箭或持刀枪近战","傀儡被击倒后林中源源不断补充，打消耗战"],"limits":["本地修仙界罕有人知"]},{"id":"c_jingmai_rule","kind":"organization_rule","name":"秘店竞卖规矩","desc":"秘店由本店喊灵石基价、众人竞价；灵石不足可用等值物品抵押，三主持共同估价，价高者得；竞卖毕转入自由交易时段。","first_ch":223,"rules":["基价竞价","物品抵押三人估价","价高者得","交易结束才开门以防意外"],"limits":["捣乱压价者将被本店不客气对待"]},{"id":"c_kuilei_zhenjie","kind":"technique","name":"傀儡真解","desc":"玉简所载各阶傀儡兽、傀儡人炼制大全，法门详尽，与大衍诀相辅而成。","first_ch":237,"rules":["炼制各阶傀儡兽与人","需配合大衍诀神识操控"],"limits":["兼修易耽误自身法力精进"]},{"id":"c_bingxin_jue","kind":"technique","name":"冰心决","desc":"李化元夫人所修功法，心境有亏则留漏洞，难练至大圆满境界。","first_ch":238,"rules":["心境无瑕方可练至大圆满"],"limits":["心境有缺则修为止步"]},{"id":"c_zhenyang_jue","kind":"technique","name":"真阳决","desc":"李化元所修顶阶功法，他以三阳之体修之如鱼得水，方得结丹。","first_ch":239,"rules":["需三阳之体一类资质方可发挥威力"],"limits":[]},{"id":"c_gongfa_sanlei","kind":"worldview","name":"功法三类划分","desc":"功法分三类：一类神通强而精进慢，二类精进快而缺自保神通，三类顶阶兼备但修炼凶险。","first_ch":239,"rules":["第一类：实战神通强，法力精进慢","第二类：法力精进快，自保手段弱","第三类：两者兼备，条件苛刻且凶险"],"limits":["顶阶功法非资质绝伦者修炼等同自杀"]},{"id":"c_sanzhuan_chongyuan","kind":"technique","name":"三转重元功","desc":"辅助青元剑诀的功法：剑诀六层时散功重修，三转压缩提纯真元，凝成近似固态真元后再结丹，半概率成功。","first_ch":241,"rules":["须先修青元剑诀","剑诀六层散功重修，一连三次","每次重修压缩真元，法力精纯数倍"],"limits":["重修一次比一次耗时","须大量灵药辅助","结丹成功率仅约一半"]},{"id":"c_huachun_jue","kind":"technique","name":"化春决","desc":"顶阶功法，修者眉目自带狐媚风情；红拂以不失贞洁为限，一旦守宫砂消失即废其法力。","first_ch":246,"rules":["修成后自带狐媚皮相","须双修否则法力停滞甚至倒退"],"limits":["失贞即被师傅废去法力"]},{"id":"c_qingzhu_fengyun_jian","kind":"technique","name":"青竹蜂云剑","desc":"金页所载结丹期木属性飞剑法宝炼制法门，十二把起成套，亦可炼三十六、七十二把一套。","first_ch":241,"rules":["木属性飞剑论套炼制","十二把起成套，可至三十六、七十二把"],"limits":["结丹期后方可着手炼制"]},{"id":"c_duobao_dahui","kind":"organization_rule","name":"夺宝大会","desc":"燕家召集附近各国结丹修士门下弟子聚会交流、联络交情，头彩为符宝乾坤塔，另有法器灵丹为彩头。","first_ch":245,"rules":["受邀者为结丹期高手门下弟子","设多场筑基弟子比试交流"],"limits":["越国之外修士赴会几率较低"]},{"id":"c_xuening_dafa","kind":"technique","name":"血灵大法","desc":"《万灵真经》上的第一魔功，炼成后足以称霸魔道六宗。须一男一女共同双修以防反噬，灵根资质决定可修层数；修炼需以修士魂魄血祭。王蝉暗灵根、燕如嫣天灵根是最佳体质。","first_ch":255,"rules":["一男一女双修","灵根资质决定层数","需修士魂魄血祭"],"limits":["功法霸道，有反噬风险","资质差者仅能练两三层"]},{"id":"c_wanling_zhenjing","kind":"technique","name":"万灵真经","desc":"鬼灵门魔功典籍，血灵大法为其上第一魔功。鬼灵门曾许诺将副册借与归附后的燕家一览。","first_ch":255,"rules":["副册可借归附门派阅览"],"limits":[]},{"id":"c_shengsizhou","kind":"organization_rule","name":"生死咒","desc":"敌对或归附双方互换的血咒，下咒后二三百年内不得对下咒一方不利。燕家以此验证鬼灵门诚意，换取壮大自身的缓冲时间。","first_ch":256,"rules":["双方互换下咒","咒期二三百年"],"limits":["到期后制约解除"]},{"id":"c_silingwan","kind":"item_grade","name":"饲灵丸","desc":"古修士饲养灵兽的丹丸，大多数妖兽极为爱吃，久服可催进灵兽提升阶级。所需原料珍稀罕见，一般修士不舍得将药材用于灵兽。","first_ch":255,"rules":["妖兽多食","久服助灵兽进阶"],"limits":["原料珍贵罕见"]},{"id":"c_mixin_shu","kind":"technique","name":"迷心术","desc":"专修迷魂类法术，与对方双目对视即可令女子心神失守、身心归附，兴不起反抗之意。主要靠法力差距强行控神；董萱儿的狐媚之术与之同源而霸道较弱。","first_ch":258,"rules":["对视触发","对女子效果显著"],"limits":["对男子施展存疑","修为差距过大方可控神"]},{"id":"c_qingyang_mohuo","kind":"technique","name":"青阳魔火","desc":"魔焰门狂焰修士的歹毒魔火，众人持烈阳大旗合力施法，旗尖汇聚青色炎球。法器道术一触即被消融，护盾触之即灭，修士瞬间化为乌有；释放以自身修为降低为代价，须修青阳魔火诀。","first_ch":266,"rules":["多人持旗合力施法","青色火焰消融法器护盾"],"limits":["消耗自身修为","施法时修士纹丝不动易被打断"]},{"id":"c_kuiwei_zhenjing","kind":"technique","name":"傀儡真经","desc":"傀儡炼制典籍：傀儡除法器材料外，还需生灵魂魄一同融炼方有灵性。书后附牵魂术（引魂出刚死尸体，成功率低）、凝魂术（聚数个魂魄为人造强魂）、炼魂术（改造生魂以备融炼）三门法术。","first_ch":264,"rules":["材料与生灵魂魄融炼","等级越高傀儡所需魂魄越强"],"limits":["牵魂术仅对新尸有效","筑基初期成功率低"]},{"id":"c_sisha_zhen","kind":"technique","name":"四煞阵","desc":"灵石矿守卫布设的可攻可守大阵，青红蓝黄四色禁制光幕，可护阵内修士抵挡法器道法轰击；在青阳魔火反复洗涮下会逐渐黯淡直至被破。","first_ch":263,"rules":["四色光幕护阵","阵内修士可随时退避"],"limits":["禁制可被强力魔火磨破"]},{"id":"c_lingshoushan_lai","kind":"worldview","name":"灵兽山渊源","desc":"灵兽山本是魔道御灵宗数千年前埋在越国的潜伏分支。数千年传承后不愿自认御灵宗一份子，此次六宗入侵被启用时，反通气其余六派设伏，重创来偷袭的魔道修士。","first_ch":265,"rules":["灵兽山已脱离御灵宗自认"],"limits":[]},{"id":"c_guchuansongzhen","kind":"worldview","name":"古传送阵与大挪移令","desc":"古修士所布传送阵可传送千万里之遥，现今修仙界能造的最远仅百余里。大挪移令是超距传送必备护身法器，可保证人不被传送空间压力挤压至死；令牌制法随久远动乱失传，古传送阵亦成传说。","first_ch":271,"rules":["超距传送须持大挪移令","短距传送无需令牌"],"limits":["令牌与阵法制法均已失传"]},{"id":"c_jingu_yuan_rules","kind":"organization_rule","name":"金鼓原战事规矩","desc":"双方对峙形成一月一大打、每日小打的惯例：大打各派上千人对阵，护盾一开死伤寥寥；小打凌晨到傍晚留筑基修士互相猎杀，夜间结丹高手出手；炼气期修士留作预备，保存完整。","first_ch":272,"rules":["日间筑基互猎","夜间结丹出手","炼气留作预备"],"limits":["结丹修士全力可逃，难取性命"]},{"id":"c_mengyanshu","kind":"technique","name":"梦魇术","desc":"迷魂类法术，施法者目光泛青紫光采摄入对方心神；若修为不及对方，会被反制心神、冷汗失控。","first_ch":288,"rules":["以目光对视发动","摄人心神"],"limits":["修为不足会遭反噬"]},{"id":"c_lianxi_gongfa","kind":"technique","name":"敛息功法","desc":"可将自身灵气收敛得若有若无，瞒过同级修士以天眼术探查身份与修为。","first_ch":288,"rules":["收敛灵气波动"],"limits":["修为高出太多者仍可看穿"]},{"id":"c_huoniaoshu","kind":"technique","name":"火鸟术","desc":"中级初阶火焰法术，化出近丈火鸟，破坏力大到筑基期修士也不敢硬接；炼气老道所使只是外形相仿、法力未增的伪火鸟变形。","first_ch":289,"rules":["火鸟近丈","破坏力强横"],"limits":["伪术仅能变形，威力不增"]},{"id":"c_kongshenshu","kind":"technique","name":"控神术","desc":"筑基期十大鸡肋法术之一，施术成功后受术者一段时间对施术人唯命是从；只能对凡人施展，且修习者须筑基后、神识远超常人。","first_ch":293,"rules":["可操控凡人神志","施术消耗心神极大"],"limits":["对修士无效","神识不足者无法修习"]},{"id":"c_nongyanjue","kind":"technique","name":"弄焰诀","desc":"吴老道数十年自行完善的控火心法，前半为火焰形态变化窍门，后几页提出活用法术的模糊概念与几种可行训练方法，令韩立茅塞顿开。","first_ch":294,"rules":["火焰变形","法术活用思路"],"limits":["变形本身不增威力"]},{"id":"c_yanzhou","kind":"worldview","name":"言咒","desc":"蒙山五友所中血咒实为一种言咒，禁制全靠古怪咒语起效；黑血与臂上怪符号只是装神弄鬼。受术者泄露机密即触发禁制、心脏破裂而亡。","first_ch":300,"rules":["咒语为禁制关键","泄密即发作"],"limits":["可凭口诀解除","或由神识更强者强抹痕迹"]},{"id":"c_heisha_xiluogong","kind":"technique","name":"黑煞修罗功","desc":"黑煞教所修功法，修炼过急会引发法力反噬，须吸食修仙者精血压制体内真元；反噬可提前两日发作。","first_ch":299,"rules":["借精血压制反噬"],"limits":["急于求成易提前反噬"]},{"id":"c_heifengzhen","kind":"technique","name":"黑风阵","desc":"黑煞教围捕阵法，多名黑衣人各持漆黑大旗围住目标挥动，黑旗响起呜呜鬼啸，涌出诡异黑色浓雾旋转合围。","first_ch":307,"rules":["持旗合围","鬼啸黑雾"],"limits":["持旗修士被斩即阵破"]},{"id":"c_yaohua","kind":"worldview","name":"妖化","desc":"血侍所修魔功的秘法状态，化出两丈高妖魔身躯：嘴露獠牙、头生黑弯角、拖着鳞甲铁尾，浑身黑红妖纹，刀枪法器难伤，神智趋于嗜血疯狂。","first_ch":309,"rules":["体型暴涨","利爪坚甲"],"limits":["惧怕符宝级攻击"]},{"id":"c_huangcheng_rule","kind":"organization_rule","name":"皇城禁令","desc":"越国皇室由七派共同扶持，门规严禁七派弟子踏入皇城半步，以防某派仗势挟持皇室、不利于其余各派；数百年来皇城内无七派弟子踪影。","first_ch":310,"rules":["弟子不得入皇城","不干涉皇室"],"limits":["皇帝不犯大错即放任"]},{"id":"c_wuchangdan","kind":"item_grade","name":"无常丹","desc":"韩立保留的战利品丹药，既可作解毒圣药驱散毒性，也可经特定手法将体内残余药力突然转为剧毒，发作时七窍流黑血、无声无息毙命。","first_ch":305,"rules":["可解毒亦可化毒"],"limits":["须预先下禁制埋伏"]},{"id":"c_sixiangzhen","kind":"technique","name":"四象阵","desc":"黑煞教护法阵法，发动后将闯入者送入冰天雪地的幻境中围困。仓促布阵、主持弟子阵亡导致人手不足时，灵气稀薄处会露出破绽，集中法器猛攻可破。","first_ch":317,"rules":["幻境困敌","破绽在灵气稀薄处"],"limits":["人手不足时易被看出破绽"]},{"id":"c_jujianshu","kind":"technique","name":"巨剑术","desc":"韩立从青元剑诀金页上所得御剑之法，是其筑基期唯一可使用的御剑术。众多成套法器融合，化为十几丈金黑红三色巨剑凌空下斩，威力惊人。","first_ch":319,"rules":["法器融合为巨剑","需大衍诀分神操控"],"limits":["筑基期仅能用此一式"]},{"id":"c_qingmu_zhenzhao","kind":"technique","name":"青木真罩","desc":"青纹所施防御护罩，五颗青色圆珠排列成五角形棱柱光罩，将自身严护其中。除结丹期修士外，筑基期修士损伤不了其分毫。","first_ch":318,"rules":["五圆珠成五角护罩","可灌注灵力加固"],"limits":["结丹期方可击破"]},{"id":"c_qianrenshu","kind":"technique","name":"千刃术","desc":"金系中级以上群攻法术，借金符激发：光点变形收缩为寸许金色小剑，如冰雹般坠落群刺目标。刘靖以此术集中消耗血侍光茧血光。","first_ch":320,"rules":["金系群攻","金符激发"],"limits":["金系攻击法术本就稀少"]},{"id":"c_zhenbao","kind":"item_grade","name":"真宝","desc":"符宝中的极品，可纳法宝本体三分之一威能；须经法宝主人血脉炼制，只有特定血脉后人可驱使。一次性消耗，威能当场尽发；炼成真宝会永久折损法宝威能，无法再祭炼。","first_ch":322,"rules":["纳三分之一威能","血脉限定后人驱使"],"limits":["一次性消耗","法宝威能永久损失"]},{"id":"c_shaoyao_jue","kind":"technique","name":"煞妖诀","desc":"四大血侍所修魔功，可在体内凝练血凝五行丹，不服用筑基丹亦可踏入筑基期；速成之法注定终生无法结丹，筑基即是功法最高层次。","first_ch":330,"rules":["凝练五行丹","免服筑基丹入筑基"],"limits":["终生无法结丹"]},{"id":"c_shadan_shu","kind":"technique","name":"煞丹术","desc":"魔道秘术，筑基后期修士服血凝五行丹，有三分之一机会结成近金丹威力的伪金丹煞丹，可延年益寿；缺陷是结成后修为不再增长、不能进军元婴，煞妖之气渐蚀神智致迟钝愚笨。","first_ch":330,"rules":["三分之一几率结煞丹"],"limits":["修为封顶","神智受蚀","难入元婴"]},{"id":"c_shenwai_huashen","kind":"technique","name":"身外化身术","desc":"越皇玉简所载诡异秘术，需一具灵根无损的六层以下低阶躯体种植神识分神；失败则神识毁去无法收回，成身后仅是可自行修炼的高级傀儡。","first_ch":330,"rules":["以人身祭炼化身","化身供主君吸纳","需灵根无损低阶躯体","分神种植入体","成身后为高级傀儡"],"limits":["魔道绝密","失败神识不可收回","神识不足易癫狂反噬","仅筑基后可修"]},{"id":"c_xiusuidan","kind":"item_grade","name":"修髓丹","desc":"修习特别魔功、自损修为方可炼制的救命丹药，只能自己服用，对旁人却是致命毒丸；服下可瞬间恢复法力、消除伤势。","first_ch":326,"rules":["自服疗伤复原"],"limits":["他人服用为毒丸","炼制须自损修为"]},{"id":"c_xuelingzuan","kind":"technique","name":"血灵钻","desc":"越皇魔功杀招，将体内真元慢慢凝练压缩数十倍暗藏体内，出其不意一次性突袭；凝练痛苦不堪，练成一枚耗时极久，离体后凝固成血红尖锥。","first_ch":326,"rules":["真元压缩数十倍","一次性突袭"],"limits":["凝练耗时极久","数量稀少"]},{"id":"c_linhunshu","kind":"technique","name":"炼魂术","desc":"门派与大家族对付叛门背族之人的酷刑法术，抽出元神魂魄专门折磨，元神越强痛苦越烈；修习者必炼一件与自身元神紧密相连的魂器方可施展。","first_ch":338,"rules":["抽取元神折磨","须以魂器施展"],"limits":["修仙界谈之色变"]},{"id":"c_zuanxinchong","kind":"item_grade","name":"钻心虫","desc":"阴毒蛊虫，纤细如毫毛、肉眼难辨，唯神识可感应；入体后贴血脉缓缓向心脏蠕动，一两年后心痛夜不能寐，数月后心痛发作而亡，状如正常心肌绞痛，高阶修士也难察异状。","first_ch":337,"rules":["贴血脉向心脏蠕动","死状如心肌绞痛"],"limits":["潜伏期一两年"]},{"id":"c_qiangxing_jifa","kind":"technique","name":"强行催基秘法","desc":"魔道六宗秘传两三种，可将筑基期修士强行激发至结丹期差不多修为；缺陷极大，施展一次修士注定经脉寸断而亡，修为存续时间极短，仅够演戏瞒过六派耳目。","first_ch":340,"rules":["筑基强催至结丹修为"],"limits":["经脉寸断而亡","存续时间极短"]},{"id":"c_qichongbang","kind":"worldview","name":"奇虫榜","desc":"御灵宗修士玉简所载，收录上千种奇虫，按厉害程度排名，并附培育与驱使虫类的秘法。金背妖螂列第七十三位，血玉蜘蛛列一百多位。","first_ch":344,"rules":["按虫类实力排名","附培育驱使秘法","按凶名排名","幼虫可入储物袋","长成后用灵兽袋"],"limits":["榜上奇虫多需自幼下禁制驯化","玉木可困部分奇虫"]},{"id":"c_tianhuozhishu","kind":"technique","name":"天火之术","desc":"中级高阶法术，施术后天幕化为深红火烧云如熔岩翻滚，熔岩雨滴落，每滴相当于筑基修士一击；法术范围之内难以逃出，但来快去快。","first_ch":348,"rules":["火烧云化熔岩雨","须联合防护罩抵挡"],"limits":["法术持续时间短"]},{"id":"c_yuanying_shiyue","kind":"organization_rule","name":"元婴互不出手之誓","desc":"魔道六宗与七派的元婴期修士早已交手数番、七派处下风，双方被逼发下毒誓，互不亲自参与这场大战，战事只限结丹期及以下修士水准。","first_ch":346,"rules":["元婴不得亲自下场","大战限结丹水准"],"limits":["违反誓言者为对方所攻"]},{"id":"c_longyin_zhizi","kind":"worldview","name":"龙吟之质","desc":"一种先天异质体质，男体错生女儿身；若强行修真，寿元与经脉会渐渐错位萎缩，寿元短促。辛如音即此体质，古方医治失败，两年内将丧命。","first_ch":352,"rules":["强行修真致经脉萎缩"],"limits":["古方亦未能治愈"]},{"id":"c_feizhen_fabao","kind":"item_grade","name":"飞针法器","desc":"针类法器别称阴器，攻击力略低但体积小、飞行快，是偷袭暗算的最佳利器。炼制材料特殊、难度数倍于常办法器，极为罕见；成套飞针须一同祭出，对神识控制要求很高。","first_ch":355,"rules":["成套须同祭","神识强弱决定可控数目"],"limits":["材料特殊、炼制艰难"]},{"id":"c_mulan_fashi","kind":"worldview","name":"慕兰法士与灵术","desc":"慕兰大草原游牧民族所修者称法士，境界功法与修士类似，结丹前不重法器符箓，重修五行道术并融合草原秘术，独创灵术流派，同阶可抗衡甚至略占上风。九国盟即为抵御其入侵而结成。","first_ch":358,"rules":["重灵术轻外物","同阶可抗修士"],"limits":["慕兰草原资源贫乏，需向外争夺灵脉"]},{"id":"c_lunhui_zhenjue","kind":"technique","name":"轮回真诀","desc":"掩月宗秘术，须施法者真元大损时方可发动。外人灵力探入其身体，即被体内螺旋真元吸住吸干；所吸只限弥补自身亏损，不能增修半分法力；超时无他人真元补充，施术人将真元内缩自爆而亡。","first_ch":362,"rules":["真元大损时方可施展","只补亏损不增修为"],"limits":["超时无补充则自爆"]},{"id":"c_sanda_tianzai","kind":"worldview","name":"乱星海三大天灾","desc":"乱星海海上三大天灾：海中妖兽、天风、鬼雾。妖兽多庞大而精水属性妖术；天风每年两次从海的一端定时刮向另一端，飓风所过屋毁人亡；鬼雾飘忽不定，被罩住的活物无一生还，但从不靠近大岛。","first_ch":366,"rules":["天风定时横扫","鬼雾不近大岛"],"limits":["修士卷入天风亦难脱身"]},{"id":"c_kuixing_doufa","kind":"organization_rule","name":"魁星岛居与斗法规矩","desc":"外来修士分临时居住与保人永久居住两类，永久居民方可任职务、参加灵地争夺。大岛长途交易资格仅十户，每三年由各户聘修仙者斗法挑战，胜出门户获得下一轮资格。","first_ch":366,"rules":["定居须本地大户作保","资格三年一斗"],"limits":["无保人者灵脉资格受限"]},{"id":"c_xuelianshenguang","kind":"technique","name":"血炼神光","desc":"越皇所修魔功，威力强大，韩立取出供曲魂筑基后修炼；结丹之后没有后继法诀，无法再更上一层。","first_ch":374,"rules":["魔功","威力强大"],"limits":["结丹后无后继法诀"]},{"id":"c_liudun_shuibo_dazhen","kind":"technique","name":"六遁水波大阵","desc":"六连殿为围猎六级妖兽所布大阵，由六名假丹修士各守一座阵门主持，以两丈长蓝色大旗为阵旗，可困敌于海面。","first_ch":377,"rules":["六名假丹修士守阵门","蓝色大旗为阵旗"],"limits":["需预先操演纯熟"]},{"id":"c_kuxingdao_lingdi_rule","kind":"organization_rule","name":"魁星岛灵地规矩","desc":"三十六座灵气最浓山峰十年一次挑战，胜者入主；筑基期可自动领一座山峰，炼气期只能选山谷洞窟；选定孤岛须自担防护阵灵石并负护岛义务。","first_ch":371,"rules":["山峰十年挑战一次","筑基期领山峰","炼气期选洞窟山谷","选岛者自付护阵灵石"],"limits":["炼气期不得圈选山峰"]},{"id":"c_haishang_dandao","kind":"worldview","name":"乱星海丹道","desc":"乱星海高阶丹方以等阶妖兽内丹为主药，灵草退为可替换的辅料；仅炼气期低阶丹方不用妖丹，与天南以灵草为主的丹道路线不同。","first_ch":377,"rules":["高阶丹方以妖丹为主药","灵草可由其他灵药替换"],"limits":["低阶丹方仍以灵草为主"]},{"id":"c_bishui_qingjia_zhen","kind":"technique","name":"碧水青甲阵","desc":"韩立随身阵具之一，以阵旗阵盘布设，威力不及颠倒五行阵与六遁水波大阵，但强于普通阵法，布设简单。","first_ch":380,"rules":["礁石为中心数十丈范围","阵旗阵盘成套"],"limits":["威力普通"]},{"id":"c_jiedan_process","kind":"worldview","name":"结丹过程","desc":"结丹需三到五年，因人资质长短不一；期间忌心境大喜大悲，更不能厮杀斗法，需吸纳天地灵气。服雪灵水、天火液等灵药可提高成功率，但重复服用无效。","first_ch":385,"rules":["耗时三至五年","需吸纳天地灵气","灵药辅助提高成功率"],"limits":["忌大喜大悲","忌斗法厮杀","灵药重复服用无效"]},{"id":"c_neiwai_xinghai","kind":"worldview","name":"内外星海","desc":"已探明的海域称内星海，外围未探明的海域称外星海，又称妖海，存活力敌元婴期修士的强大妖兽；上古时二者皆为妖兽天下，先辈逐步开拓出内星海。","first_ch":389,"rules":["内星海为人居开拓海域","外星海即妖海","妖海妖兽强大"],"limits":["外星海不可轻易乱闯"]},{"id":"c_xinggong_rule","kind":"organization_rule","name":"星岛任命规矩","desc":"内十二星岛由两位圣主在组织内各选六人任命；外二十四星岛每百年在天星城公开挑战选拔，胜者自动成为岛主，大会称摘星大会。","first_ch":389,"rules":["内岛圣主任命","外岛百年挑战选拔","胜者任岛主"],"limits":[]},{"id":"c_xuanyin_gong","kind":"technique","name":"玄阴功","desc":"乱星海顶尖魔功，所化玄阴魔气阴寒刺骨，乌丑所修；其气息与血炼神光近似，极阴祖师修此魔功大成即将出关。","first_ch":382,"rules":["魔功","化玄阴魔气"],"limits":[]},{"id":"c_shengshan_rules","kind":"organization_rule","name":"圣山分层规矩","desc":"圣山自下而上盘旋共八十一层：前五十层对外来修士开放，凭灵石租宅院或洞府；后三十层仅星宫大人居住；顶层圣宫为两位圣主住所，任何人不得进入。住处以百年计费，欠租即被收回。","first_ch":391,"rules":["前五十层对外开放","后三十层星宫专属","顶层圣宫禁地","百年计费欠租收回"],"limits":["上层价格更贵"]},{"id":"c_chuansongzhen_rule","kind":"organization_rule","name":"传送阵规矩","desc":"天星城传送阵按次数而非人数收费，一次七百灵石，至多传送七人；登阵前由星宫制符师发传送符护身，防护效果不及大挪移令，只能使用一次。","first_ch":393,"rules":["按次收费","一次至多七人","发传送符护身"],"limits":["传送符仅一次有效"]},{"id":"c_waixinghai_hunt","kind":"worldview","name":"外星海猎妖规则","desc":"有胆量上妖兽岛的多为结丹期或筑基中后期修士；修士多相熟组队行动。曾有整岛修士聚集围猎，引来数只七级以上深海妖兽围攻，岛毁人亡，此后只许数人十几人的小团体行动。五级妖兽灵智低、法术单一，易被同级修士击杀。","first_ch":394,"rules":["组队行动","小团体为宜","五级妖兽灵智低"],"limits":["不可大量聚集修士"]},{"id":"c_nishangcao_yuyao","kind":"worldview","name":"诱妖草习性","desc":"霓裳草每百年展开一叶，展叶持续六七天并发出古怪气息，对海中多数妖兽诱惑极强，年份越久波及范围越大、越能吸引高阶妖兽；种下不满百年拔起便会丧失展叶发香的奇效。","first_ch":395,"rules":["百年一展叶","气息诱引妖兽","年份越久范围越广"],"limits":["不满百年不可拔起"]},{"id":"c_fushen_dafa","kind":"technique","name":"附身大法","desc":"极阴祖师所修魔功，可附身他人借体行事。附身之体顶多发挥本体三分之一修为，新练成的神通使用次数有限，否则附身者身躯爆毁。","first_ch":405,"rules":["附身后仅发挥三分之一修为","附身者可被看穿身份"],"limits":["神通不可连用多次","附身体有爆裂风险"]},{"id":"c_tiandu_shihuo","kind":"technique","name":"天都尸火","desc":"极阴祖师新练成的魔功，漆黑火球可化为墨蛇或乌虹，黑焰过处修士瞬间烧成飞灰，遁速极快，需极阴至寒法宝方能稍作克制。","first_ch":406,"rules":["火球可化墨蛇、乌虹","黑焰焚人成灰"],"limits":["附身之身能用次数有限","克制需至寒法宝"]},{"id":"c_jinshen_paishen","kind":"technique","name":"禁神术与禁神牌","desc":"元婴期修士方可施展的歹毒法术，以漆黑木牌为媒，逼人交出三分之一元神寄存牌中；牌上神识被灭，轻则成白痴，重则当场毙命。星宫明令元婴高人不得私用。","first_ch":406,"rules":["须交三分之一元神","施术者须元婴期"],"limits":["星宫禁令","夺人元神形同控命"]},{"id":"c_kuishui_mogong","kind":"technique","name":"葵水魔功","desc":"赤火老怪所修乱星海赫赫有名的魔功，传闻或可克制对方魔火，借乌云雷火斗法。","first_ch":403,"rules":["乌云载身、雷火相辅"],"limits":[]},{"id":"c_yuanci_shenguang","kind":"technique","name":"元磁神光","desc":"乱星海流传多年的传说功法，号称可克尽天下五行。天星双圣在海底发现一座元磁小山移回天星城修炼，却因此被困城中，每年仅能离城数日。","first_ch":408,"rules":["借元磁小山修炼","号称克制五行"],"limits":["未成大成前离城则修为大退","史上无人真正练成"]},{"id":"c_xutian_dian","kind":"worldview","name":"虚天殿","desc":"三百年浮出一次的古修士秘境，需凭虚天残图寻入。乱星海各派高人皆关注其开启，极阴祖师与隐煞门旧怨亦围绕残图而起。","first_ch":405,"rules":["三百年一现","以残图为钥"],"limits":[]},{"id":"c_miaoyinmen_rule","kind":"organization_rule","name":"妙音门规制","desc":"妙音门历代以女弟子为主，门主须由女弟子继任，门下地位最高者为左右双使，另聘两三位结丹期客卿长老作靠山；常以出色女修士结双修伴侣换取各方暗助。","first_ch":402,"rules":["门主女传","设左右双使","聘结丹客卿"],"limits":[]},{"id":"c_tianleizhu_dengji","kind":"worldview","name":"天雷竹等阶","desc":"天雷竹按灵性年份分三等：两千年以下放白色普通雷电，五千年以上转蓝色雷电，万年以上转为淡金色，称辟邪之雷，即传闻中的金雷竹，可克制各种邪法魔功。","first_ch":411,"rules":["两千年下：白雷","五千年上：蓝雷","万年上：淡金辟邪之雷"],"limits":["千年仅增高寸许，培育极慢"]},{"id":"c_honghuang_gubao","kind":"worldview","name":"洪荒古宝","desc":"古修士遗留的法宝，神通单一但威力远胜普通法宝。古时炼宝之法与材料今时不同，无法收入体内，只能随身携带着使用，这也是辨别古宝与一般法宝的唯一办法。","first_ch":419,"rules":["威力大于普通法宝","不可收入体内，须随身佩戴"],"limits":["神通相对单一"]},{"id":"c_beidou_liangyi_zhen","kind":"technique","name":"北斗两仪阵","desc":"辛如音破阵心得所载阵旗阵法，十几道阵旗按北斗阵势排列，汇集光柱射入雾阵，可引动幻阵自我震荡、爆裂散雾，用以破除外层障眼法。","first_ch":417,"rules":["阵旗列北斗阵势","汇光柱反引幻阵"],"limits":["只解外层障眼法，难破内层禁制"]},{"id":"c_fenglingzhu","kind":"worldview","name":"封灵柱","desc":"古修士用以封印附近灵气、隔绝灵气外泄的巨大法器，混十数种珍贵炼器材料铸成，一根值五六千灵石。一用于封印珍稀灵药防灵性大失，二用于镇压厉害鬼灵妖魔防其变化逃匿。","first_ch":421,"rules":["封灵药或镇妖魔","需巨力旋转三圈方可推倒"],"limits":[]},{"id":"c_zhiyang_niao","kind":"worldview","name":"脂阳鸟","desc":"诞生于精火之中、专食阴鬼厉魄的灵鸟，有名的阴物克星，早已在修仙界灭绝。画轴中只封印其一分精魂，放出的分身威力远逊本体，巨型脂阳鸟亦只是残魂所化。","first_ch":425,"rules":["精火所生","克制阴鬼厉魄"],"limits":["世间已灭绝","残魂分身威力有限"]},{"id":"c_xuanhun_lianyao_dafa","kind":"technique","name":"玄魂炼妖大法","desc":"元婴期修士才有资格修炼的密功。修成后可不受夺舍限制，以玄魂之体随意附身他人；散尽元婴转化玄魂之体后可突破普通修士寿元限制，但人不人鬼不鬼，舍弃重入轮回之机。","first_ch":427,"rules":["元婴期方可修炼","玄魂之体可随意附身"],"limits":["须散尽元婴","另有白昼行走等缺陷"]},{"id":"c_qulingshu","kind":"technique","name":"驱灵术","desc":"失传已久的邪术，可操控无灵识的骸骨尸身作为傀儡攻敌。玄骨上人以此术操纵大厅白骨傀儡，散架为骨箭激射袭杀闯入者。","first_ch":425,"rules":["操控骸骨傀儡","骨身可重组激射"],"limits":["术已失传"]},{"id":"c_xutian_dian_rule","kind":"organization_rule","name":"虚天殿试炼规矩","desc":"虚天殿每三百年自天外降落乱星海一角，持虚天残图者可入。外殿由星宫监督、禁止杀人夺宝；内殿星宫不插手，须连过三大关卡，能通过者多为元婴修士或极少数运气好者。","first_ch":435,"rules":["持残图入殿","外殿星宫监督","内殿不插手","三大关卡通关"],"limits":["殿内禁制压制法力与法宝","开启时间有限"]},{"id":"c_jiulingcan","kind":"item_grade","name":"九曲灵参","desc":"传闻中的天地灵气所化仙草，本体为灵草，灵性十足，诞生之日起即幻化成各种动物或昆虫，能自行活动、善钻土入木。对凝结元婴大有用处，得手后须按灵药秘方炼制方可充分利用。","first_ch":433,"rules":["幻化鸟兽虫豸","善钻土入木","增结婴几率"],"limits":["须按秘方炼制","捕捉需合适法器"]},{"id":"c_buaitiandan","kind":"item_grade","name":"补天丹","desc":"藏于虚天鼎内的顶级丹药，能弥补修士五行灵根缺陷，服用后易于功力大进、突破寿元限制，修仙界除此处别无他家。","first_ch":435,"rules":["弥补五行灵根","助功力突破"],"limits":["藏于虚天鼎内，极难取得"]},{"id":"c_xutianding","kind":"item_grade","name":"虚天鼎","desc":"名震乱星海的顶级秘宝，鼎内除最重要的补天丹外，还藏有数件古修士遗留的顶级蛮荒古宝。历来被正魔双方觊觎，历次开启皆无人轻易得手。","first_ch":434,"rules":["内藏补天丹与蛮荒古宝"],"limits":["外殿无法触及，须入内殿"]},{"id":"c_qiling","kind":"worldview","name":"器灵封印","desc":"每件法宝炼制以来仅有一次机会，将妖兽鬼怪的元神精魄封入法宝，对敌时精魄与法宝化形一体，拥有生前神通、大增威力。一生只能封印一次，再次封印法宝不再接受精魄；精魄越强成功率越低。","first_ch":441,"rules":["法宝一生仅封一次器灵","精魄越强成功率越低"],"limits":["封印失败即永无机会","实力太弱增幅有限"]},{"id":"c_fuling_shu","kind":"technique","name":"附灵术","desc":"修士向智慧不高的妖兽施展的秘术，附身后修为变为施术者与对象叠加的数倍，双方签下生死之约，一方魂灭另一方亦亡；完全融合后形成拥有自健身智记忆的新个体，随施展次数增多逐渐不可逆转。","first_ch":442,"rules":["修为叠加数倍","生死与共","融合成新个体"],"limits":["新个体寿元极短","死后魂魄永坠深渊、不入轮回","不可向修士施展"]},{"id":"c_bixie_shenlei","kind":"technique","name":"辟邪神雷","desc":"金雷竹飞剑所蓄雷电，专克妖魔邪法与无形鬼体，可在剑面弹射金色电弧织成光网爆裂灭敌。一次全力释放后积攒神雷耗尽，飞剑需长时间静养恢复。","first_ch":444,"rules":["金雷竹所蓄","电弧光网爆裂","克制妖鬼"],"limits":["释放后需长时间休养","残余神雷有限"]},{"id":"c_sixiang_xuanwu_zhen","kind":"technique","name":"四象玄武阵","desc":"以四面土黄小旗组成的土属性古阵法，可禁制方圆数十丈的山石泥土使之坚硬似铁，用于困住钻土入木的灵物。玄骨在阵旗上暗做手脚，反用来布置困杀韩立的圈套。","first_ch":449,"rules":["四面阵旗成阵","禁制山石泥土","土属性"],"limits":["阵旗可被做手脚"]},{"id":"c_xuanyin_dafa","kind":"technique","name":"玄阴大法","desc":"极阴祖师所修魔道功法，至高境界并不弱于托天魔功，施展时黑云滚滚、魔气大盛。此功原由玄骨传授，功法中早被留下可制其于死地的破绽。","first_ch":454,"rules":["黑云魔气护身","至高境界抗衡托天魔功"],"limits":["功法留有传授者埋下的破绽"]},{"id":"c_tuotian_mogong","kind":"technique","name":"托天魔功","desc":"蛮胡子所修魔功，号称乱星海防御第一。练至高境界时浑身生出铜钱大小的金色鳞片，坚不可毁，人形如妖神；击杀冰雪蟾取其内丹可助功法精进。","first_ch":457,"rules":["金鳞护体","防御称冠乱星海"],"limits":[]},{"id":"c_taiyang_jue","kind":"technique","name":"泰阳诀","desc":"乱星海火系功法中可挤进前十的顶阶心法，修成泰阳真火，可将敌人化为灰烬，辟火之道奇效显著。但在熔岩路禁制高温下须全力运行，法力消耗远超外界。","first_ch":460,"rules":["泰阳真火辟火攻敌"],"limits":["熔岩路禁制克制火系，须全力运转"]},{"id":"c_fenyuan_dan","kind":"item_grade","name":"分元丹","desc":"上古时期遗留的灵丹，卜绪在一只四级妖兽腹中偶然所得，服后可省去百余年苦修，助其在不足三百年内修至当前境界。","first_ch":459,"rules":["省去百余年苦修"],"limits":["上古遗留，极难寻觅"]},{"id":"c_binghuo_rule","kind":"organization_rule","name":"冰火道通行规矩","desc":"入谷即被禁制分散传送，同道之人难聚；全程不可腾空飞行，只能徒步前行。须在五日之内走到峡谷尽头传送阵，超时阵法关闭，被困者永无脱身之日；路上还要防范冰炎妖灵与同道偷袭夺宝。","first_ch":459,"rules":["不可飞行","五日通关","尽头传送阵汇合"],"limits":["超时永久困死","沿途妖灵与偷袭频发"]},{"id":"c_gelou_qubao","kind":"organization_rule","name":"阁楼取宝规矩","desc":"石殿四条通道中三条分别通向古宝、丹药、功法阁楼，宝物皆有禁制封印；每人只有一次取一件的机会，到手即被传送到下一关极妙幻境；第四条直通下一关。通道处所不固定，入内即无法原路退出。","first_ch":467,"rules":["三阁楼各藏一类宝物","一人限取一件","到手即刻传送"],"limits":["不可原路退回","不取宝可滞留后自动传出"]},{"id":"c_xinggong_jinzhi","kind":"worldview","name":"星宫禁制操控","desc":"星宫长老可操纵虚天殿部分小禁制。本次上代星宫之主留下的黑沙漠（铁火蚁）与血冰林（银光鼠）禁制被主动放出，以大量杀伤正魔结丹修士、强硬压制两道，撑过两位圣主闭关期。","first_ch":465,"rules":["星宫可殿内禁制","以削弱两道为目的"],"limits":["只能操纵部分小禁制"]},{"id":"c_kongjin_jieli","kind":"technique","name":"空间禁制隔绝臆想","desc":"辛如音在典籍中提出的理论臆想：设法将自身灵力与空间中一切能量暂时斩断联系，可让空间传送禁制片刻失效；常人无法断绝与天地灵气的联系。韩立借噬金虫吞纳天地能量之能，曾短暂成功。","first_ch":470,"rules":["斩断自身与灵气联系","可短暂豁免传送禁制"],"limits":["仅能维持极短瞬间","须借噬金虫吞纳之能"]},{"id":"c_neidian_shishi_rule","kind":"organization_rule","name":"内殿石室取宝规矩","desc":"内殿迷宫石门后各藏一间石室，每人只能凭手中虚天残图打开一扇；一旦进去，无论取宝成功与否都无法出来，取到宝物者会被直接传送出虚天殿。结丹期修士只能在一层取宝，二层以上与自杀无异。","first_ch":475,"rules":["凭虚天残图开门","一人限开一门","取宝即传送出殿"],"limits":["二层以上结丹修士难以生还"]},{"id":"c_tiangang_zhao","kind":"worldview","name":"天罡罩禁制","desc":"上古时期便大大有名的白色光罩禁制，连台阶一同罩住高台；除台阶处特别开辟的出口外，其他地方绝无法在短时间内通过。","first_ch":477,"rules":["唯一出口在台阶","其余处无法短时突破"],"limits":[]},{"id":"c_qianlan_bingyan","kind":"worldview","name":"乾蓝冰焰","desc":"洞底火焰形态的刺目蓝光，至阴至寒之火，并非本界应有之物。不要说结丹修士，元婴已成的老家伙也不敢沾染一丝；被寒焰烧到一点，连元婴都会被轻易炼化。金丝蚕金丝、血玉蜘蛛蛛丝、火蟒等特殊存在无法被其烧毁。","first_ch":480,"rules":["火焰形态却散奇寒","可炼化元婴"],"limits":["金丝、蛛丝、火蟒等特殊存在不惧"]},{"id":"c_bianyi_lingshou","kind":"worldview","name":"变异灵兽与异化之术","desc":"灵兽进阶时发生独一无二的突变即成变异灵兽，能力独特厉害，如将法器法宝化为石头的异化之术；万中无一，只发生在四级以上高阶灵兽身上。","first_ch":482,"rules":["进阶时随机突变","每只独一无二","异化可化石器法宝"],"limits":["变异好坏不一","千余年方出一只有用者"]},{"id":"c_tianluo_zhenlei","kind":"technique","name":"天罗真雷","desc":"万法门门主自损法力修炼的神雷，雷丸可直接伤害修士元婴；可真假两式示人，真正神雷不轻用，遇吸雷珠类晶石可被吸纳大半威力。","first_ch":484,"rules":["自损法力凝练","可伤元婴","雷丸爆裂化紫色光团"],"limits":["真雷耗费巨大","遇吸雷珠威力大减"]},{"id":"c_yuanying_chuqiao","kind":"worldview","name":"元婴出窍","desc":"元婴期修士可令元婴离体，持宝瞬移御剑，速度大损本命元气；若肉身被毁，中期元婴无所依附便化为青烟，故元婴离体是大忌。","first_ch":487,"rules":["元婴可离体御剑瞬移","肉身是元婴依托"],"limits":["大损本命元气","肉身被毁中期元婴即散"]},{"id":"c_xuluo_shenhuo","kind":"technique","name":"修罗圣火","desc":"乾蓝冰焰、玄魂阴火与辟邪神雷三力强行融合而成的鬼道圣火，灰白色火焰无物不燃，号称可困杀元婴修士。未真正炼化便强行操控，核心爆裂后极易失控反噬施术者。","first_ch":492,"rules":["三力融合","灰白火焰","克制鬼道以外修士"],"limits":["短时间强合有反噬风险","未炼化者操控不住"]},{"id":"c_nixing_rule","kind":"organization_rule","name":"逆星盟与星宫对峙规矩","   function maxChapter(data) {

  function readCutoff(data) {
    const max = maxChapter(data);

    try { value = localStorage.getItem(titleKey(data)); } catch (e) {}
    const q = new URLSearchParams(location.search).get('cutoff');
    if (q !== null && q !== '') value = Number(q);
    value = Number(value);
    if (!Number.isFinite(value) || value <= 0) value = max;
    return Math.max(1, Math.min(Math.round(value), max));

      return x;
