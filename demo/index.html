    drawAtlasWaterPoly(ctx, atlasChaikin(reg.polygon, 3), rect, {
      top: 0.12, mid: 0.27, bottom: 0.36,
      coast: 0.48,
      texture: ATLAS.seaTexture === true
    });
  }
  function drawAtlasVoid(ctx, reg, rect) {
    if (!reg.polygon) return;
    const pts = atlasChaikin(reg.polygon, 2).map(p => atlasWorldScreen(p));
    ctx.save();
    atlasPath(ctx, pts);
    ctx.fillStyle = 'rgba(243,236,221,0.62)';
    ctx.shadowColor = 'rgba(90,70,40,0.20)';
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(201,185,143,0.80)';
    ctx.lineWidth = 1.3;
    ctx.setLineDash([7, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(59,51,42,0.20)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function drawAtlasRidgeFallback(ctx, ridge) {
    const pts = smoothWorldPoints(ridge.points).map(p => atlasWorldScreen(p));
    if (pts.length < 2) return;
    const z = mapZoomScale();
    ctx.save();
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.22);
    ctx.lineWidth = 7 * z;
    ctx.lineJoin = 'round';
    drawPolyline(ctx, pts);
    ctx.stroke();
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.55);
    ctx.lineWidth = Math.max(1.2, (ridge.width || 1.8) * 0.9) * z;
    drawPolyline(ctx, pts);
    ctx.stroke();
    ctx.restore();
  }
  function smoothWorldPoints(points) {
    const raw = (points || []).map(p => ({ x: p[0], y: p[1] }));
    return atlasSmoothPoints(raw, 10);
  }
  function drawAtlasStamp(ctx, spec, rect, nodesById) {
    const asset = ATLAS_STAMP_BY_ID[spec.asset];
    if (!asset) return false;
    const img = mapAsset(asset.src);
    let cx = atlasNum(spec.x, 50), cy = atlasNum(spec.y, 50);
    let node = null;
    if (spec.attach) {
      if (!nodesById || !nodesById.has(spec.attach)) return false;
      node = nodesById.get(spec.attach);
      if (node.layer && map2dLayer !== 'all' && node.layer !== map2dLayer) return false;
      cx = node.x;
      cy = node.y + atlasNum(spec.offsetY, 0);
    } else if (spec.layer && map2dLayer !== 'all' && spec.layer !== map2dLayer) {
      return false;
    }
    const defaults = { terrain: 14, water: 10, architecture: 8, vegetation: 6 };
    const wWorld = atlasNum(spec.w, defaults[asset.type] || 8);
    const p = atlasWorldScreen([cx, cy]);
    const x = p.x;
    const y = p.y;
    if (!img.complete || !img.naturalWidth) {
      img.onload = () => { if (curView === 'map') drawMap(); };
      return false;
    }
    const w = wWorld / 100 * rect.width * mapZoomScale();
    const h = w * img.naturalHeight / img.naturalWidth;
    const pivot = spec.anchor === 'center' ? [0.5, 0.5] : (asset.pivot || [0.5, 0.875]);
    ctx.save();
    ctx.translate(x, y);
    if (spec.rotation) ctx.rotate(spec.rotation * Math.PI / 180);
    if (spec.flip) ctx.scale(-1, 1);
    ctx.globalAlpha = atlasNum(spec.opacity, 0.86);
    ctx.drawImage(img, -w * pivot[0], -h * pivot[1], w, h);
    ctx.restore();
    if (node && asset.type === 'architecture') {
      node._markerDy = Math.max(node._markerDy || 0, atlasNum(spec.markerOffset, 2.0));
    }
    return true;
  }
  function drawAtlasStamps(ctx, rect) {
    const list = Array.isArray(ATLAS.stamps) ? ATLAS.stamps.slice() : [];
    const nodesById = new Map((mapModel.nodes || []).map(n => [n.id, n]));
    list.sort((a, b) => atlasNum(a.order, 0) - atlasNum(b.order, 0));
    let drawn = 0;
    list.forEach(s => { if (drawAtlasStamp(ctx, s, rect, nodesById)) drawn++; });
    return drawn;
  }

  function drawAtlasTerrain(ctx, rect) {
    const terrain = mapModel.terrain || {};
    const nodesById = new Map((mapModel.nodes || []).map(n => [n.id, n]));
    const visibleRegions = new Set((mapModel.regions || []).map(r => r.id));
    const featureVisible = f => !f.region || visibleRegions.has(f.region);

    // 山脊：默认直接使用手绘 PNG ridge；无图时退回代码墨线
    (terrain.ridges || []).filter(featureVisible).forEach((ridge, i) => {
      const pts = ridge.points || [];
      if (ATLAS.terrainStamps !== false && pts.length >= 2) {
        const b = atlasBBox(pts);
        const ridgeId = (i % 2 && ATLAS_STAMP_BY_ID.terrain_ridge_02) ? 'terrain_ridge_02' : 'terrain_ridge_01';
        const w = Math.max(8, Math.min(24, b.w * 1.35 + 5));
        drawAtlasStamp(ctx, {
          asset: ridgeId, x: b.x + b.w / 2, y: Math.min(96, b.y + b.h + 1.5),
          w, opacity: 0.62
        }, rect, nodesById);
      } else {
        drawAtlasRidgeFallback(ctx, ridge);
      }
    });

    // 河流：双线水脉，不用固定 PNG
    (terrain.rivers || []).filter(featureVisible).forEach(r => {
      const pts = smoothWorldPoints(r.points).map(p => atlasWorldScreen(p));
      if (pts.length < 2) return;
      const z = mapZoomScale();
      const w = Math.max(1.2, (r.width || 1) * rect.width / 100 * 0.55) * z;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.water, 0.22);
      ctx.lineWidth = w * 3.2;
      drawPolyline(ctx, pts); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.water, 0.62);
      ctx.lineWidth = w;
      drawPolyline(ctx, pts); ctx.stroke();
      ctx.strokeStyle = 'rgba(245,247,242,0.45)';
      ctx.lineWidth = Math.max(0.7, w * 0.35);
      drawPolyline(ctx, pts); ctx.stroke();
      ctx.restore();
    });

    (terrain.lakes || []).filter(featureVisible).forEach(lake => {
      drawAtlasWaterPoly(ctx, atlasChaikin(lake.polygon, 2), rect, {
        top: 0.18, mid: 0.34, bottom: 0.38, coast: 0.32, texture: false
      });
    });

    (terrain.islets || []).filter(() => map2dLayer === 'all' || !mapModel.regions.length || (mapModel.regions || []).some(r => r.shape === 'sea')).forEach(islet => {
      const p = atlasWorldScreen([islet.x, islet.y]);
      const x = p.x, y = p.y;
      const r = Math.max(2.5, (islet.r || 1.2) / 100 * rect.width) * mapZoomScale();
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.35, r * 0.78, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,220,197,0.86)';
      ctx.shadowColor = 'rgba(90,70,40,0.22)';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.32);
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.45, y - r * 0.12);
      ctx.lineTo(x, y - r * 0.62);
      ctx.lineTo(x + r * 0.38, y - r * 0.08);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.26);
      ctx.stroke();
      ctx.restore();
    });
  }



/* Novel Atlas viewer · 地图路线、标记、文字与装饰
   职责：路线 / 图标 / 地名 / 题签 / 印章 / 免责声明 */
  function drawAtlasRoutes(ctx, rect) {
    const nodesById = new Map((mapModel.nodes || []).map(n => [n.id, n]));
    const seaPolys = (mapModel.regions || []).filter(r => r.shape === 'sea' && r.polygon).map(r => r.polygon);
    const labels = [];
    (mapModel.routes || []).forEach(route => {
      const a = nodesById.get(route.s), b = nodesById.get(route.t);
      if (!a || !b) return;
      const world = [{ x: a.x, y: a.y }]
        .concat((route.curve || []).map(p => ({ x: p[0], y: p[1] })))
        .concat([{ x: b.x, y: b.y }]);
      const pts = atlasSmoothPoints(world, 14).map(p => atlasWorldScreen([p.x, p.y]));
      if (pts.length < 2) return;
      const sea = route.tone === 'sea' || seaPolys.some(poly =>
        atlasPointInPoly({ x: a.x, y: a.y }, poly) ||
        atlasPointInPoly({ x: b.x, y: b.y }, poly));
      const isRiver = route.kind === 'river';
      const solid = route.kind === 'road' || isRiver;
      const color = isRiver ? ATLAS_THEME.water : (sea ? '#6F8B93' : ATLAS_THEME.route);
      const alpha = sea ? 0.82 : 0.88;
      const z = mapZoomScale();
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = atlasRgba(color, alpha);
      ctx.lineWidth = (isRiver ? 1.5 : (sea ? 2.1 : 1.9)) * z;
      ctx.setLineDash(solid ? [] : [7 * z, 5 * z]);
      drawPolyline(ctx, pts);
      ctx.stroke();
      ctx.setLineDash([]);
      // 端点：小墨点，避免“无头线段”
      if (!isRiver) {
        [pts[0], pts[pts.length - 1]].forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.4 * z, 0, Math.PI * 2);
          ctx.fillStyle = atlasRgba(color, 0.58); ctx.fill();
          ctx.strokeStyle = atlasRgba(ATLAS_THEME.paper, 0.7); ctx.lineWidth = 0.8 * z; ctx.stroke();
        });
      }
      if (!solid) {
        const tip = pts[pts.length - 1], from = pts[Math.max(0, pts.length - 8)];
        atlasArrow(ctx, tip, from, atlasRgba(color, 0.92), z);
      }
      ctx.restore();
      if (route.label) {
        const idx = Math.max(0, Math.floor(pts.length * 0.56));
        const p = pts[idx];
        const labelFont = 11 * mapLabelScale();
        ctx.save();
        ctx.font = `${labelFont}px -apple-system,"PingFang SC",sans-serif`;
        const tw = ctx.measureText(route.label).width;
        ctx.restore();
        labels.push({
          kind: 'route', text: route.label, x: p.x, y: p.y - labelFont * 0.8,
          w: tw + 8, h: labelFont * 1.45, priority: 3, color: sea ? '#627E86' : '#7A3B2E', font: labelFont
        });
      }
    });
    return labels;
  }

  function drawAtlasMarker(ctx, type, cx, cy, size, highlighted) {
    if (type === 'none') return;
    const u = size / 100;
    if (!u) return;
    const px = v => v / u;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(u, u);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (highlighted) {
      ctx.beginPath(); ctx.arc(50, 50, 48, 0, Math.PI * 2);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.seal, 0.75); ctx.lineWidth = px(2.2); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(50, 50, 44, 0, Math.PI * 2);
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.34); ctx.lineWidth = px(0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(50, 50, 40, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,220,197,0.20)'; ctx.fill();

    if (type === 'city') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.86); ctx.lineWidth = px(1.1);
      ctx.beginPath();
      ctx.moveTo(27, 64); ctx.lineTo(27, 50); ctx.lineTo(32, 50); ctx.lineTo(32, 46);
      ctx.lineTo(38, 46); ctx.lineTo(38, 50); ctx.lineTo(44, 50); ctx.lineTo(44, 46);
      ctx.lineTo(50, 46); ctx.lineTo(50, 50); ctx.lineTo(56, 50); ctx.lineTo(56, 46);
      ctx.lineTo(62, 46); ctx.lineTo(62, 50); ctx.lineTo(68, 50); ctx.lineTo(68, 64);
      ctx.closePath(); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.50); ctx.lineWidth = px(0.8);
      ctx.beginPath(); ctx.moveTo(27, 57); ctx.lineTo(68, 57); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(46, 64); ctx.lineTo(46, 58); ctx.lineTo(48, 55.5);
      ctx.lineTo(50, 54.5); ctx.lineTo(52.5, 55.5); ctx.lineTo(54, 58); ctx.lineTo(54, 64);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.84); ctx.lineWidth = px(1); ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 60, 2.2, Math.PI, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.accent, 0.55); ctx.fill();
    } else if (type === 'sect') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.84); ctx.lineWidth = px(1.2);
      ctx.beginPath();
      ctx.moveTo(29, 49); ctx.quadraticCurveTo(50, 36, 71, 49); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.68); ctx.lineWidth = px(1);
      ctx.beginPath(); ctx.moveTo(27, 51); ctx.quadraticCurveTo(50, 40, 73, 51); ctx.stroke();
      ctx.lineWidth = px(1.1);
      ctx.beginPath();
      ctx.moveTo(40, 51); ctx.lineTo(40, 67); ctx.moveTo(60, 51); ctx.lineTo(60, 67);
      ctx.moveTo(36, 67); ctx.lineTo(64, 67); ctx.stroke();
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.accent, 0.68);
      ctx.beginPath();
      ctx.moveTo(46, 67); ctx.lineTo(46, 59); ctx.lineTo(48, 56);
      ctx.lineTo(50, 55); ctx.lineTo(52, 56); ctx.lineTo(54, 59); ctx.lineTo(54, 67);
      ctx.stroke();
    } else if (type === 'secret') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.72); ctx.lineWidth = px(1.25);
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 5; a += 0.22) {
        const r = 4.5 + a * 1.45;
        const x = 50 + Math.cos(a) * r, y = 50 + Math.sin(a) * r;
        if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 50, 2.1, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.seal, 0.78); ctx.fill();
      ctx.beginPath(); ctx.arc(66, 34, 1.7, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.accent, 0.55); ctx.fill();
    } else if (type === 'danger') {
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.seal, 0.86); ctx.lineWidth = px(1.3);
      ctx.beginPath(); ctx.moveTo(50, 26); ctx.lineTo(74, 68); ctx.lineTo(26, 68); ctx.closePath(); ctx.stroke();
      ctx.lineWidth = px(1.2);
      ctx.beginPath(); ctx.moveTo(50, 43); ctx.lineTo(50, 56); ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 61, 1.8, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.seal, 0.86); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(50, 50, 11, 0, Math.PI * 2);
      ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.52); ctx.lineWidth = px(1); ctx.stroke();
      ctx.beginPath(); ctx.arc(50, 50, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = atlasRgba(ATLAS_THEME.ink, 0.62); ctx.fill();
    }
    ctx.restore();
  }

  function drawAtlasRegionLabel(ctx, box, text, fontPx) {
    ctx.save();
    ctx.font = `600 ${fontPx}px "Songti SC","SimSun",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, fontPx * 0.12);
    ctx.strokeStyle = 'rgba(243,236,221,0.88)';
    ctx.strokeText(text, box.x + box.w / 2, box.y + box.h / 2);
    ctx.fillStyle = ATLAS_THEME.ink;
    ctx.fillText(text, box.x + box.w / 2, box.y + box.h / 2);
    ctx.restore();
  }
  function drawAtlasNodeLabel(ctx, cand) {
    ctx.save();
    ctx.font = `${cand.rank === 1 ? '600 ' : ''}${cand.font}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3.2, cand.font * 0.22);
    ctx.strokeStyle = 'rgba(243,236,221,0.94)';
    ctx.strokeText(cand.text, cand.x, cand.y);
    ctx.fillStyle = cand.color || '#2B2A26';
    ctx.fillText(cand.text, cand.x, cand.y);
    ctx.restore();
  }

  function drawAtlasCompass(ctx, cx, cy, size, opacity) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(size / 100, size / 100);
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = ATLAS_THEME.ink;
    ctx.fillStyle = ATLAS_THEME.ink;
    [[46, 0.36, 1.8], [40, 0.46, 1.2], [31, 0.34, 1]].forEach(([r, a, w]) => {
      ctx.beginPath(); ctx.arc(50, 50, r, 0, Math.PI * 2);
      ctx.globalAlpha = opacity * a; ctx.lineWidth = w; ctx.stroke();
    });
    ctx.globalAlpha = opacity;
    for (let i = 0; i < 24; i++) {
      const a = i * Math.PI / 12;
      const r1 = 18.5, r2 = 11;
      ctx.beginPath();
      ctx.moveTo(50 + Math.cos(a) * r1, 50 + Math.sin(a) * r1);
      ctx.lineTo(50 + Math.cos(a) * r2, 50 + Math.sin(a) * r2);
      ctx.globalAlpha = opacity * (i % 6 === 0 ? 0.55 : 0.32);
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }
    ctx.globalAlpha = opacity;
    ctx.beginPath();
    ctx.moveTo(50, 50); ctx.lineTo(46.3, 26); ctx.lineTo(50, 18); ctx.lineTo(53.7, 26); ctx.closePath();
    ctx.fillStyle = atlasRgba(ATLAS_THEME.seal, 0.62); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(50, 50); ctx.lineTo(46.3, 74); ctx.lineTo(50, 82); ctx.lineTo(53.7, 74); ctx.closePath();
    ctx.fillStyle = atlasRgba(ATLAS_THEME.ink, 0.48); ctx.fill();
    ctx.beginPath(); ctx.arc(50, 50, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = atlasRgba(ATLAS_THEME.ink, 0.75); ctx.fill();
    ctx.restore();
  }

  function atlasTitleSpec() {
    const def = atlasDefaultTitle();
    const base = Object.assign({ x: 4.2, y: 8.8, size: 3.1, direction: 'vertical' }, ATLAS.title || {});
    const byLayer = (map2dLayer !== 'all' && ATLAS.titleByLayer) ? ATLAS.titleByLayer[map2dLayer] : null;
    const spec = Object.assign({}, base, byLayer || {});
    if (!spec.text) spec.text = def.text;
    return spec;
  }

  function atlasTitleBox(ctx, rect) {
    const spec = atlasTitleSpec();
    const fs = Math.max(11, Math.min((atlasNum(spec.size, 3.1) / 100) * rect.width, rect.height * 0.053));
    const text = spec.text || '山河舆图';
    const chars = Array.from(text);
    const vertical = spec.direction !== 'horizontal';
    const lineH = fs * 1.04;
    let w = fs * 1.65, h = chars.length * lineH + fs * 0.85;
    if (!vertical) {
      ctx.save();
      ctx.font = `600 ${fs}px "Songti SC","SimSun",serif`;
      w = ctx.measureText(text).width + fs * 1.7;
      h = fs * 1.65;
      ctx.restore();
    }
    let x = (atlasNum(spec.x, 4.2) / 100) * rect.width;
    let y = (atlasNum(spec.y, 8.8) / 100) * rect.height;
    // 左上角云纹的安全区：题签不压在纸底装饰上
    const cornerW = rect.width * 0.105, cornerH = rect.height * 0.18;
    if (x < cornerW && y < cornerH) y = cornerH + 4;
    return { x, y, w, h };
  }

  function drawAtlasCartouche(ctx, rect, spec) {
    const fs = Math.max(11, Math.min((atlasNum(spec.size, 3.1) / 100) * rect.width, rect.height * 0.053));
    const text = spec.text || '山河舆图';
    const chars = Array.from(text);
    const vertical = spec.direction !== 'horizontal';
    const lineH = fs * 1.04;
    let w = fs * 1.65, h = chars.length * lineH + fs * 0.85;
    if (!vertical) {
      ctx.save();
      ctx.font = `600 ${fs}px "Songti SC","SimSun",serif`;
      w = ctx.measureText(text).width + fs * 1.7;
      h = fs * 1.65;
      ctx.restore();
    }
    const x = (atlasNum(spec.x, 4.2) / 100) * rect.width;
    const y = (atlasNum(spec.y, 9) / 100) * rect.height;
    ctx.save();
    ctx.fillStyle = 'rgba(244,237,223,0.72)';
    ctx.shadowColor = 'rgba(90,70,40,0.12)';
    ctx.shadowBlur = 12;
    ctx.fillRect(x, y, w, h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.60);
    ctx.lineWidth = 1.6;
    ctx.strokeRect(x + 0.8, y + 0.8, w - 1.6, h - 1.6);
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.ink, 0.34);
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9);
    ctx.strokeStyle = atlasRgba(ATLAS_THEME.accent, 0.55);
    ctx.lineWidth = 1;
    const c = Math.min(9, fs * 0.38);
    [[x + 7, y + 7, 1, 1], [x + w - 7, y + 7, -1, 1],
     [x + 7, y + h - 7, 1, -1], [x + w - 7, y + h - 7, -1, -1]].forEach(([px, py, dx, dy]) => {
      ctx.beginPath(); ctx.moveTo(px + dx * c, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * c); ctx.stroke();
    });
    ctx.fillStyle = ATLAS_THEME.ink;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${fs}px "Songti SC","SimSun",serif`;
    if (vertical) {
      chars.forEach((ch, i) => ctx.fillText(ch, x + w / 2, y + fs * 0.55 + i * lineH + fs * 0.42));
    } else {
      ctx.fillText(text, x + w / 2, y + h / 2 + 1);
    }
    ctx.restore();
    return {
      frame: { x, y, w, h },
      seal: {
        x: (atlasNum(spec.sealX, (x + w / 2) / rect.width * 100)),
        y: (atlasNum(spec.sealY, (y + h + fs * 0.72) / rect.height * 100)),
        size: atlasNum(spec.sealSize, 2.55),
        ch: spec.sealCh || chars[0] || '山',
        angle: atlasNum(spec.sealAngle, -0.035)
      }
    };
  }

  function drawAtlasSeal(ctx, rect, spec) {
    const size = Math.max(16, (atlasNum(spec.size, 2.5) / 100) * rect.width);
    const cx = (atlasNum(spec.x, 6) / 100) * rect.width;
    const cy = (atlasNum(spec.y, 28) / 100) * rect.height;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(atlasNum(spec.angle, 0));
    ctx.fillStyle = ATLAS_THEME.seal;
    ctx.globalAlpha = 0.92;
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(245,235,215,0.68)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(-size / 2 + size * 0.12, -size / 2 + size * 0.12, size * 0.76, size * 0.76);
    ctx.fillStyle = '#F5EBD7';
    ctx.font = `${Math.max(10, Math.round(size * 0.52))}px "SimSun",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(Array.from(spec.ch || '山')[0], 0, 1);
    ctx.restore();
  }

  function drawAtlasDisclaimer(ctx, rect, spec) {
    const text = spec && spec.text ? spec.text : '示意舆图 · 方位与比例非精确';
    const y = (atlasNum(spec && spec.y, 95.5) / 100) * rect.height;
    const fs = Math.max(9, Math.min(12, rect.width / 120));
    ctx.save();
    ctx.font = `${fs}px -apple-system,"PingFang SC",sans-serif`;
    const textW = ctx.measureText(text).width;
    const left = rect.width * 0.5 - (textW + fs * 2.1) / 2;
    ctx.strokeStyle = 'rgba(166,106,69,0.50)';
    ctx.lineWidth = 1;
    ctx.strokeRect(left, y - fs * 0.9, fs * 1.45, fs * 1.6);
    ctx.strokeStyle = 'rgba(166,106,69,0.28)';
    ctx.strokeRect(left + 2.2, y - fs * 0.9 + 2.2, fs * 1.45 - 4.4, fs * 1.6 - 4.4);
    ctx.fillStyle = 'rgba(141,128,112,0.88)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, left + fs * 2.1, y);
    ctx.restore();
  }

  function atlasDefaultTitle() {
    const land = (mapModel.regions || []).find(r => r.shape === 'land' && r.name);
    const base = land ? land.name.replace(/(?:大陆|大洲|之洲)$/g, '') : '山河';
    return { text: `${base}舆图`, sealCh: Array.from(base)[0] || '山' };
  }

  function drawAtlasFixedUI(ctx, rect) {
    const titleSpec = atlasTitleSpec();
    const title = drawAtlasCartouche(ctx, rect, titleSpec);
    const sealSpec = Object.assign({}, title.seal, ATLAS.seal || {});
    if (map2dLayer !== 'all' && titleSpec.sealCh) sealSpec.ch = titleSpec.sealCh;
    drawAtlasSeal(ctx, rect, sealSpec);
    if (ATLAS.compass !== false) {
      const compass = Object.assign({ x: 91.5, y: 87.5, size: 7.2, opacity: 0.46 }, ATLAS.compass || {});
      drawAtlasCompass(ctx, (compass.x / 100) * rect.width, (compass.y / 100) * rect.height,
        (compass.size / 100) * rect.width, atlasNum(compass.opacity, 0.46));
    }
    drawAtlasDisclaimer(ctx, rect, ATLAS.disclaimer);
  }

  function drawMap2dLegend(ctx, rect, markerSize) {
    // 图例改由页脚文字承担；画布内不压地图，避免挡题签/罗盘
  }



/* Novel Atlas viewer · 地图场景合成
   职责：drawMap2d 的绘制顺序 / 标签避让 / 悬停提示 */
  function drawMap2d(ctx, rect) {
    const regions = mapModel.regions || [];
    const nodes = mapModel.nodes || [];
    const regionLayerIds = new Set(regions.map(r => r.layer).filter(Boolean));
    const nodesById = new Map(nodes.map(n => [n.id, n]));
    const zoomZ = mapView.fitKx ? (mapView.kx / mapView.fitKx) : 1;
    const markerSizes = {};
    const hideMarker = n => n.rank === 3 && zoomZ < 1.32;

    // 1) 纸底 + 内框
    drawAtlasPaper(ctx, rect);

    // 地图内容统一裁到纸面内框，避免缩放时压到边框
    const framePad = Math.max(10, rect.width * 0.018);
    ctx.save();
    ctx.beginPath();
    ctx.rect(framePad, framePad, rect.width - framePad * 2, rect.height - framePad * 2);
    ctx.clip();

    // 2) 区域：陆地只留极淡水色，海/秘境是可见主体
    regions.filter(r => r.shape === 'land').forEach(r => drawAtlasLand(ctx, r, rect));
    regions.filter(r => r.shape === 'void').forEach(r => drawAtlasVoid(ctx, r, rect));
    regions.filter(r => r.shape === 'sea').forEach(r => drawAtlasSea(ctx, r, rect));

    // 3) 地形：山脊 / 河流 / 湖泊 / 岛链
    drawAtlasTerrain(ctx, rect);

    // 4) 手绘 stamp：地形之外的建筑/植被/云水
    drawAtlasStamps(ctx, rect);

    // 5) 路线：数据点列 → Catmull-Rom 平滑，不用固定 PNG
    const routeLabels = drawAtlasRoutes(ctx, rect);

    // 6) 标签候选：区域 > rank1 > 航路 > rank2 > rank3
    const candidates = [];
    const safePad = framePad + 9;
    const onStage = (x, y, pad = 16) => x >= safePad - pad && x <= rect.width - safePad + pad && y >= safePad - pad && y <= rect.height - safePad + pad;
    const titleBox = atlasTitleBox(ctx, rect);
    const uiBoxes = [{ x: titleBox.x - 10, y: titleBox.y - 10, w: titleBox.w + 20, h: titleBox.h + 20 }];
    if (ATLAS.compass !== false) {
      const comp = Object.assign({ x: 91.5, y: 87.5, size: 7.2 }, ATLAS.compass || {});
      const cs = (comp.size / 100) * rect.width;
      const cx = (comp.x / 100) * rect.width, cy = (comp.y / 100) * rect.height;
      uiBoxes.push({ x: cx - cs / 2 - 6, y: cy - cs / 2 - 6, w: cs + 12, h: cs + 12 });
    }
    const ds = ATLAS.disclaimer || {};
    const dsFs = Math.max(9, Math.min(12, rect.width / 120));
    const dsX = (atlasNum(ds.x, 1.7) / 100) * rect.width, dsY = (atlasNum(ds.y, 95.5) / 100) * rect.height;
    const dsW = (ds.text || '示意舆图 · 方位与比例非精确').length * dsFs * 1.02 + dsFs * 3;
    uiBoxes.push({ x: dsX - 4, y: dsY - dsFs * 1.1, w: dsW + 8, h: dsFs * 2.2 });
    regions.forEach(r => {
      if (!r.name) return;
      const at = r.label_at || [50, 50];
      const text = r.label || r.name;
      const font = Math.max(17, Math.min(30, rect.width * 0.022)) * mapLabelScale();
      const p = atlasWorldScreen(at);
      if (!onStage(p.x, p.y, font * 0.8)) return;
      ctx.save();
      ctx.font = `600 ${font}px "Songti SC","SimSun",serif`;
      const tw = ctx.measureText(text).width;
      ctx.restore();
      candidates.push({
        kind: 'region', text, x: p.x, y: p.y,
        w: tw + 12, h: font * 1.3, priority: 0, font
      });
    });

    const visibleNodeCount = nodes.filter(n => !n.unknown).length;
    nodes.forEach(n => {
      if (n.label === false || regionLayerIds.has(n.id)) return;
      if (n.rank === 2 && visibleNodeCount > 26 && zoomZ < 1.12) return;
      if (n.rank === 3 && zoomZ < 1.55) return;
      const s = atlasNodeScreen(n);
      const type = atlasMarkerTypeOf(n);
      const size = type === 'none' ? 10 * mapZoomScale() : atlasMarkerSizeOnScreen(n.rank || 2, rect);
      markerSizes[n.id] = size;
      if (!onStage(s.x, s.y, size)) return;
      const font = (n.rank === 1 ? Math.max(12, Math.min(15, rect.width / 105)) : Math.max(11, Math.min(13, rect.width / 125))) * mapLabelScale();
      ctx.save();
      ctx.font = `${n.rank === 1 ? '600 ' : ''}${font}px -apple-system,"PingFang SC",sans-serif`;
      const tw = ctx.measureText(n.name).width;
      ctx.restore();
      let ly = s.y + size / 2 + font * 1.1;
      if (ly + font > rect.height - 12) ly = s.y - size / 2 - font * 0.9;
      if (ly < framePad + font * 0.9 || ly > rect.height - framePad - font * 0.9) return;
      candidates.push({
        kind: 'node', id: n.id, text: n.name, x: s.x, y: ly,
        w: tw + 10, h: font * 1.35, priority: n.rank === 1 ? 1 : (n.rank === 3 ? 4 : 2),
        font, rank: n.rank
      });
    });
    routeLabels.forEach(l => { if (onStage(l.x, l.y, 12)) candidates.push(l); });

    // 标记 icon 的保留框：文字不得压住别的标记；rank3 在远景不占位
    const reserved = nodes.filter(n => !hideMarker(n) && atlasMarkerTypeOf(n) !== 'none').map(n => {
      const s = atlasNodeScreen(n);
      const size = markerSizes[n.id] || atlasMarkerSizeOnScreen(n.rank || 2, rect);
      return { id: n.id, box: { x: s.x - size / 2 - 2, y: s.y - size / 2 - 2, w: size + 4, h: size + 4 } };
    });
    const boxHit = (a, b) => !(a.x + a.w < b.x || a.x > b.x + b.w || a.y + a.h < b.y || a.y > b.y + b.h);

    candidates.sort((a, b) => a.priority - b.priority || (a.y - b.y));
    const kept = [], dropped = [];
    candidates.forEach(c => {
      const box = { x: c.x - c.w / 2, y: c.y - c.h / 2, w: c.w, h: c.h };
      const hitLabel = kept.some(k => boxHit(box, k.box));
      const hitMarker = reserved.some(r => r.id !== c.id && boxHit(box, r.box));
      const hitUI = uiBoxes.some(u => boxHit(box, u));
      if (hitLabel || hitMarker || hitUI) { dropped.push(c); return; }
      kept.push(Object.assign({}, c, { box }));
    });

    // 7) 区域名
    kept.filter(c => c.kind === 'region').forEach(c => drawAtlasRegionLabel(ctx, c.box, c.text, c.font));

    // 8) 标记
    nodes.forEach(n => {
      if (n.unknown || hideMarker(n)) { n._markerR = 0; n._hidden = true; return; }
      const s = atlasNodeScreen(n);
      const type = atlasMarkerTypeOf(n);
      n._hidden = type === 'none';
      if (type === 'none') { n._markerR = 0; return; }
      const size = markerSizes[n.id] || atlasMarkerSizeOnScreen(n.rank || 2, rect);
      if (!onStage(s.x, s.y, size)) { n._markerR = 0; n._hidden = true; return; }
      drawAtlasMarker(ctx, type, s.x, s.y, size, n === mapHoverNode || n.id === mapEditSelected);
      n._markerR = Math.max(12, size);
    });

    // 9) 节点名 / 航路名
    kept.filter(c => c.kind === 'node').forEach(c => {
      c.color = c.rank === 1 ? '#2B2A26' : '#4A4234';
      drawAtlasNodeLabel(ctx, c);
    });
    kept.filter(c => c.kind === 'route').forEach(c => {
      ctx.save();
      ctx.font = `${c.font}px -apple-system,"PingFang SC",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, c.font * 0.18);
      ctx.strokeStyle = 'rgba(243,236,221,0.92)';
      ctx.strokeText(c.text, c.x, c.y);
      ctx.fillStyle = c.color;
      ctx.fillText(c.text, c.x, c.y);
      ctx.restore();
    });

    ctx.restore();

    // 10) 固定 UI：题签、印章、罗盘、免责小印
    drawAtlasFixedUI(ctx, rect);

    // 11) 统计与调试
    let overlapPairs = 0;
    for (let i = 0; i < kept.length; i++) for (let j = i + 1; j < kept.length; j++) {
      if (boxHit(kept[i].box, kept[j].box)) overlapPairs++;
    }
    let sx0 = 1e9, sy0 = 1e9, sx1 = -1e9, sy1 = -1e9;
    kept.forEach(b => {
      sx0 = Math.min(sx0, b.box.x); sy0 = Math.min(sy0, b.box.y);
      sx1 = Math.max(sx1, b.box.x + b.box.w); sy1 = Math.max(sy1, b.box.y + b.box.h);
    });
    const useW = rect.width > 0 && sx1 > -1e8 ? +((sx1 - sx0) / rect.width).toFixed(3) : 0;
    const useH = rect.height > 0 && sy1 > -1e8 ? +((sy1 - sy0) / rect.height).toFixed(3) : 0;
    const comp = Object.assign({ x: 91.5, y: 87.5, size: 7.2 }, ATLAS.compass || {});
    const compR = comp.size / 100 * rect.width / 2;
    let compassGap = 1e9;
    nodes.forEach(n => {
      const s = atlasNodeScreen(n);
      const size = markerSizes[n.id] || (atlasMarkerTypeOf(n) === 'none' ? 10 * mapZoomScale() : atlasMarkerSizeOnScreen(n.rank || 2, rect));
      const d = Math.hypot(s.x - comp.x / 100 * rect.width, s.y - comp.y / 100 * rect.height);
      compassGap = Math.min(compassGap, d - compR - size / 2);
    });
    mapModel._stats = {
      overlapPairs,
      textTotal: candidates.length,
      textKept: kept.length,
      textDropped: dropped.length,
      keptLabels: kept.length,
      droppedLabels: dropped.length,
      iconSizes: { marker: markerSizes[nodes[0] && nodes[0].id] || 24, rank1: atlasMarkerSizeOnScreen(1, rect), rank2: atlasMarkerSizeOnScreen(2, rect), rank3: atlasMarkerSizeOnScreen(3, rect) },
      inlineImages: 23,
      atlasRasterCount: 21,
      vectorComponents: 9,
      baseLayout: 'atlas-cover',
      regionVisible: kept.filter(b => b.kind === 'region').length,
      compassBadgeMinGapPx: Math.round(compassGap),
      nodeCount: nodes.length,
      zoomZ: +zoomZ.toFixed(2),
      fitKx: +(mapView.fitKx || 0).toFixed(2),
      kx: +(mapView.kx || 0).toFixed(2),
      screenUse: { w: useW, h: useH },
      canvas: { w: Math.round(rect.width), h: Math.round(rect.height) }
    };
    let statsEl = document.getElementById('mapStats');
    if (!statsEl) {
      statsEl = document.createElement('div');
      statsEl.id = 'mapStats'; statsEl.hidden = true;
      document.body.appendChild(statsEl);
    }
    statsEl.textContent = JSON.stringify(mapModel._stats);

    // 12) 悬停提示
    if (mapHoverEdge) {
      const r = mapHoverEdge.ref;
      const ch = (r.evidence && r.evidence.ch) || r.first_ch || '—';
      drawMapTooltip(ctx, `${SPATIAL_KIND_CN[r.kind] || r.kind} · ${r.value || ''} · 第 ${ch} 章`);
    } else if (mapHoverNode) {
      const n = mapHoverNode;
      const badge = n.evidence ? '有原文方位证据' : '近似摆放';
      drawMapTooltip(ctx, `${n.name} · ${badge}`);
    }
  }


/* Novel Atlas viewer · 地图交互与编排器
   职责：命中 / 图层 / 时间切片 / 编排面板 / 缩放拖拽 */

  function drawMapTooltip(ctx, text) {
    const stage = document.getElementById('mapStage');
    if (!stage) return;
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    const tw = ctx.measureText(text).width;
    const bw = tw + 20, bh = 24;
    let left = mapPointer.x + 13, top = mapPointer.y - 32;
    if (left + bw > stage.clientWidth - 6) left = mapPointer.x - bw - 13;
    if (top < 6) top = mapPointer.y + 14;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(left, top, bw, bh, 5);
    else ctx.rect(left, top, bw, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    ctx.fill();
    ctx.strokeStyle = '#E3DFD5';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#2B2A26';
    ctx.textAlign = 'left';
    ctx.fillText(text, left + 10, top + 16);
  }

  function mapPickNode(px, py) {
    if (mapModel.map2d) {
      let best = null, bd = 1e9;
      mapModel.nodes.forEach(n => {
        if (n.unknown || n._hidden || atlasMarkerTypeOf(n) === 'none') return;
        const s = atlasNodeScreen(n);
        const rad = Math.max(12, n._markerR || 12);
        const d = Math.hypot(px - s.x, py - s.y);
        if (d < rad && d < bd) { bd = d; best = n; }
      });
      return best;
    }
    const kx = mapView.kx || mapView.k, ky = mapView.ky || mapView.k;
    const p = { x: (px - mapView.x) / kx, y: (py - mapView.y) / ky };
    let best = null, bd = Infinity;
    mapModel.nodes.forEach(n => {
      if (n.unknown) return;
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < n.r + 5 && d < bd) { bd = d; best = n; }
    });
    return best;
  }
  function mapPickEdge(px, py) {
    let best = null, bd = 6;
    mapModel.edges.forEach(e => {
      const a = mapModel.nodes.find(n => n.id === e.s);
      const b = mapModel.nodes.find(n => n.id === e.t);
      if (!a || !b) return;
      const sa = mToScreen(a), sb = mToScreen(b);
      const vx = sb.x - sa.x, vy = sb.y - sa.y;
      const len2 = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((px - sa.x) * vx + (py - sa.y) * vy) / len2));
      const qx = sa.x + vx * t, qy = sa.y + vy * t;
      const d = Math.hypot(px - qx, py - qy);
      if (d < bd) { bd = d; best = e; }
    });
    return best;
  }

  /* ---------- 点位详情（复用右侧面板，补父级路径/子地点/空间关系） ---------- */
  function openMapPlace(id) {
    const p = placeById.get(id);
    if (!p) return;
    const path = placePath(p);
    const kids = placeChildren.get(id) || [];
    const rels = SPATIAL.filter(r => r.s === id || r.t === id);
    let coordNote = '', badgeNote = '', sourceNote = '层级拓扑，无坐标';
    if (mapMode === 'm2' && mapModel && !mapModel.fallback) {
      const n = mapModel.nodes.find(x => x.id === id);
      if (n) coordNote = n.unknown ? '方位未知（无方向/距离证据）'
        : `示意坐标（非真实经纬度）：(${n.x.toFixed(1)}, ${n.y.toFixed(1)})`;
      sourceNote = '约束求解示意坐标（非真实经纬度）';
    } else if (mapMode === 'map2d' && mapModel && !mapModel.fallback) {
      const n = mapModel.nodes.find(x => x.id === id);
      badgeNote = n ? (n.evidence ? ' · 有原文方位证据' : ' · 近似摆放') : '';
      sourceNote = '示意布局（非经纬度，叙事导航用近似摆放）';
    }

    const relHTML = rels.length ? rels.map(r => {
      const otherId = r.s === id ? r.t : r.s;
      const other = placeById.get(otherId);
      const ch = (r.evidence && r.evidence.ch) || r.first_ch || '—';
      const quote = (r.evidence && r.evidence.quote) || '';
      return `<div class="rel-item" data-map-goto="${otherId}">
        <span class="rel-dot" style="background:${CONF_COLOR[r.confidence] || '#9A9488'}"></span>
        <span class="rel-name">${other ? escHtml(other.name) : escHtml(otherId)}</span>
        <span class="rel-label">${SPATIAL_KIND_CN[r.kind] || r.kind} · ${escHtml(r.value || '')} · ${CONF_CN[r.confidence] || r.confidence}</span>
      </div>
      <div class="geo-ev-body" style="padding:0 0 6px 22px">第 ${ch} 章 · ${escHtml(quote) || '（无原文摘录）'}</div>`;
    }).join('') : '<div class="geo-empty">没有记录在案的空间关系。</div>';

    panelBody.innerHTML = `
      <h2 class="ent-name"><span>${escHtml(p.name)}</span></h2>
      <div class="ent-meta">地点 · 第 ${p.first_ch || '—'} 章首现${coordNote ? ` · ${escHtml(coordNote)}` : ''}${badgeNote}</div>
      <div class="chips">
        <span class="chip">${path.length} 级层级</span>
        <span class="chip">${kids.length} 个下级地点</span>
      </div>
      <div class="sec-title">坐标来源</div>
      <div class="attrs">${escHtml(sourceNote)}</div>
      <p class="ent-desc">${escHtml(p.desc || '暂无档案描述。')}</p>
      <div class="sec-title">父级路径</div>
      <div class="attrs">${path.map(x => `<button class="geo-jump" data-map-goto="${x.id}">${escHtml(x.name)}</button>`).join(' › ') || '—'}</div>
      <div class="sec-title" style="margin-top:14px">子地点</div>
      <div class="geo-chip-row">${kids.length ? kids.map(k =>
        `<button class="geo-chip" data-map-goto="${k.id}">${escHtml(k.name)} <span style="color:#9A9488">第${k.first_ch || '—'}章</span></button>`).join('')
        : '<span class="geo-empty">无下级地点记录</span>'}</div>
      <div class="sec-title" style="margin-top:14px">相关空间关系 · ${rels.length}</div>
      ${relHTML}
    `;
    panel.classList.add('open');
    animatePanelBody();
    panelBody.querySelectorAll('[data-map-goto]').forEach(el => {
      el.addEventListener('click', () => {
        const t = el.getAttribute('data-map-goto');
        if (placeById.has(t)) openMapPlace(t);
        else if (byId.has(t)) select(t, { center: true });
      });
    });
  }

  /* ---------- 渲染 ---------- */
  function map2dLayerOptions() {
    if (!MAP_LAYOUT) return [];
    const layers = []; const seen = new Set();
    const push = id => { if (id && !seen.has(id)) { seen.add(id); layers.push(id); } };
    // 先按区域声明顺序，再补节点里出现但区域没列的 layer；不写死任何书的 place id
    (MAP_LAYOUT.regions || []).forEach(r => push(r.layer));
    (MAP_LAYOUT.nodes || []).forEach(n => push(n.layer));
    return layers;
  }
  function mapSelectOptions() {
    const levels = { all: (D._mapLevels || {}).global };
    ((D._mapLevels || {}).layers || []).forEach(l => { levels[l.id] = l.level; });
    if (mapMode === 'map2d') {
      const avail = new Set(map2dLayerOptions());
      const eff = (map2dLayer === 'all' || avail.has(map2dLayer)) ? map2dLayer : 'all';
      const opts = map2dLayerOptions().map(id => [id, (placeById.get(id) || {}).name || id]);
      opts.push(['all', '全部']);
      return opts.map(([v, n]) =>
        `<option value="${v}" ${v === eff ? 'selected' : ''}>${escHtml(n)}${levels[v] ? ` · ${levels[v]}` : ''}</option>`).join('');
    }
    return mapLayerList().map(l =>
      `<option value="${l.id}" ${l.id === resolvedMapLayer() ? 'selected' : ''}>${escHtml(l.name)}（${l.count}）${l.id !== 'all' && levels[l.id] ? ` · ${levels[l.id]}` : ''}</option>`).join('');
  }
  function mapSliceOptions() {
    const slices = mapTimeSlices();
    if (!slices.length) return '';
    const eff = (mapSlice === 'all' || slices.some(s => String(s.ch) === mapSlice)) ? mapSlice : 'all';
    return `<select id="mapSliceSel" title="M4 时态切片"><option value="all" ${eff === 'all' ? 'selected' : ''}>时间切片 · 全部</option>${
      slices.map(s => `<option value="${escHtml(String(s.ch))}" ${eff === String(s.ch) ? 'selected' : ''}>第 ${escHtml(String(s.ch))} 章 · ${escHtml(s.label || '切片')}</option>`).join('')
    }</select>`;
  }
  function mapEditInspectorHtml() {
    if (!mapEditMode || mapMode !== 'map2d' || !MAP_LAYOUT) return '';
    const place = mapEditSelected ? placeById.get(mapEditSelected) : null;
    const src = mapEditSelected
      ? ((MAP_LAYOUT && MAP_LAYOUT.nodes) || []).find(n => n.place === mapEditSelected)
      : null;
    const layers = map2dLayerOptions().map(id => {
      const p = placeById.get(id);
      return `<option value="${escHtml(id)}" ${src && src.layer === id ? 'selected' : ''}>${escHtml(p ? p.name : id)}</option>`;
    }).join('');
    const assets = ATLAS_STAMPS.map(a =>
      `<option value="${escHtml(a.id)}">${escHtml(a.id)} · ${escHtml(a.type)}</option>`).join('');
    return `
      <div class="map-inspector" id="mapInspector" ${place ? '' : 'hidden'}>
        <div class="mi-head"><b>${place ? escHtml(place.name) : '未选中节点'}</b><span>拖拽改坐标</span></div>
        <label>层
          <select id="miLayer" ${place ? '' : 'disabled'}>
            <option value="">（无）</option>${layers}
          </select>
        </label>
        <label>底件
          <select id="miStamp" ${place ? '' : 'disabled'}>${assets}</select>
        </label>
        <button id="miAttach" ${place ? '' : 'disabled'}>挂到节点</button>
        <button id="miRemoveStamp" ${place ? '' : 'disabled'}>移除该节点底件</button>
        <span class="mi-tip">只写导出 JSON，不改 data.json</span>
      </div>`;
  }

  function setMapDirty(v) {
    mapDirty = v;
    const save = document.getElementById('mapEditSave');
    if (save) save.disabled = !v || mapMode !== 'map2d';
  }

  function refreshMapInspector() {
    const host = document.getElementById('mapInspector');
    if (!host) return;
    const html = mapEditInspectorHtml();
    if (!html) { host.hidden = true; return; }
    host.outerHTML = html;
    bindMapInspector();
  }

  function bindMapInspector() {
    const layerSel = document.getElementById('miLayer');
    if (!layerSel) return;
    layerSel.addEventListener('change', () => {
      const src = ((MAP_LAYOUT || {}).nodes || []).find(n => n.place === mapEditSelected);
      if (!src) return;
      src.layer = layerSel.value || null;
      setMapDirty(true);
      mapModel = computeMapModel();
      drawMap();
    });
    const attach = document.getElementById('miAttach');
    if (attach) attach.addEventListener('click', () => {
      const assetId = document.getElementById('miStamp').value;
      const asset = ATLAS_STAMP_BY_ID[assetId];
      if (!asset || !MAP_LAYOUT || !mapEditSelected) return;
      if (!MAP_LAYOUT.atlas) MAP_LAYOUT.atlas = ATLAS;
      if (!ATLAS.stamps) ATLAS.stamps = [];
      const defaults = { terrain: 14, water: 10, architecture: 8, vegetation: 6 };
      ATLAS.stamps.push({
        asset: assetId, attach: mapEditSelected, w: defaults[asset.type] || 8,
        markerOffset: asset.type === 'architecture' ? 2.2 : undefined
      });
      setMapDirty(true);
      drawMap();
    });
    const remove = document.getElementById('miRemoveStamp');
    if (remove) remove.addEventListener('click', () => {
      if (!mapEditSelected) return;
      const keep = (ATLAS.stamps || []).filter(s => s.attach !== mapEditSelected);
      ATLAS.stamps = keep;
      if (MAP_LAYOUT.atlas) MAP_LAYOUT.atlas.stamps = keep;
      setMapDirty(true);
      drawMap();
    });
  }

  function renderMap() {
    const wrap = views.map;
    if (!wrap) return;
    if (mapEditMode && !mapEditSelected && MAP_LAYOUT) {
      const first = (MAP_LAYOUT.nodes || []).find(n => placeById.has(n.place));
      mapEditSelected = first ? first.place : null;
    }
    wrap.innerHTML = `
      <div class="map-wrap">
        <div class="map-toolbar">
          <div class="map-mode">
            <button data-map-mode="map2d" class="${mapMode === 'map2d' ? 'on' : ''}">示意 2D</button>
            <button data-map-mode="m2" class="${mapMode === 'm2' ? 'on' : ''}">证据方位</button>
            <button data-map-mode="topo" class="${mapMode === 'topo' ? 'on' : ''}">拓扑</button>
          </div>
          <select id="mapLayerSel">${mapSelectOptions()}</select>
          ${mapSliceOptions()}
          <div class="map-edit">
            <button id="mapEditToggle" class="${mapEditMode ? 'on' : ''}" ${mapMode === 'map2d' && MAP_LAYOUT ? '' : 'disabled'} title="拖拽节点调整示意位置">编排</button>
            <button id="mapEditSave" ${mapDirty && mapMode === 'map2d' ? '' : 'disabled'} title="导出带节点坐标的 map_layout JSON">导出</button>
            <button id="mapEditReset" title="放弃本轮拖动，重新载入页面">重置</button>
          </div>
        </div>
        ${mapEditInspectorHtml()}
        <div class="map-note-bar" id="mapNote"></div>
        <div class="map-stage" id="mapStage">
          <canvas id="mapCanvas" class="map-canvas"></canvas>
          <div class="map-zoom" id="mapZoom">
            <button data-zoom="in" title="放大">＋</button>
            <button data-zoom="out" title="缩小">－</button>
            <button data-zoom="reset" title="适配画布">复位</button>
            <button data-zoom="one" id="mapZoomValue" class="map-zoom-value" title="当前缩放 · 点击恢复到 100%">100%</button>
            <button data-map-export="png" title="导出当前视图 PNG">PNG</button>
            <button data-map-export="svg" title="导出当前视图 SVG（位图封装，非矢量重绘）">SVG</button>
          </div>
          <div class="map-fallback" id="mapFallback" hidden></div>
          <div class="map-legend" id="mapLegend"></div>
        </div>
        <div class="map-tray" id="mapTray" hidden>
          <div class="map-tray-head" id="mapTrayHead"></div>
          <div class="map-chip-row" id="mapTrayBody"></div>
        </div>
        <div class="map-footer" id="mapFooter"></div>
      </div>`;

    wrap.querySelectorAll('[data-map-mode]').forEach(b => b.addEventListener('click', () => {
      mapMode = b.dataset.mapMode;
      if (mapMode !== 'map2d') mapEditMode = false;
      renderMap();
    }));
    const sel = document.getElementById('mapLayerSel');
    sel.addEventListener('change', () => {
      if (mapMode === 'map2d') map2dLayer = sel.value; else mapLayer = sel.value;
      renderMap();
    });
    const sliceSel = document.getElementById('mapSliceSel');
    if (sliceSel) sliceSel.addEventListener('change', () => {
      mapSlice = sliceSel.value;
      renderMap();
    });
    const editToggle = document.getElementById('mapEditToggle');
    if (editToggle) editToggle.addEventListener('click', () => {
      mapEditMode = !mapEditMode;
      if (!mapEditMode) mapEditSelected = null;
      renderMap();
    });
    const editSave = document.getElementById('mapEditSave');
    if (editSave) editSave.addEventListener('click', () => {
      const layout = (D.map_layout || {});
      const payload = {
        schema: 'novel-atlas/map-layout',
        title: D.meta.title,
        exported_at: new Date().toISOString(),
        note: '节点坐标为示意布局；可用 atlas_map.py 导入或人工合并进 data.json 的 map_layout',
        map_layout: {
          nodes: layout.nodes || [],
          regions: layout.regions || [],
          routes: layout.routes || [],
          terrain: layout.terrain || {},
          atlas: layout.atlas || {},
          time_slices: layout.time_slices || []
        }
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(D.meta.title || 'atlas').replace(/[\\/:*?"<>|]/g, '_')}-map-layout.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      mapDirty = false;
      renderMap();
    });
    const editReset = document.getElementById('mapEditReset');
    if (editReset) editReset.addEventListener('click', () => {
      if (mapDirty && !confirm('放弃本轮拖动并重新载入？')) return;
      location.reload();
    });
    bindMapInspector();
    document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
      const act = b.dataset.zoom;
      if (act === 'in') zoomBy(1.25);
      else if (act === 'out') zoomBy(0.8);
      else if (act === 'reset') { mapFit(); drawMap(); }
      else {
        if (mapModel && mapModel.map2d) {
          mapView.kx = mapView.fitKx || mapView.kx;
          mapView.ky = mapView.fitKy || mapView.ky;
          mapView.k = Math.min(mapView.kx, mapView.ky);
          mapView.x = 0; mapView.y = 0;
        } else { mapView.k = 1; mapFit(); }
        drawMap();
      }
    }));

    document.querySelectorAll('[data-map-export]').forEach(b => b.addEventListener('click', () => {
      const c = document.getElementById('mapCanvas');
      if (!c) return;
      const title = (D.meta.title || 'atlas').replace(/[\\/:*?"<>|]/g, '_');
      if (b.dataset.mapExport === 'png') {
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = `${title}-${mapMode}.png`;
        a.click();
        return;
      }
      const png = c.toDataURL('image/png');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${c.width}" height="${c.height}" viewBox="0 0 ${c.width} ${c.height}"><image href="${png}" width="${c.width}" height="${c.height}"/></svg>`;
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}-${mapMode}.svg`;
      a.click();
      URL.revokeObjectURL(a.href);
    }));

    mapModel = computeMapModel();
    if (mapMode === 'map2d' && map2dLayer !== 'all' && !map2dLayerOptions().includes(map2dLayer)) {
      map2dLayer = 'all';
      mapModel = computeMapModel();
    }
    if (mapMode === 'map2d' && mapSlice !== 'all' && !mapTimeSlices().some(s => String(s.ch) === mapSlice)) {
      mapSlice = 'all';
      mapModel = computeMapModel();
    }
    mapHoverNode = null; mapHoverEdge = null;

    const note = document.getElementById('mapNote');
    const fallback = document.getElementById('mapFallback');
    const legend = document.getElementById('mapLegend');
    const tray = document.getElementById('mapTray');
    const trayHead = document.getElementById('mapTrayHead');
    const trayBody = document.getElementById('mapTrayBody');
    const footer = document.getElementById('mapFooter');

    if (mapModel.fallback) {
      const is2d = mapMode === 'map2d';
      note.textContent = is2d
        ? `地图 ${((D._mapLevels || {}).global || 'M1')} · 示意布局，不是精确经纬度；节点位置用于叙事导航`
        : `地图 ${((D._mapLevels || {}).global || 'M1')} · 层级/拓扑关系图 · 节点位置仅用于避让`;
      fallback.hidden = false;
      fallback.innerHTML = `
        <div class="fb-card">
          <div class="fb-title">${is2d ? '未提供示意布局' : '证据不足，已回退'}</div>
          <div class="fb-body">${escHtml(mapModel.fallback.reason)}</div>
          <button id="mapFallbackBtn">切到拓扑</button>
        </div>`;
      document.getElementById('mapFallbackBtn').addEventListener('click', () => { mapMode = 'topo'; renderMap(); });
      legend.innerHTML = '';
      tray.hidden = true;
      footer.innerHTML = '<span>当前没有可用于二维定位的坐标证据；不画假坐标。</span>';
      return;
    }

    if (!mapModel.nodes.length && !(mapModel.regions && mapModel.regions.length)) {
      note.textContent = mapMode === 'map2d'
        ? '示意布局，不是精确经纬度；当前进度下没有可见地点'
        : '层级/拓扑关系图 · 当前进度下没有可见地点';
      fallback.hidden = false;
      fallback.innerHTML = '<div class="fb-card"><div class="fb-body">本层没有地点数据。</div></div>';
      legend.innerHTML = ''; tray.hidden = true; footer.innerHTML = '';
      return;
    }

    if (mapMode === 'map2d') {
      const ml = D._mapLevels || {};
      const layer = (ml.layers || []).find(x => x.id === map2dLayer);
      const slice = activeMapSlice();
      note.textContent = `地图 ${ml.global || 'M1'}${layer ? ` · ${layer.name} ${layer.level}` : ''}${slice ? ` · ${slice.label || '时态切片'}（第 ${slice.ch} 章）` : ''} · 示意布局，不是精确经纬度；节点位置用于叙事导航${mapEditMode ? ' · 编排模式：拖拽节点后导出 JSON' : ''}`;
      // 图例直接画在 canvas 上（见 drawMap2dLegend），DOM 图例留空并隐藏，避免空纸卡残留
      legend.innerHTML = '';
      legend.style.display = 'none';
      footer.innerHTML = `<span>滚轮缩放 · 右键/单指拖拽平移 · 点节点看详情${mapEditMode ? ' · 拖拽节点改位置' : ''}</span><span>地图证据等级 ${ml.global || 'M1'} · ${escHtml(ml.reason || '')}</span>`;
    } else if (mapMode === 'topo') {
      note.textContent = '层级/拓扑关系图 · 节点位置仅用于避让，不代表原文方位';
      legend.style.display = '';
      legend.innerHTML = `
        <span><i class="lg-line"></i>父子层级</span>
        <span><i class="lg-line dashed"></i>传送 / 航线等辅助边</span>
        <span><i class="dot" style="background:${PALETTE[0]}"></i>按根层着色</span>`;
      footer.innerHTML = '<span>拓扑只表达包含、传送、航线等层级关系；不画指北针、比例尺、经纬网。</span>';
    } else {
      note.textContent = '示意坐标，非真实经纬度；局部位置不可精确到里';
      legend.style.display = '';
      legend.innerHTML = `
        <span><i class="lg-line"></i>高置信 · 实线</span>
        <span><i class="lg-line dashed"></i>中置信 · 虚线</span>
        <span><i class="lg-line dotted"></i>低置信 · 点线低透明度</span>
        <span><i class="dot" style="background:#9A9488"></i>层外关联地点</span>`;
      const s = mapModel.sat;
      footer.innerHTML = `<div class="sat">
        <span>方向 ${s.direction}</span><span>距离 ${s.distance}</span><span>区域 ${s.region}</span>
      </div><span>示意坐标，非真实经纬度；局部位置不可精确到里</span>`;
    }

    // 方位未知托盘
    if (mapMode === 'm2' && mapModel.unknown.length) {
      tray.hidden = false;
      trayHead.innerHTML = `<b>方位未知区</b> · ${mapModel.unknown.length} 个节点无方向/距离证据，不进入四象限`;
      trayBody.innerHTML = mapModel.unknown.map(n =>
        `<button class="map-chip" data-map-goto="${n.id}">${escHtml(n.name)}</button>`).join('');
      trayBody.querySelectorAll('[data-map-goto]').forEach(el => {
        el.addEventListener('click', () => openMapPlace(el.dataset.mapGoto));
      });
    } else {
      tray.hidden = true;
    }

    mapBindCanvas();
    mapResize(false);
  }

  function mapResize(preserveView) {
    const canvas = document.getElementById('mapCanvas');
    const stage = document.getElementById('mapStage');
    if (!canvas || !stage) return;
    const rect = stage.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    canvas.width = rect.width * DPR;
    canvas.height = rect.height * DPR;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    const old = preserveView && mapView.vw && mapView.vh
      ? {
        kx: mapView.kx, ky: mapView.ky, x: mapView.x, y: mapView.y,
        fitKx: mapView.fitKx, fitKy: mapView.fitKy, vw: mapView.vw, vh: mapView.vh
      }
      : null;
    mapFit();
    if (old) {
      // 窗口尺寸变化时保留当前缩放层级与画布中心对应的世界坐标
      const zx = old.fitKx ? old.kx / old.fitKx : 1;
      const zy = old.fitKy ? old.ky / old.fitKy : 1;
      mapView.kx = (mapView.fitKx || 1) * zx;
      mapView.ky = (mapView.fitKy || 1) * zy;
      mapView.k = Math.min(mapView.kx, mapView.ky);
      const wx = (old.vw / 2 - old.x) / (old.kx || 1);
      const wy = (old.vh / 2 - old.y) / (old.ky || 1);
      mapView.x = rect.width / 2 - wx * mapView.kx;
      mapView.y = rect.height / 2 - wy * mapView.ky;
    }
    mapView.vw = rect.width;
    mapView.vh = rect.height;
    if (Number.isFinite(bootZoomPending) && bootZoomPending > 0) {
      const z = bootZoomPending;
      bootZoomPending = 0;
      zoomBy(z);
      return;
    }
    drawMap();
  }

  const mapPointer = { x: 0, y: 0 };
  function mapEndDrag(canvas, pointerId, clientX, clientY) {
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(pointerId); } catch (err) { /* 指针已释放 */ }
    if (curView === 'map') {
      const rect = canvas.getBoundingClientRect();
      const mx = clientX - rect.left, my = clientY - rect.top;
      mapHoverNode = mapPickNode(mx, my);
      mapHoverEdge = mapHoverNode ? null : mapPickEdge(mx, my);
      canvas.style.cursor = (mapHoverNode || mapHoverEdge) ? 'pointer' : 'grab';
    }
  }
  function mapBindCanvas() {
    const canvas = document.getElementById('mapCanvas');
    if (!canvas) return;
    canvas.onpointerdown = e => {
      const mouse = e.pointerType === 'mouse';
      // 桌面：右键拖拽平移，和常见地图/图谱操作一致；左键用于点节点或编辑态拖节点。
      // 移动端：单指拖拽平移，轻点节点打开档案。
      if (mouse && e.button !== 0 && e.button !== 2) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left, py = e.clientY - rect.top;
      mapPointer.x = px; mapPointer.y = py;
      const n = mapPickNode(px, py);
      mapPressNode = mouse && e.button === 2 ? null : n;
      mapMoved = false;
      mapLast = { x: e.clientX, y: e.clientY };
      if (mouse && e.button === 2) {
        mapDragNode = null;
        mapPanning = true;
      } else {
        mapDragNode = (mapEditMode && n) ? n : null;
        mapPanning = !mapDragNode;
      }
      canvas.classList.add('dragging');
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 老浏览器忽略 */ }
    };
    canvas.onpointermove = e => {
      if (curView !== 'map') return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      if (mapDragNode) {
        if (!mapEditMode) return;
        if (mapLast && Math.hypot(e.clientX - mapLast.x, e.clientY - mapLast.y) > 3) mapMoved = true;
        const kx = mapView.kx || mapView.k, ky = mapView.ky || mapView.k;
        const p = {
          x: (mx - mapView.x) / kx,
          y: (my - mapView.y) / ky - (mapDragNode._markerDy || 0)
        };
        mapDragNode.x = p.x; mapDragNode.y = p.y;
        const src = ((MAP_LAYOUT || {}).nodes || []).find(n => n.place === mapDragNode.id);
        if (src) { src.x = p.x; src.y = p.y; }
        mapDirty = true;
        const saveBtn = document.getElementById('mapEditSave');
        if (saveBtn) saveBtn.disabled = false;
        drawMap();
        return;
      }
      if (mapPanning && mapLast) {
        const dx = e.clientX - mapLast.x, dy = e.clientY - mapLast.y;
        if (!mapMoved && Math.hypot(dx, dy) < 3) return;
        mapMoved = true;
        mapView.x += dx;
        mapView.y += dy;
        mapLast = { x: e.clientX, y: e.clientY };
        mapPointer.x = mx; mapPointer.y = my;
        canvas.style.cursor = 'grabbing';
        drawMap();
        return;
      }
      mapPointer.x = mx; mapPointer.y = my;
      mapHoverNode = mapPickNode(mx, my);
      mapHoverEdge = mapHoverNode ? null : mapPickEdge(mx, my);
      canvas.style.cursor = (mapHoverNode || mapHoverEdge) ? 'pointer' : 'grab';
      drawMap();
    };
    canvas.onpointerup = e => {
      if (mapDragNode) {
        if (mapEditMode) {
          mapEditSelected = mapDragNode.id;
          refreshMapInspector();
          drawMap();
        } else if (!mapMoved) {
          openMapPlace(mapDragNode.id);
        }
      } else if (mapPanning && !mapMoved && mapPressNode) {
        openMapPlace(mapPressNode.id);
      }
      mapDragNode = null; mapPanning = false; mapLast = null; mapPressNode = null;
      mapEndDrag(canvas, e.pointerId, e.clientX, e.clientY);
    };
    canvas.onpointercancel = e => {
      mapDragNode = null; mapPanning = false; mapLast = null; mapPressNode = null;
      mapEndDrag(canvas, e.pointerId, e.clientX, e.clientY);
    };
    canvas.oncontextmenu = e => e.preventDefault();
    canvas.onwheel = e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const kx0 = mapView.kx || mapView.k, ky0 = mapView.ky || mapView.k;
      const before = { x: (mx - mapView.x) / kx0, y: (my - mapView.y) / ky0 };
      const f = e.deltaY < 0 ? 1.1 : 0.9;
      if (mapModel.map2d) {
        mapView.kx = Math.min(6, Math.max(0.35, kx0 * f));
        mapView.ky = Math.min(6, Math.max(0.35, ky0 * f));
        mapView.k = Math.min(mapView.kx, mapView.ky);
      } else {
        mapView.k = Math.min(3, Math.max(0.35, mapView.k * f));
        mapView.kx = mapView.ky = mapView.k;
      }
      mapView.x = mx - before.x * mapView.kx;
      mapView.y = my - before.y * mapView.ky;
      drawMap();
    };
  }

  window.addEventListener('resize', () => { if (curView === 'map') mapResize(true); });

  // 调试/验收桥：只读暴露模型、统计与画布，不参与界面交互
  window.__atlasMap = {
    getModel: () => mapModel,
    getView: () => ({ ...mapView }),
    stats: () => (mapModel && mapModel._stats) || null,
    canvas: () => document.getElementById('mapCanvas'),
    set2dLayer: l => { map2dLayer = l; renderMap(); },
    setMode: m => { mapMode = m; renderMap(); }
  };



/* Novel Atlas viewer · 版图、节奏、境界与伏笔
   职责：势力版图 / 章节节奏 / 境界表 / 伏笔 */
  /* ================= 势力版图 ================= */
  let powerOnlyOwned = false;

  function powerRowsData() {
    const tops = orgEntities.filter(o => {
      const parent = o.parent ? byId.get(o.parent) : null;
      return !parent || parent.type !== 'org';
    });
    return tops.map(o => {
      const subs = orgEntities.filter(x => x.id !== o.id && orgRootOf(x).id === o.id);
      const places = PLACES.filter(p => placeOwnerInfo(p).roots.some(r => r.id === o.id));
      const conflict = new Set(), alliance = new Set();
      D.relations.forEach(r => {
        if (r.type !== 'conflict' && r.type !== 'alliance') return;
        const so = orgRootOf(byId.get(r.s)), to = orgRootOf(byId.get(r.t));
        if (!so || !to || so.id === to.id) return;
        if (so.id === o.id) (r.type === 'conflict' ? conflict : alliance).add(to.name);
        if (to.id === o.id) (r.type === 'conflict' ? conflict : alliance).add(so.name);
      });
      const firsts = [o.first_ch, ...places.map(p => p.first_ch)].filter(x => typeof x === 'number');
      const first = firsts.length ? Math.min(...firsts) : null;
      return { org: o, subs, places, conflict: [...conflict], alliance: [...alliance], first };
    }).sort((a, b) => b.places.length - a.places.length ||
      (a.first || 9999) - (b.first || 9999) || a.org.name.localeCompare(b.org.name, 'zh'));
  }

  function renderPower() {
    const scrollTop = views.power.scrollTop;
    const rows = powerRowsData();
    const topCount = rows.length;
    const withPlaces = rows.filter(r => r.places.length).length;
    const disputed = PLACES.filter(p => placeOwnerInfo(p).disputed);
    const special = PLACES.filter(p => !placeOwnerInfo(p).roots.length && placeOwnerInfo(p).special);
    const unassigned = PLACES.filter(p => !placeOwnerInfo(p).roots.length && !placeOwnerInfo(p).special);
    const relEdges = D.relations.filter(r => {
      const so = orgRootOf(byId.get(r.s)), to = orgRootOf(byId.get(r.t));
      return so && to && so.id !== to.id && (r.type === 'conflict' || r.type === 'alliance');
    });
    const relPairs = [];
    const seenRel = new Set();
    relEdges.forEach(r => {
      const so = orgRootOf(byId.get(r.s)), to = orgRootOf(byId.get(r.t));
      const key = [r.type, ...[so.id, to.id].sort()].join('|');
      if (seenRel.has(key)) return;
      seenRel.add(key);
      relPairs.push({ type: r.type, a: so.name, b: to.name });
    });
    const visibleRows = powerOnlyOwned ? rows.filter(r => r.places.length) : rows;

    const placeChip = p => {
      const info = placeOwnerInfo(p);
      const direct = info.direct && info.roots[0] && info.direct.id !== info.roots[0].id
        ? ` · ${info.direct.name}辖` : '';
      return `<button class="power-place" data-power-place="${p.id}"
        title="${escHtml(p.desc || '')}">${escHtml(p.name)}<small>第${p.first_ch || '—'}章${escHtml(direct)}${info.disputed ? ' · 交界' : ''}</small></button>`;
    };

    views.power.innerHTML = `
      <div class="power-note">
        据点由 <b>places.attrs 的所属/所属势力/势力/门派</b> 加上 <b>parent 继承</b>得出；交界只在描述明确写「交界」时列双方；没有坐标，不做地图。
      </div>
      <div class="power-metrics">
        <div class="power-metric"><div class="v">${topCount}</div><div class="k">顶层势力</div></div>
        <div class="power-metric"><div class="v">${withPlaces}</div><div class="k">有据点记录</div></div>
        <div class="power-metric"><div class="v">${PLACES.length}</div><div class="k">地点总数</div></div>
        <div class="power-metric"><div class="v" style="color:${unassigned.length ? 'var(--danger)' : 'var(--ink)'}">${unassigned.length}</div><div class="k">未归属地点</div></div>
        <div class="power-metric"><div class="v">${disputed.length + special.length}</div><div class="k">交界/共管</div></div>
        <div class="power-metric"><div class="v">${relPairs.length}</div><div class="k">势力关系边</div></div>
      </div>
      <div class="power-toolbar">
        <span>显示</span>
        <button class="power-filter${powerOnlyOwned ? '' : ' on'}" data-power-scope="all">全部 ${topCount}</button>
        <button class="power-filter${powerOnlyOwned ? ' on' : ''}" data-power-scope="owned">仅有据点 ${withPlaces}</button>
        <span>· 无据点的势力保留为可核查的数据缺口</span>
      </div>
      <div class="power-wrap">
        <table class="power-table">
          <thead><tr><th>势力</th><th>据点</th><th>首现</th><th>档案 / 结局线索</th><th>势力关系</th></tr></thead>
          <tbody>
            ${visibleRows.map(r => `
              <tr class="${r.places.length ? '' : 'power-gap-row'}">
                <td>
                  <button class="power-org" data-power-org="${r.org.id}">${entityIcon(r.org.type, 'entity-icon-sm')}${escHtml(r.org.name)}</button>
                  ${r.subs.length ? `<span class="power-sub">下辖：${r.subs.slice(0, 4).map(x => escHtml(x.name)).join('、')}${r.subs.length > 4 ? '…' : ''}</span>` : ''}
                </td>
                <td><div class="power-places">${r.places.length ? r.places.slice().sort(byFirstCh).map(placeChip).join('') : '<span class="power-gap">未记录据点（数据缺口）</span>'}</div></td>
                <td>${r.first ? '第 ' + r.first + ' 章' : '—'}</td>
                <td><span class="power-status" title="${escHtml(r.org.desc || '')}">${escHtml((r.org.desc || '无档案').slice(0, 88))}</span></td>
                <td><div class="power-rel">
                  ${r.conflict.length ? `<span class="enemy">敌对</span>：${r.conflict.join('、')}` : ''}
                  ${r.conflict.length && r.alliance.length ? '<br>' : ''}
                  ${r.alliance.length ? `<span class="ally">同盟</span>：${r.alliance.join('、')}` : ''}
                  ${!r.conflict.length && !r.alliance.length ? '<span class="power-gap">未见同盟/敌对边</span>' : ''}
                </div></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="power-extra">
        <div class="power-extra-card">
          <h3>交界与共管（不强行归给单方）</h3>
          <div class="chips">${[...disputed, ...special].length ? [...disputed, ...special].map(p => placeChip(p)).join('') : '<span class="power-gap">无</span>'}</div>
          <p>落沙坡按描述列为七玄门/野狼帮交界；血色禁地及其子地点按「七派共管」单列。</p>
        </div>
        <div class="power-extra-card">
          <h3>未归属地点（${unassigned.length}）</h3>
          <div class="chips">${unassigned.length ? unassigned.slice().sort(byFirstCh).map(p => placeChip(p)).join('') : '<span class="power-gap">无</span>'}</div>
          <p>这些地点只有行政/地理 parent，没有可核实的势力归属；保留为数据缺口，不猜。</p>
        </div>
        <div class="power-extra-card">
          <h3>势力关系摘录</h3>
          <div class="chips">${relPairs.length ? relPairs.map(x => `<span class="geo-badge ${x.type === 'conflict' ? '' : ''}" style="border-color:${x.type === 'conflict' ? '#EBC9C4' : '#CFE0D2'};color:${x.type === 'conflict' ? 'var(--danger)' : 'var(--ok)'}">${x.type === 'conflict' ? '敌对' : '同盟'} · ${escHtml(x.a)} ↔ ${escHtml(x.b)}</span>`).join('') : '<span class="power-gap">无</span>'}</div>
          <p>来自 relations 的 alliance / conflict 边；只展示势力顶层，不把人物关系混进来。</p>
        </div>
      </div>
    `;

    views.power.querySelectorAll('[data-power-scope]').forEach(b => b.addEventListener('click', () => {
      powerOnlyOwned = b.dataset.powerScope === 'owned';
      renderPower();
    }));
    views.power.querySelectorAll('[data-power-org]').forEach(b => b.addEventListener('click', () => select(b.dataset.powerOrg)));
    views.power.querySelectorAll('[data-power-place]').forEach(b => b.addEventListener('click', () => openPlace(b.dataset.powerPlace)));
    views.power.scrollTop = scrollTop;
  }


  function svgLine() {
    if (!CHAPTERS.length) return '';
    const W = 860, H = 190, P = 34;
    const minC = CHAPTERS[0].ch, maxC = CURRENT_CH;
    const X = c => P + ((c - minC) / Math.max(maxC - minC, 1)) * (W - P * 2);
    const Y = t => H - P - t * (H - P * 2 - 8);

    let path = '';
    CHAPTERS.forEach((c, i) => {
      path += (i === 0 ? 'M' : 'L') + X(c.ch).toFixed(1) + ' ' + Y(c.tension).toFixed(1) + ' ';
    });
    const area = path + `L${X(CHAPTERS[CHAPTERS.length - 1].ch).toFixed(1)} ${Y(0)} L${X(CHAPTERS[0].ch).toFixed(1)} ${Y(0)} Z`;

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#A6314A" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#A6314A" stop-opacity="0"/>
      </linearGradient></defs>
      ${[0.25, 0.5, 0.75, 1].map(t => `
        <line x1="${P}" y1="${Y(t)}" x2="${W - P}" y2="${Y(t)}" stroke="#F0ECE2" stroke-width="1"/>
        <text x="${P - 8}" y="${Y(t) + 3}" font-size="9" fill="#B4B2A9" text-anchor="end">${t}</text>`).join('')}
      <path d="${area}" fill="url(#g1)"/>
      <path d="${path}" fill="none" stroke="#A6314A" stroke-width="1.6" stroke-linejoin="round"/>
      ${CHAPTERS.map(c => `
        <circle cx="${X(c.ch).toFixed(1)}" cy="${Y(c.tension).toFixed(1)}" r="3.2"
          fill="${EMOTION_COLOR[c.emotion] || '#B4B2A9'}" stroke="#fff" stroke-width="1.2">
          <title>第${c.ch}章 ${c.title} · 张力${c.tension}</title>
        </circle>`).join('')}
      <text x="${P}" y="${H - 8}" font-size="9" fill="#B4B2A9">第 1 章</text>
      <text x="${W - P}" y="${H - 8}" font-size="9" fill="#B4B2A9" text-anchor="end">第 ${CURRENT_CH} 章</text>
    </svg>`;
  }

  /* ================= 节奏 ================= */
  const CH_PAGE_SIZE = 30;
  let chPage = 0;

  function renderRhythm() {
    const hookRate = CHAPTERS.length ? CHAPTERS.filter(c => c.hook).length / CHAPTERS.length : 0;
    const avgWords = CHAPTERS.length
      ? Math.round(CHAPTERS.reduce((a, c) => a + c.words, 0) / CHAPTERS.length) : 0;
    const shuang = CHAPTERS.filter(c => c.emotion === '爽').map(c => c.ch);
    let gap = '—';
    if (shuang.length > 1) {
      const gs = [];
      for (let i = 1; i < shuang.length; i++) gs.push(shuang[i] - shuang[i - 1]);
      gs.sort((a, b) => a - b);
      gap = gs[Math.floor(gs.length / 2)] + ' 章';
    }
    const isFanqie = (D.meta.platform || '').includes('番茄');
    const hookWarn = isFanqie && hookRate < 0.8;
    const done = (D.meta.coverage && D.meta.coverage.chapters_done) || CHAPTERS.length;
    const sampled = CHAPTERS.length < done;
    const sortedCh = CHAPTERS.slice().sort((a, b) => b.tension - a.tension);
    const chPages = Math.max(1, Math.ceil(sortedCh.length / CH_PAGE_SIZE));
    chPage = Math.min(chPage, chPages - 1);
    const pageCh = sortedCh.slice(chPage * CH_PAGE_SIZE, (chPage + 1) * CH_PAGE_SIZE);

    views.rhythm.innerHTML = `
      ${sampled ? `<div class="sample-note">
        章节数据为抽样（${CHAPTERS.length} / ${done} 章），爽点间隔与钩子率仅供参考；全量分析后指标才准确。
      </div>` : ''}
      <div class="metric-row">
        <div class="metric ${hookWarn ? 'warn' : ''}">
          <div class="k">章末钩子率</div>
          <div class="v">${(hookRate * 100).toFixed(0)}%</div>
          <div class="b">${isFanqie ? '番茄基准 80%' : '起点基准 60%'}</div>
        </div>
        <div class="metric">
          <div class="k">爽点间隔</div>
          <div class="v">${gap}</div>
          <div class="b">${isFanqie ? '番茄基准 3 章' : '起点基准 10 章'}</div>
        </div>
        <div class="metric">
          <div class="k">平均章字数</div>
          <div class="v">${avgWords}</div>
          <div class="b">${isFanqie ? '番茄基准 4000' : '起点基准 6000'}</div>
        </div>
        <div class="metric">
          <div class="k">已分析章节</div>
          <div class="v">${CHAPTERS.length}</div>
          <div class="b">全书 ${D.meta.chapters} 章</div>
        </div>
      </div>

      <h2>张力曲线 <span class="n">每点一章，颜色为情绪</span></h2>
      <div class="rhythm-wrap">${svgLine()}</div>

      <h2>章节明细 <span class="n">按张力排序 · 第 ${chPage + 1} / ${chPages} 页</span></h2>
      <div class="ch-list">
        ${pageCh.map(c => `
          <div class="ch-row" data-ch="${c.ch}">
            <div class="ch-no">第 ${c.ch} 章</div>
            <div>
              <div class="ch-title">${c.title}</div>
              <div class="ch-hook">${c.hook || '无钩子'}</div>
            </div>
            <div class="ch-badge" style="color:${EMOTION_COLOR[c.emotion] || '#888'}">${c.emotion} · ${c.tension}</div>
          </div>`).join('')}
      </div>
      ${pagerHTML(sortedCh.length, chPage, CH_PAGE_SIZE, 'chpage')}
    `;
    views.rhythm.querySelectorAll('[data-ch]').forEach(row => {
      row.addEventListener('click', () => {
        const c = CHAPTERS.find(x => x.ch === +row.dataset.ch);
        if (c) showChapter(c);
      });
    });
    views.rhythm.querySelectorAll('[data-chpage]').forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      chPage = +b.dataset.chpage;
      renderRhythm();
      const h = [...views.rhythm.querySelectorAll('h2')].find(x => x.textContent.trim().startsWith('章节明细'));
      if (h) h.scrollIntoView({ block: 'start' });
    }));
  }

  function showChapter(c) {
    panelBody.innerHTML = `
      <h2 class="ent-name">第 ${c.ch} 章</h2>
      <div class="ent-meta">${c.title} · ${c.words} 字 · 张力 ${c.tension}</div>
      <div class="chips">
        <span class="chip" style="color:${EMOTION_COLOR[c.emotion] || '#888'}">${c.emotion}</span>
        ${c.hook_type ? `<span class="chip">钩子：${c.hook_type}</span>` : ''}
      </div>
      <p class="ent-desc">${c.summary}</p>
      ${c.hook ? `<div class="sec-title">章末钩子</div><div class="attrs">${c.hook}</div>` : ''}
      ${(c.battles || []).length ? `<div class="sec-title" style="margin-top:16px">战斗</div>
        ${c.battles.map(b => `<div class="attrs">${(byId.get(b.a || b.s) || {}).name || '未知'} vs ${(byId.get(b.b || b.t) || {}).name || '未知'}
          · 境界差 ${b.gap > 0 ? '+' : ''}${b.gap} · ${b.note}</div>`).join('')}` : ''}
    `;
    panel.classList.add('open');
    animatePanelBody();
  }

  /* ================= 境界 ================= */
  function renderRealms() {
    // 主角（关系最多者）置顶，其余按最终修为降序
    const mainId = [...deg.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
    const chars = D.entities
      .filter(e => e.type === 'character' && (e.power_history || []).length)
      .sort((a, b) => {
        if (a.id === mainId) return -1;
        if (b.id === mainId) return 1;
        const pa = a.power_history[a.power_history.length - 1];
        const pb = b.power_history[b.power_history.length - 1];
        return levelNum(pb) - levelNum(pa);
      });

    const ladder = REALMS.map(r => {
      const st = r.stages || [];
      const base = realmBaseColor(r.id);
      const bars = st.length
        ? `<div class="rbar">${st.map((s, j) =>
            `<i style="background:${realmTone(r.id, st.length > 1 ? j / (st.length - 1) : 0)}" title="${s}"></i>`
          ).join('')}</div>`
        : '';
      const seen = st.length
        ? (D.entities.flatMap(e => e.power_history || []).filter(p => p.realm === r.id).length) : 0;
      return `
      <div class="realm-step" style="background:linear-gradient(135deg,${shade(base, 95)},${shade(base, 89)});border-color:${shade(base, 66)};border-left:3px solid ${shade(base, 48)}">
        <div class="rn" style="color:${shade(base, 32)}">${r.name}</div>
        <div class="rs">${st.length ? `${st.length} 个小阶` : '无细分'}${seen ? ` · ${seen} 条记录` : ''}</div>
        ${bars}
      </div>`;
    }).join('');

    const W = 800, P = 4;
    const minC = 1, maxC = CURRENT_CH;
    const X = c => P + ((c - minC) / Math.max(maxC - minC, 1)) * (W - P * 2);

    // 同一境界的相邻记录做浅→深渐变；跨境界时当前段止于已知色阶，
    // 下一段换新色相并回到浅色，避免把未证实的“巅峰”画出来。
    function realmSegFill(p, next) {
      const a = realmColorOf(p);
      if (next && next.realm === p.realm) {
        const b = realmColorOf(next);
        if (b !== a) return `linear-gradient(90deg, ${a} 0%, ${b} 100%)`;
      }
      return a;
    }

    const rows = chars.map(e => {
      const h = e.power_history;
      const segs = h.map((p, i) => {
        const from = p.ch;
        const to = (i + 1 < h.length) ? h[i + 1].ch : (e.last_ch || CURRENT_CH);
        return `<div class="gantt-seg" data-ent="${e.id}" style="left:${(X(from) / W * 100).toFixed(2)}%;
          width:${Math.max((X(to) - X(from)) / W * 100, 0.8).toFixed(2)}%;
          background:${realmSegFill(p, h[i + 1])}" title="${powerFull(p)} · 第${from}章${p.note ? ' · ' + p.note : ''}"></div>`;
      }).join('');
      const latest = h[h.length - 1];
      const isMain = e.id === mainId;
      return `<div class="gantt-row${isMain ? ' main' : ''}">
        <div class="gantt-name" data-ent="${e.id}">${e.name}${isMain ? ' ★' : ''}</div>
        <div class="gantt-track">${segs}</div>
        <div class="gantt-now">${powerFull(latest)}</div>
      </div>`;
    }).join('');

    const battles = [];
    CHAPTERS.forEach(c => (c.battles || []).forEach(b => battles.push(Object.assign({ ch: c.ch }, b))));

    views.realms.innerHTML = `
      <h2>境界阶梯 <span class="n">${REALMS.length} 级</span></h2>
      <div class="realm-ladder">${ladder}</div>

      <h2>各角色境界轨迹 <span class="n">横轴为章号</span></h2>
      <div class="gantt-note">同一境界内由浅到深；突破到下一境界后换色、重新从浅色开始。未记录到的小阶不推断为巅峰。</div>
      <div class="gantt">
        ${rows}
        <div class="gantt-axis" style="margin-left:78px">
          ${[1, 30, 60, 90, CURRENT_CH].map(c => `
            <span class="gantt-tick" style="left:${(X(c) / W * 100).toFixed(2)}%">${c}</span>`).join('')}
        </div>
      </div>

      ${battles.length ? `
      <h2>战斗记录 <span class="n">负值为越级挑战</span></h2>
      ${battles.map(b => {
        const pa = powerAtCh(b.a || b.s, b.ch), pb = powerAtCh(b.b || b.t, b.ch);
        const diff = levelNum(pa) - levelNum(pb);
        return `
        <div class="battle-row">
          <div class="ch-no" style="color:#9A9488">第 ${b.ch} 章</div>
          <div class="battle-vs">
            <span>${(byId.get(b.a || b.s) || {}).name || '未知'} <b>${powerFull(pa)}</b></span>
            <span class="vs">vs</span>
            <span>${(byId.get(b.b || b.t) || {}).name || '未知'} <b>${powerFull(pb)}</b></span>
          </div>
          <div style="color:${diff < 0 ? '#C0392B' : '#5A7A5E'}">
            ${diff < 0 ? `境界差 ${fbLayer(diff)} · 越级` : diff > 0 ? `境界差 +${fbLayer(diff)}` : '同阶'}
          </div>
        </div>`;
      }).join('')}` : ''}
    `;
    views.realms.querySelectorAll('[data-ent]').forEach(el => {
      el.addEventListener('click', () => select(el.dataset.ent));
    });
  }

  /* ================= 伏笔 ================= */
  const FS_PAGE_SIZE = 15;
  let fsPage = 0;
  let fsFilter = 'all';
  const FS_FILTER_LABEL = { all: '全部', overdue: '已超期', planted: '待回收', paid: '有回收章', dropped: '已放弃' };
  const chByCh = new Map(CHAPTERS.map(c => [c.ch, c]));

  function fsEvidence(f) {
    if (f.payoff_ch && f.payoff_ch !== f.plant_ch) {
      return {
        label: '回收章（抽取判定）', ch: f.payoff_ch,
        note: '看到第 ' + f.payoff_ch + ' 章有回收记录，正文语义仍需抽样复核'
      };
    }
